description: |-
  esponsResearch Position in Padua (IT): DFT simulations of complex materials

  This is an informal advertisement for a soon to be open position in the Department of Physics of the University of Padua (Italy) for an Incarico di ricerca. The contract has a length of 24 months and it is open to candidates who completed their Master's degree no more than 6 years prior to the start of the contract. The research involves the ab-initio simulation of the electronic properties of 2D and dielectric materials. A special focus will be given to the pairing of ab-initio molecular dynamic runs and NMR response simulations. The work will be carried out in collaboration with experimental collaborators.

  The ideal candidate:

      Holds a Master's degree or a PhD in Physics, Chemistry, Materials Science, or a related field

      Has expertise in solid-state physics and/or solid-state chemistry

      Is fluent in python programming

      Has a basic knowledge of Machine Learning and Neural Networks

      Does not need to have expertise in ab-initio simulations of the electronic structure, but this is considered an advantage

  To receive more details and information about the candidature, interested candidates can contact Dr. Federico Brivio at febrivio pd.infn.it, using the subject "[IR 2026] + $YOUR_SURNAME".

  The Incarico di ricerca is a new type of contract in the Italian system, which is open to candidates holding either a PhD or a Master's degree. As mentioned above, the Master's degree must have been obtained before the closing of the application and no more than 6 years prior to the start of the contract. Assuming as start date the 1st December 2026, this means that the Master's degree must have been obtained after the 1st December 2020.

  The candidate will be selected through a public selection procedure that will be advertised on EURAXESS. The application will be posted online after the 1st of November and will remain open for 2 weeks. The selection procedure will consist of an evaluation of the CVs followed by a short interview (~ 10 minutes) about the candidate's past experience, such as their work done during the Master's or PhD thesis. It will be possible to do the interview online.

  The successful candidate must take service before the 1st of January 2027, and the contract must be signed in person before then. Due to the festivities, this means that the contract will need to be signed before the 18th of December 2026.

  The position is open to both European and non-European citizens, but candidates must obtain the right to work in Italy by the start of the contract.

  The net salary is approximately €1,650/month (RAL: €22,699). It may be possible to obtain a significant tax reduction (~ €200/month) by moving one's tax residency to Italy. Further details and requirements for applying for these tax benefits are provided by the Italian Revenue Agency: https://www.agenziaentrate.gov.it/portale/web/english/nse/individuals/tax-incentives-for-attracting-human-capital-in-italy .

