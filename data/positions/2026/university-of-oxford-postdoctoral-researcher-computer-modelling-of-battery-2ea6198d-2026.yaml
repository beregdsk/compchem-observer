description: A postdoctoral research position is available at the University of
  Oxford within the group of Prof Saiful Islam, part of The Faraday Institution
  3D-CAT project. The research focuses on the computer modelling and materials
  design of lithium battery cathodes, investigating structural, redox,
  transport, and interface properties of Li-rich three-dimensional materials
  using advanced computational techniques such as density functional theory,
  molecular dynamics, cluster expansion, and machine learning.
