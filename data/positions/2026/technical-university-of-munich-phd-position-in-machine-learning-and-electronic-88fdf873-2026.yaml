description: PhD position in the AI-Based Materials Science group at TU Munich,
  part of the e-conversion Excellence Cluster. You will develop automated
  computational discovery workflows for CO2 photoreduction using
  first-principles electronic-structure theory and machine learning (Bayesian
  optimization) to guide experimental synthesis of lead-free double perovskites.
  We seek a Master's graduate in physics, chemistry, or materials science with
  Python experience and interest in DFT/ML. We offer a 3-year funded PhD
  position (75% TV-L E13) in an international, interdisciplinary team.
