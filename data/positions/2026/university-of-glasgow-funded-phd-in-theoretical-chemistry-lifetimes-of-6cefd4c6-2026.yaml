description: A fully funded PhD studentship at the University of Glasgow
  focusing on transient molecular anions and short-lived resonance states. The
  project uses stabilisation approaches to extract resonance energies and
  lifetimes from conventional bound-state electronic structure calculations,
  focusing on astrochemically relevant aromatic and heteroaromatic molecules.
  Candidates need a background in theoretical/physical chemistry, chemical
  physics, or physics.
