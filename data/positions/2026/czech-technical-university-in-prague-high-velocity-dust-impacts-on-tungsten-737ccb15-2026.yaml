description: PhD fellowship co-funded by Marie Skłodowska-Curie Actions,
  focusing on computational materials science. The project, 'High-Velocity Dust
  Impacts on Tungsten Plasma-Facing Materials', investigates dust-induced damage
  in fusion reactors using molecular dynamics simulations, experimental
  validation on tungsten samples, and machine learning to create a predictive
  multi-scale modeling framework for resilient material design.
