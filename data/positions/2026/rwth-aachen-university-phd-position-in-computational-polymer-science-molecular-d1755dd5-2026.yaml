description: >-
  PhD Position in Computational Polymer Science: Molecular Modelling and Machine
  Learning fat RWTH Aachen


  *Doctoral (f/m/d) - position at the MODES research group at RWTH Aachen

  University*

  *Start date: *January 2027 or as soon as possible thereafter.


  Research Project: The development of sustainable, high-performance polymers

  is increasingly important for the chemical and materials industries.

  However, designing polymers with tailored mechanical properties remains a

  challenging and resource-intensive process, relying heavily on experimental

  synthesis, testing and iterative optimization. This project aims to develop

  an AI-driven Digital Twin for sustainable polymer development, combining

  atomistic simulations, molecular dynamics, machine learning and

  coarse-grained modelling to accelerate the design and optimization of

  industrial polymer systems. A particular focus will be placed on

  thermoplastic polyurethanes (TPUs), an important class of versatile

  polymers whose mechanical properties can be tailored through their chemical

  composition, molecular architecture, hard- and soft-segment content, and

  processing conditions. The successful candidate will develop the

  computational methodologies and simulation workflows required to generate

  realistic TPU molecular structures and predict their macroscopic mechanical

  properties. The ultimate objective is to establish a reliable connection

  between polymer synthesis, molecular structure, morphology and mechanical

  performance, enabling the virtual design and optimization of TPUs.Your

  Responsibilities


  The PhD candidate will work at the interface of computational chemistry,

  polymer physics, molecular simulation and machine learning. The main

  responsibilities will include:

     -

     *Development of realistic TPU molecular structures:* Investigate and
     implement computational approaches for generating representative TPU
     molecular architectures, accounting for polymer composition, segment
     distributions, molecular weight distributions, chain lengths and chemical
     connectivity.
     -

     *Modelling of polymer synthesis:* Develop simulation workflows to
     reproduce relevant aspects of TPU formation and polymer growth, including
     the influence of synthesis conditions on molecular architecture and
     molecular weight distributions.
     -

     *Atomistic molecular dynamics simulations:* Develop and apply atomistic
     simulation strategies to investigate TPU structure, conformational
     properties, intermolecular interactions and the formation of hard- and
     soft-segment domains.
     -

     *Machine-learning-based molecular modelling:* Explore and implement
     machine-learning interatomic potentials to improve the accuracy and
     computational efficiency of atomistic simulations of polyurethane systems.
     -

     *Coarse-grained modelling:* Develop and validate coarse-graining
     strategies that enable simulations of larger polymer systems and longer
     timescales, while retaining the structural and thermodynamic properties
     relevant to TPU behaviour.
     -

     *Prediction of mechanical properties:* Establish computational workflows
     for predicting mechanical properties, including elastic moduli,
     stress–strain behaviour, deformation mechanisms and hardness, based on the
     generated molecular structures and simulated polymer morphologies.
     -

     *Structure–property relationships and validation:* Systematically
     investigate how molecular architecture, phase separation, hard-segment
     organization and processing-related structural features influence
     macroscopic mechanical performance. Validate simulation results against
     experimental data obtained in collaboration with an industrial partner.
     -

     *Integration into the TPU Digital Twin:* Translate the developed
     methodologies into reproducible and automated workflows that can ultimately
     be integrated into the broader AI-driven polymer Digital Twin framework.

  The candidate will have considerable scientific freedom to investigate and

  compare different modelling strategies, identify their limitations and

  develop new approaches where existing methods are insufficient.

  Your Profile


  We are looking for a highly motivated researcher with a strong interest in

  computational materials science and molecular modelling.


  *Required qualifications:*

     -

     A Master's degree in Computational Chemistry, Computational Physics,
     Materials Science, Chemical Engineering, Mechanical Engineering or a
     related discipline.
     -

     Solid knowledge of molecular dynamics, atomistic simulations and
     statistical mechanics.
     -

     Experience with scientific programming, preferably Python.
     -

     Good understanding of thermodynamics and molecular interactions.
     -

     Strong analytical skills and an interest in developing new computational
     methodologies.
     -

     Very good written and spoken English.

  *Desirable qualifications:*

     -

     Experience with polymer modelling, polymer physics or molecular
     simulation of soft matter.
     -

     Knowledge of machine-learning interatomic potentials or machine learning
     applied to materials science.
     -

     Experience with coarse-grained molecular dynamics or multiscale
     modelling.
     -

     Familiarity with molecular simulation packages such as LAMMPS, GROMACS
     or OpenMM.
     -

     Experience with high-performance computing environments.

  Previous experience with TPU modelling is not required. We particularly

  welcome candidates with a strong background in molecular simulation who are

  motivated to develop expertise in polymer science.

  What We Offer

     -

     The opportunity to work on an interdisciplinary research project at the
     intersection of computational chemistry, materials science, machine
     learning and polymer engineering.
     -

     Close collaboration with an industrial partner and access to
     experimental data from real industrial TPU systems.
     -

     Access to modern high-performance computing infrastructure.
     -

     The opportunity to develop novel computational methodologies with direct
     relevance to industrial polymer development.
     -

     A collaborative and interdisciplinary research environment at RWTH
     Aachen University.
     -

     Opportunities to publish scientific results in leading international
     journals and present research at international conferences.

  *Interested in this doctoral position? Please send a (maximum) 2-page cover

  letter, a CV, transcripts, list of 3 references, and any other supporting

  documents in a single PDF with the subject “AixSyn PhD” to Prof. Abhishek

  Khetan via email at *askhetan@modes.rwth-aachen.de *or *askhetan@gmail.com


