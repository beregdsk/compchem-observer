description: >-
  3-year PhD Studentship in Computational Photochemistry, Queen Mary University
  of London, UK


  A fully funded, 3-year PhD scholarship is available in the School of Physical
  and Chemical Sciences at QMUL, working with Dr Federico
  Hernandez<https://www.seresearch.qmul.ac.uk/ccr/people/fhernndez/> on
  “Nanoplasmonics for molecular activation and photocatalysis”.

  Funding and start date

  The studentship covers tuition fees and stipend. Applicants must qualify for
  Home fee status. The PhD can start in April 2027 or September/October 2027.

  Project Details

  Metal nanoparticles act as tiny optical antennas, concentrating light near
  their surfaces through localised surface plasmon resonances. As these
  resonances decay, they can generate energetic electrons and holes known as hot
  carriers. By transferring charge or energy to molecules bound to the surface,
  hot carriers can excite specific vibrations and weaken chemical bonds,
  enabling reactions at photon energies below those needed for direct electronic
  excitation of the molecules.

  In this PhD, the candidate will develop computational protocols to investigate
  the ultrafast energy transfer at metal–molecule interfaces by tracking how
  charge and energy move across metal–molecule interfaces on ultrafast
  timescales. You will use these simulations to identify which features of an
  interface favour molecular activation, predict the chemical nature and
  topology of an interface that favours molecular activation, and predict which
  interfaces are most promising for photocatalysis

  Understanding how to control charge/energy transfer will guide the design of
  materials for next-generation solar technologies and help make light-driven
  chemical reactions more selective.

  Training and development: In this computational project, the candidate will
  gain experience in applying and developing state-of-the-art atomistic
  simulation methods for photochemistry in complex environments. Using real-time
  electron–nuclear dynamics, the candidate will model the interaction of a laser
  pulse with a metal–molecule system and simulate ultrafast transient absorption
  spectra. This will teach how to connect the motion of electrons and nuclei to
  simulated signals that can also be measured experimentally. The candidate will
  also use multiscale surface hopping to study nonadiabatic dynamics and
  investigate how transitions between electronic states and molecular motion
  influence one another.

  Candidate requirements: I am looking for candidates who hold, or expect to
  obtain, a master's degree in chemistry, physics or materials science and have
  a background in theoretical or physical chemistry, chemical physics or
  physics. The candidate should have an interest in theoretical and
  computational photochemistry, experience with quantum chemistry calculations
  and scientific programming, and an enquiring approach to research.
  Additionally, the candidate should also be able to work well in a team and
  communicate clearly in spoken and written English.

  Familiarity with excited-state calculations, nonadiabatic dynamics, numerical
  methods, Linux and high-performance computing, or ultrafast spectroscopy would
  be an advantage.

  Supervisor Contact Details:

  For informal enquiries about this position, please contact Dr Federico
  Hernandez at: f.hernandez@qmul.ac.uk<mailto:f.hernandez@qmul.ac.uk>


  How to apply:

  Applications are invited before 31 January 2027 by emailing your CV, a cover
  letter and the contact details of two referees to
  f.hernandez@qmul.ac.uk<mailto:f.hernandez@qmul.ac.uk>.


