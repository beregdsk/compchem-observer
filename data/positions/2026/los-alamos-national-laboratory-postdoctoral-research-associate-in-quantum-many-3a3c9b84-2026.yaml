description: Postdoctoral position in the Quantum and Condensed Matter Physics
  Group at Los Alamos National Laboratory. The focus is on quantum many-body
  perturbation theory and its extension to non-equilibrium problems to model
  scanning tunneling spectroscopy of transuranic compounds, combined with
  machine learning techniques for analyzing theoretical and experimental
  spectra. Requires expertise in quantum many-body calculations and programming
  in Python, C++, or Fortran.
