description: A postdoctoral position is available in the group of Prof. Basile
  Curchod at the University of Bristol, UK, under the ERC ISPAMIA project. The
  project investigates the photochemistry of atmospheric volatile organic
  compounds (VOCs) in aqueous aerosols. The researcher will study VOC
  interactions with the air-water interface using machine-learned potentials to
  accelerate sampling and calculate photoabsorption cross-sections via
  electronic-structure theory. Candidates should hold a PhD in
  Physical/Theoretical/Computational Chemistry or Physics, with experience in
  molecular dynamics…
