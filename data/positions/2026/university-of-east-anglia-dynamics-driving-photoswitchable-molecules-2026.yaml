description: A PhD position is available in the research group of Associate
  Professor James Bull at the University of East Anglia (UEA), Norwich, UK,
  starting in October 2027. The project investigates the molecular dynamics of
  photoswitchable molecules (such as photomolecular motors, stilbenes, and
  azobenzenes), focusing on excited-state relaxation, photoisomerisation
  pathways, and quantum yields in gas-phase and solution. The student will use
  advanced laser spectroscopy techniques, including PISA and transient
  absorption spectroscopy.
