description: >-
  1 Post-Doc position in Theory of Solid State Quantum Bits


  Dear Psi-K Community,


  We are looking for a postDoc for one year to work with the

  theory group of Dr. Michel Bockstedte at Johannes Kepler University

  Linz on the ab initio theory of color centers and molecular

  systems. The full position is part of the Linz Quantum Center led by Prof.

  Dr. Alberta Bonnani.


  Prototypical color centers in semiconductors or molecular systems,

  have been identified as promising candidates for the implementation of

  quantum applications such as quantum sensing or quantum

  networks. Their coupled electron spins feature correlated

  high/low-spin states and an optical cycle with a spin-selective

  relaxation path via intermediate states that enable spin-selective

  manipulation e.g., via photo-excitation, magnetic fields or

  mechanics. Advanced quantum embedding theory of a color center or molecule

  via a hamiltonian with an effective screened Coulomb interaction

  and a configuration-interaction approach has provided access to

  a quantitative understanding of the involved physics and opens access

  to theory-based qubit engineering [2,3].


  The predictive power of this approach regarding the high/low spin and

  intermediate states has been demonstrated largely for color centers in

  semiconductor and for selected molecular systems.  Being based on

  density functional theory/many-body perturbation theory, the modelling

  capabilities extend beyond the pivotal determination of the active

  qubit states [2,3] to the spin-selective transitions, strain-coupling,

  and other important spectroscopic properties [4].


  Despite the convincing results, excited states are predicted to be

  smaller than in experiments. Although this systematic deviation is

  quite small for prototypical color centers or selected molecules, in

  the general case this deviation, with origin in the many-electron

  self-interaction error, may compromise the predictive power of the

  approach.


  The project will address/identify test systems for a proper

  experiment-theory benchmark in collaboration with our local experimental

  partners and explore approaches to mitigate the effect, for instance

  by enforcing the generalized Kopmans theorem for the starting point or

  by addressing the double counting terms. The detailed project will be

  discussed with the successful candidate and will depend on his or her

  skills and experience.


  The successfull candidate holds a PhD in physics or chemistry with a

  specialization in theoretical solid state physics or theoretical

  chemistry. A strong background in electronic structure theory or

  computational physics is highly welcome, preferably with experience in

  density functional theory, many body perturbation theory (GW or DMFT),

  or quantum chemical wave-function based methods alongside with programming

  skills. Our working language is English, knowledge of German is

  welcome, but not necessary.


  The position is available from January 2027. Evaluation

  of application will start end of November and will continue

  until the position is filled.


  The Johannes Kepler University considers performance in the context of

  each individual's biography and opportunities. In this regard,

  qualifications are assessed and evaluated in terms of equal

  opportunity, taking life-course factors, such as academic age, into

  account.


  The Johannes Kepler University wishes to increase the

  proportion of academic female researchers and, for this reason, especially

  welcomes and encourages applications by qualified women. If applicants

  are equally qualified, a woman will be given preference for this

  position. The university welcomes applications from qualified

  applicants with disabilities. These applications will be given special

  consideration.


  Applications or further inquiries should be directed to Dr. Michel

  Bockstedte (michel.bockstedte@jku.at) in pdf-format. Application should

  include a brief letter of motivation, a curriculum vitae, a list of

  publications, a summary of past accomplishments, copies of the PhD and

  Master/Bachelor-certificates, and should be accompanied by two letters

  of recommendations (or arrangements thereof).


  [1] G. Wolfowicz, F.J. Heremanns, Ch.P. Anderson, Sh.Kanai, H. Seo, A. Gali,
  G. Galli, D.D. Awschalom, Nat. Mater. 6, 906 (2021).

  [2] M. Bockstedte, et al., npj Quant Mater 3, 31 (2018).

  [3] H. Ma, N. Sheng, M. Govoni, G. Galli, J. Chem. Theory Comput. (2022);
      S. Chen, V. Yu, Yu Jin, M. Govoni, G. Galli, J. chem. theory Comput. (2025).
  [4] M. Widmann, M. Bockstedte, A. Gali, Sang-Yun Lee, J. Wrachtrup et al. Nano
  Lett. 19, 7173 (2019);

  [5] T. Steidl, M. Bockstedte, A. Gali, V. Vorobyov, J. Wrachtrup, et al. Nat.
  Commun. 16, 4669 (2025);

  [6] M. Hollendonner,  M. Schober, D.B.R. Dasari, M. Bockstedte, R. Nagy et al.
  arXiv:2604.16194


