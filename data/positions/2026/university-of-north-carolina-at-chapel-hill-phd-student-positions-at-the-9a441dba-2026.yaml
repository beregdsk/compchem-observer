description: The Kanai Research Group at the University of North Carolina at
  Chapel Hill expects openings for PhD students starting in August 2027. The
  group focuses on developing and applying first-principles computational
  methods for excited-state properties and non-equilibrium electron dynamics in
  condensed-matter systems. Students can pursue a PhD in physical chemistry or
  condensed-matter physics. Applications are due in December 2026.
