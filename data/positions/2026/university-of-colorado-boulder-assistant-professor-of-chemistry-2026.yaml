description: The Department of Chemistry at the University of Colorado Boulder
  invites applications for a tenure-track Assistant Professor of Chemistry.
  Areas of particular interest include quantum molecular science, such as
  electronic structure theory, molecular modeling, and quantum dynamics, as well
  as the application of machine learning to theoretical chemistry. Candidates
  should have a compelling vision for developing new theory and methods at the
  interfaces of quantum science, condensed phase and materials chemistry,
  catalysis, reaction dynamics, spectroscopy, or biophysical chemistry.
