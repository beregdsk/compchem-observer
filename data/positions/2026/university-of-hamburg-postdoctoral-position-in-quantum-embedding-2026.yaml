description: Postdoctoral position in the development of quantum embedding
  methods for molecular quantum materials at the University of Hamburg, in the
  group of Dr. Johannes Tölle. The researcher will develop novel quantum
  embedding strategies to describe electronic phases of molecular quantum
  materials, including theoretical framework, numerical implementation, and
  validation. Candidates need a Ph.D. in chemistry, physics, or related fields,
  with experience in electronic structure method development and beyond DFT
  calculations.
