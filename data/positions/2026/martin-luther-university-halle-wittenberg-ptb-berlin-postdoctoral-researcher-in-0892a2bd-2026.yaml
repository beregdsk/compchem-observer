description: Postdoctoral position within the NaSPHERE consortium at MLU Halle
  and PTB Berlin, focusing on sodium-sulfur batteries with polymeric cathodes.
  The project investigates sodiation thermodynamics/kinetics and spectroscopic
  fingerprints (IR, Raman, XAFS, XPS) using DFT/TDDFT and interface dynamics
  modeling. Jointly supervised by Prof. Dr. Daniel Sebastiani and Dr. Pouya
  Partovi-Azar. Requires a PhD in Chemistry, Physics, or Materials Science, with
  a strong background in quantum chemistry, DFT, AIMD, and electrochemical
  energy storage.
