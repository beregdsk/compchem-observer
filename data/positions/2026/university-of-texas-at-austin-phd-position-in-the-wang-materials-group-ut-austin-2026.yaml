description: Up to two PhD positions are available in the Wang Materials Group
  at the University of Texas at Austin starting Fall 2027. Research focuses on
  defects and interfaces in 2D material heterostructures, and computational
  engineering of optoelectronic semiconductor properties for energy
  sustainability, electrochemistry, and neuromorphic computing. Applications are
  accepted via the McKetta Department of Chemical Engineering or the Texas
  Materials Institute.
