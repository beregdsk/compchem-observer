description: Fully-funded PhD studentship at the Cardiff Catalysis Institute,
  Cardiff University. The project investigates water-associated catalyst
  degradation during sustainable aviation fuel production, combining atomistic
  simulation and machine learning with experimental collaborators at the
  University of Manchester and bp. The candidate will receive training in
  atomistic simulation, catalysis, machine learning, and scientific computing,
  contributing to net-zero technologies.
