description: Four fully funded PhD positions in RIXS theory and experiment are
  available at the University of Zurich, Stockholm University, and Paul Scherrer
  Institute. The project will develop a multi-level RIXS simulation toolkit
  within CP2K, combining linear-response TDDFT, wavefunction-in-DFT embedding,
  and quantum-computing interfaces. Research focuses on charge-transfer
  excitations in photochemical systems and insulator-metal transitions in
  vanadium oxides. Three positions are theory-focused at UZH and SU, one is
  experimental at PSI, with close collaboration.
