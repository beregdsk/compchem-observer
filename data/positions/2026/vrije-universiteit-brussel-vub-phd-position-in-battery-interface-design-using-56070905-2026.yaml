description: >-
  Urgent PhD Position Available at SUME VUB (Brussels, Belgium)


  We are seeking a highly motivated PhD candidate to join the Sustainable
  Materials Engineering (SUME) Research Group at Vrije Universiteit Brussel
  (VUB) under the supervision of Prof. Dr. Ir. Mesfin Haile Mamme.


  🔋 Research Topic: Battery Interface Design Using AI-Driven Modelling and
  Multiscale Simulations


  This PhD project focuses on understanding and engineering next-generation
  battery interfaces by combining DFT, AIMD, Molecular Dynamics (MD), Finite
  Element Modelling (FEM), and AI/Machine Learning. The goal is to accelerate
  the discovery and optimization of solid-solid and solid-liquid interfaces for
  high-performance energy storage systems.


  Key Responsibilities

  ✅ Perform DFT/AIMD simulations of battery interfaces

  ✅ Conduct MD simulations of electrode-electrolyte systems

  ✅ Develop FEM models for interface and degradation analysis

  ✅ Integrate AI/ML to accelerate multiscale modelling and materials discovery

  ✅ Publish in leading journals and collaborate within an interdisciplinary team


  Requirements

  ✔ Master's degree in Materials Science, Chemistry, Physics, Chemical
  Engineering, or related fields

  ✔ Strong experience with DFT (VASP, Quantum ESPRESSO, etc.)

  ✔ Experience in MD simulations (GROMACS, LAMMPS, etc.)

  ✔ Programming skills (Python or similar)

  ✔ Excellent English communication skills

  ✔ Must have permission to work in Europe (EU residence, work permit, or
  equivalent)

  📍 Location: VUB, Etterbeek Campus, Brussels, Belgium

  📅 Start date: as soon as possible, no later than February 2027


  Application

  Interested candidates should submit a single PDF containing: • CV

  • Cover letter

  • Contact details of two references

  📧 Email: mmamme@vub.be no later than 1st December 2026!

  📝 Subject: PhD_in_ELEVATE


