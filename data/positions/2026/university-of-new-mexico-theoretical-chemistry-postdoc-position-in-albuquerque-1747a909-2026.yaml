description: >-
  Theoretical Chemistry Postdoc position in Albuquerque, New Mexico, USA


  A postdoctoral position in theoretical and computational chemistry is open in
  the group of Prof. H. Guo at University of New Mexico. We are interested in
  physical and chemical processes on solid and liquid surfaces. The minimal
  requirements include a PhD degree in theoretical/computational chemistry.
  Experience in computational physics/chemistry is preferred. The initial
  appointment is for one year, but renewable upon mutual agreement. Yearly
  salary starting from $50,000 to $60,000 depending on experience. We work
  closely with top theoretical and experimental groups around the globe.

  Albuquerque is the largest city in New Mexico and near several national
  research facilities such as the Air Force Research Lab, the Sandia National
  Labs, and Los Alamos National Lab. It has a mild climate and ample
  opportunities to explore the “Land of Enchantment” and the Southwest.

  Please send CV with publication list and three recommendation letters to Prof.
  H. Guo, Department of Chemistry and Chemical Biology, University of New
  Mexico, Albuquerque, NM 87131, USA. (Email: hguo@unm.edu).


  To join or leave the molecular-dynamics-news email list, go to:

  http://www.jiscmail.ac.uk/lists/molecular-dynamics-news.html
