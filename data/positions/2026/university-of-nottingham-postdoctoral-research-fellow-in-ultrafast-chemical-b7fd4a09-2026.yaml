description: Up to two postdoctoral researchers are sought for the UKRI-funded
  'Transition State Imaging' project at the University of Nottingham. The role
  involves designing and commissioning a mass-selective instrument for
  negatively-charged molecular ions and clusters, using time-resolved Coulomb
  explosion imaging to study ultrafast structural dynamics upon photodetachment.
  Candidates should have a PhD in physical chemistry or physics, with experience
  in scientific instrument development, femtosecond lasers, mass spectrometry,
  or charged particle imaging.
