description: Join the Molecular Quantum Theory Group at University College
  London, led by Dr Hugh Burton, as a Postdoctoral Research Fellow. You will
  work on a project quantifying utilizable entanglement in chemistry from first
  principles, deriving theoretical models for fermion entanglement and
  developing computational software to predict these phenomena in molecular
  systems.
