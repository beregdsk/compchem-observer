description: >-
  Postdoctoral position in quantum chemistry and artificial intelligence, IPSA /
  Université Gustave Eiffel, Paris (France)


  A post-doctoral position is open at PARIS region (France) for molecular
  modelling and Raman, IR and NMR Spectroscopies applied to biofuels.

  The candidate will develop a theoretical and computational methodology for
  characterizing three molecular families of interest for biofuels: triolein, as
  a representative triacylglycerol (TAG); ketones and methyl ketones; and
  botryococcenes, hydrocarbons produced by algae.

  The study will combine quantum chemistry, artificial intelligence and Raman,
  infrared (IR) and nuclear magnetic resonance (NMR) spectroscopies to identify
  their specific molecular signatures.

  The candidate will generate, select and optimise the relevant conformers of
  these molecules using machine learning based methods.

  The candidate will simulate the Raman and IR spectra and calculate NMR
  parameters using density functional theory (DFT) approaches.

  The theoretical results will be compared with experimental data to assign
  vibrational bands, chemical shifts and the main characteristic signals.

  Artificial intelligence methods may be developed to classify spectra, predict
  molecular signatures and distinguish these compounds in algal and lipid
  matrices.


  Main responsibilities:

  -	Generation and DFT optimization of relevant molecular conformers

  -	Development of machine-learning models for spectral classification,
  differentiation and prediction

  -	Creation of a database of Raman, IR and NMR spectra for triolein, ketones or
  methyl ketones, and botryococcenes

  -	Simulation of Raman/IR frequencies and intensities and calculation of NMR
  parameters, particularly chemical shifts

  -	Comparison of theoretical results with experimental spectra and assignment
  of molecular signatures


  The appointment period is initially for one year. The fellowship includes a
  gross monthly salary ranging between €2900-€3500 depending on the experience
  of the candidate.

  Expected start date: 1st of December 2026


  To apply, please send a detailed CV including a list of publications, two
  reference letters and copies of degree certificates to Prof. Majdi Hochlaf
  (majdi.hochlaf@univ-eiffel.fr) and Dr. Héla Friha (hela.friha@ipsa.fr) as soon
  as possible and no later than the 1st of November 2026.


