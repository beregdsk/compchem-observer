description: A two-year postdoctoral position at CEA Grenoble (IRIG) focusing on
  theory and modeling of silicon/germanium electron and hole spin qubits. The
  work involves using DFT, atomistic tight-binding, and k.p methods to study
  structural/electronic properties, spin manipulation, exchange interactions,
  decoherence, and spin shuttling in Si/SiGe and Ge/SiGe heterostructures,
  within the European SPINS project. The candidate will join a team of over 40
  researchers and collaborate with European partners.
