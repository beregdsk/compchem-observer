description: A fully funded 4-year PhD position at the School of Chemistry,
  University of Nottingham, under Prof Elena Besley. The project focuses on
  computational modelling of next-generation atomically thin 2D semiconductors
  as part of the EPSRC NEED2D programme. It involves predicting electronic
  structure and transport properties, investigating growth stages, and
  developing many-body Green's function theory methods. Candidates should have a
  background in theoretical/physical chemistry, chemical physics, or physics,
  with quantum chemistry and programming experience an advantage.
