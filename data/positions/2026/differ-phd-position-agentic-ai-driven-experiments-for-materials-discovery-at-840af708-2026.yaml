description: PhD position at the Autonomous Energy Materials Discovery (AMD)
  group at DIFFER, Eindhoven. The project focuses on building an agentic AI
  workflow that translates AI-proposed alloy compositions into executable
  synthesis and characterisation plans, and generating experimental evidence of
  material realisability. Responsibilities include high-throughput synthesis
  using a nanoparticle printer, characterisation via micro-XRF and SEM,
  developing reproducible Python pipelines, and maintaining a structured
  FAIR-aligned dataset of outcomes to support AI model development.
