description: >-
  PhD Position - Modelling Exciton Physics in 2D Nanoarchitectures | DIPC, San
  Sebastian, Spain


  We are looking for a PhD student to join us at the Donostia International
  Physics Center (DIPC), San Sebastian, Spain.


  The project will focus on the theoretical and computational study of excitons
  in 2D carbon nanoarchitectures, including nanoporous graphene and van der
  Waals heterostructures. The research will combine first-principles
  calculations, microscopic modelling, and machine learning techniques.


  The PhD will be co-supervised by Aran Garcia-Lekue (DIPC) and Bartomeu
  Monserrat (University of Cambridge), in close collaboration with Aitor
  Mugarza’s experimental group at ICN2 (Barcelona).


  The position is expected to start in January/February 2027 and for a total
  length of up to 36 months.


  Contact info: bm418@cam.ac.uk (Bartomeu Monserrat), wmbgalea@ehu.eus (Aran
  Garcia-Lekue).


