description: A PhD position exploring how symmetry breaking at crystal surfaces
  can generate measurable magnetic and electronic signals revealing the
  underlying antiferromagnetic state. The student will combine symmetry
  analysis, first-principles DFT calculations, and complementary theoretical
  methods to understand the microscopic origin of these surface-induced signals
  and identify promising materials for experimental detection.
