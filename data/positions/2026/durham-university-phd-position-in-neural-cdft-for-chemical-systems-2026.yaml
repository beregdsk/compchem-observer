description: Two fully funded 4-year PhD positions are available in the Cox
  Group at Durham University, starting in October 2027. The research focuses on
  neural classical density functional theory (cDFT) for chemical systems,
  specifically chemical separation and electromechanical behavior at the
  nanoscale, using machine learning and molecular simulation. Candidates should
  have a solid background in statistical mechanics, chemistry, physics, or
  materials science. Funding is available for UK fees; international students
  can discuss other options.
