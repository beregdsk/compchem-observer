description: The Atomistic Theory and Optimization of Materials (ATOM) Lab at UC
  Davis is recruiting up to two fully funded PhD students starting in Fall 2027.
  Research focuses on developing ab initio and multiscale quantum methods for
  electronic materials, including interpretable machine learning for many-body
  perturbation theory, predictive theories of charge transport and light-matter
  coupling, and AI/ML integration of electronic structure with device-scale
  solvers.
