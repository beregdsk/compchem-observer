description: The project focuses on developing hybrid methods combining SIESTA
  and IBM's QISKIT for quantum computing to treat correlated electrons within
  DFT frameworks. The student will work on condensed matter, nano, and
  biophysics problems using IBM quantum computers and HPC supercomputers, in
  collaboration with IBM Research in Zürich.
