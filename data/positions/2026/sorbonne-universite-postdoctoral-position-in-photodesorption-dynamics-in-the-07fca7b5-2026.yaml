description: >-
  Posdoctoral position, Experimental investigation on photodesorption dynamics
  in the vacuum-UV, Sorbonne Université, Paris, France


  A post-doctoral position is open in the CIRS-group at PARIS (MONARIS, Sorbonne
  Université, France) to work with our SPICES-VMI set-up (see details below) to
  study the /photodesorption dynamics // in the vacuum-UV using Velocity Map
  Imaging //from icy surfaces// ./


  Photodesorption (photon induced desorption) from ices has been suggested as a
  major (non-thermal) desorption process explaining the observations of
  molecules in the cold interstellar medium. The determination of
  photodesorption yields from interstellar ice analogues has been the subject of
  many studies in the last decade, however, the mechanisms explaining the
  desorption are still poorly understood. We propose a novel experimental
  approach to shed insights onto the photodesorption dynamics from ices.


  The SPICES-VMI instrument allows 3D-velocity map imaging (VMI) of neutral
  particles ejected from a cold surface (10-100 K). Typically thin films of
  physisorbed small molecules (CO, N_2 , H_2 O ..) or larger (aminoacids)
  organics of astrophysical interest will be irradiated with monochromatic
  photons in the range between 5-20 eV (VUV-laser or synchrotron radiation). It
  will lead to the desorption of parent molecules or fragments, velocity and
  angular distributions of which will be measured.


  The candidate will be involved in a scientific program including:


  ·3D-velocity map imaging (VMI) following photodesorption from ices in order to
  investigate the role of the polarization state of light.


  ·Commissioning of an upgraded tunable UV/VUV system (four-wave frequency
  mixing) and application to photodesorption studies above 10 eV


  Depending on the agenda he/she will have the opportunity to participate to
  complementary photodesorption campaigns, aiming at identifying the effects of
  light polarization on the desorption from chiral molecules, using the SOLEIL
  synchrotron facility (DESIRS beamline).


  The appointment period is initially for one year. The fellowship includes a
  gross monthly salary ranging between €2900-€3500 depending on the experience
  of the candidate. Candidates should have a Ph.D. in Chemical Physics or
  Physics or Chemistry. Experience in molecular/quantum dynamics and/or laser
  spectroscopy is expected, and an ability to perform collaborative work within
  an international team. Experience in velocity imaging techniques is not
  mandatory but will be positively considered. Knowledge of French is not
  mandatory, but a fluent level of spoken and written English is required.


  Applicants should submit a letter of interest, at least two reference names, a
  CV, and a publication list to Prof. J.-H. Fillion
  (jean-hugues.fillion@sorbonne-universite.fr), Department of Physics, Sorbonne
  Université, Paris, France.  Review of applications will begin on November 1st,
  2026, and will continue until the position is filled.


  Would you be kind enough to have this announcement available to motivated
  candidates in your group/institutes and around you.


  Many thanks in advance.


