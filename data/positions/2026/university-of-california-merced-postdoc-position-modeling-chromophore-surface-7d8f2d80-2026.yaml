description: >-
  Postdoc position modeling chromophore-surface interactions and electro-optical
  properties (University of California, Merced, USA)


  A postdoctoral position modeling chromophore aggregates and
  chromophore-surface interactions along with the electro-optical/nonlinear
  optical properties is available in the groups of Christine Isborn and Liang
  Shi in the Department of Chemistry at the University of California, Merced,
  USA. The position will involve parametrizing force fields simulating the
  structure and morphology of chromophores on surfaces, and modeling the
  electronic and electro-optic properties of the chromophore aggregates. This
  project will involve working with experimentalists to determine optimal
  chromophore densities and structures for optimizing electro-optic properties.
  The postdoctoral scholar will be in charge of implementing and optimizing
  necessary code, as well as running electronic structure calculations.


  Interested candidates should email a CV and one page
  cover/motivation/background letter to cisborn@ucmerced.edu and/or
  lshi4@ucmerced.edu .


  To join or leave the molecular-dynamics-news email list, go to:

  http://www.jiscmail.ac.uk/lists/molecular-dynamics-news.html
