description: Postdoctoral Research Fellow position at the Ultrafast
  Multidimensional Optical Spectroscopy Lab, Nanyang Technological University,
  Singapore, under Prof. Howe-Siang Tan. The role involves developing and
  applying Ultrafast 2D Electronic Spectroscopy (2DES) to study complex systems,
  including ultrafast excitation energy transfer in photosynthetic systems and
  spectral diffusion dynamics. Requires a PhD in Chemistry, Physics, or related
  field with experience in ultrafast laser spectroscopy.
