description: 'Postdoctoral position (36 months) starting January 1, 2027 at IPPT
  PAN in Warsaw, Poland. Project extends GōMartini 3 from proteins to nucleic
  acids. The postdoc will develop, validate, and release the new model, applying
  it to large conformational transitions like DNA bending, folding, base pair
  opening, and nucleosome assemblies. Collaboration with Paulo C.T. Souza (ENS
  de Lyon) and Sharon Lover (CUNY). Requires experience in MD simulations,
  Martini 3, or nucleic acid force fields. Deadline: November 30, 2026. More
  info: http://pomalab.ippt.pan.pl/web/positions/index.html'
