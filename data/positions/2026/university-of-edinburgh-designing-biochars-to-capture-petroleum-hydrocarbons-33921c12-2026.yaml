description: A PhD position at the University of Edinburgh, starting September
  2027, funded through the E5 Doctoral Training Partnership. The project focuses
  on designing biochars to capture petroleum hydrocarbons from contaminated
  waters. It combines classical molecular dynamics simulations with adsorption
  experiments to elucidate molecular mechanisms, compute adsorption free
  energies, and guide the design of production-scale materials. The studentship
  is a CASE award with Carbogenics and includes two placements.
