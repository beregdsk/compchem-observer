description: PhD student performing femtosecond laser spectroscopy in the HELIOS
  laser laboratory at Uppsala University to study charge dynamics in
  liquid-phase chemical reactions relevant to light-harvesting and bond
  activation. The student will develop novel femtosecond THz and optical
  spectroscopy infrastructure, design and analyze experiments on molecular
  charge distributions in catalysis, write scientific manuscripts, present at
  conferences, and collaborate with other groups.
