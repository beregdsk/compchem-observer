description: 'Up to three Innovation Fellows are being recruited by the Quantum
  Software Lab (QSL) at the University of Edinburgh to develop high-impact
  applications of quantum computing across science and industry. As part of the
  QATCH programme, fellows will work with QSL, NQCC, and partners to deliver
  practical solutions across six key sectors: Healthcare and Life Sciences,
  Materials and Manufacturing, Finance, Energy, AI and Data Science, and
  Cybersecurity, supporting junior researchers and contributing to future
  funding.'
