description: The Quantum Software Lab (QSL) at the University of Edinburgh is
  recruiting up to three Innovation Fellows to develop high-impact applications
  of quantum computing across key sectors, including healthcare, life sciences,
  materials, and manufacturing. Working on the QATCH programme, successful
  candidates will collaborate with leading researchers to deliver practical
  quantum computing solutions, support junior researchers, and contribute to
  funding. The positions are suitable for computational chemists interested in
  quantum computing.
