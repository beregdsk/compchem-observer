description: The Columbia University Astrophysics Laboratory (CAL) invites
  applications for an Associate Research Scientist in laboratory astrochemistry.
  The successful candidate will join the group of Dr. Daniel Wolf Savin to
  conduct experimental studies of astrochemistry, focusing on merged-fast-beams
  studies of deuterating reactions that form key molecules to probe prestellar
  cores and protoplanetary disks.
