description: A PhD studentship within the Applied Quantum Technologies CDT,
  focusing on computational and simulation methods for quantum-enhanced
  materials. The project involves density-functional theory, post-DFT,
  semi-empirical models, and open quantum systems to study rare earth
  super-fluorescent up-conversion materials for room temperature quantum
  technology applications.
