description: A fully funded PhD studentship at the University of Southampton in
  the group of Dr Karl Michael Ziems. The project focuses on developing
  wavefunction-based electronic structure methods for excited-state molecular
  dynamics on classical and quantum computers. It combines theoretical
  chemistry, scientific programming, and quantum computing, with opportunities
  for international collaborations.
