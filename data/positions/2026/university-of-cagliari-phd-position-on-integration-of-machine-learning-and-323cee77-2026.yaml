description: Marie Skłodowska-Curie fellowship PhD position at the Physics
  Department of the University of Cagliari within the ELEVATE European Joint
  Doctorate program. Project DC10 focuses on integrating machine learning with
  physics-based molecular simulations, with interests in simulation, machine
  learning, and quantum computing. Joint PhD degree from two European
  institutions. Open to candidates worldwide with relevant scientific
  background; attractive remuneration package including mobility and family
