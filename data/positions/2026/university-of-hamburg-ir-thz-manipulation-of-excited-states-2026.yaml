description: "A PhD position is available at the University of Hamburg in the
  Cluster of Excellence 'CUI: Advanced Imaging of Matter', in collaboration
  between the Femtosecond X-ray Experiments group at the European XFEL and the
  Condensed Phase Dynamics group (Prof. N. Huse). The project focuses on
  applying long-wavelength (THz or IR) excitation to drive reaction coordinates
  and control product formation in condensed phase molecular systems, using
  ultrafast optical and X-ray techniques. The position is funded for 3 years."
