description: >-
  Postdoc Offer, "Understanding corrosion in solid-state ceramic
  devices",  Lyon, France.


  Dear colleagues,


  A job offer follows:


  Context and motivations


  This postdoctoral position is to be hired in the framework of an industrial
  collaboration with a French start up developing new micro-component for energy
  storage. We aim to understand the origin of observed partial corrosion of
  current collectors to design the next generation of  micro-component using
  modelling approaches. The postdoc will be hired at Laboratoire de Chimie
  (www.ens-lyon.fr/CHIMIE <http://www.ens-lyon.fr/CHIMIE>) at ENS de Lyon thanks
  to a Region AURA funding. Computational resources will be provided through the
  CBPSmn data center (https://www.ens-lyon.fr/PSMN/)  and eventually national
  resources through the GENCI consortium.


  Project


  This project aims to enhance the long-term stability of battery current
  collectors by making informed material selections for both the current
  collector and the electrolyte. First, we will use ab initio thermodynamics to
  identify the possible phases formed at the collector/electrolyte interface
  under electrochemical conditions. These phases will depend on the composition
  of the anodic/cathodic collector as well as the electrolyte (e.g., fully dry
  or containing trace amounts of water). Next, we will investigate whether these
  phases act as protective barriers or, conversely, initiate corrosive pitting
  through leaching.


  Applicant


  The successful applicant is expected to have strong background in physical
  chemistry and strong knowledge of periodic DFT and theoretical modeling of
  liquid/oxides interfaces will be a major asset. A PhD in theoretical chemistry
  degree is required. The PostDoc will be supported for 12 months with a raw
  salary starting ~2900€/month for young graduates and possible extension.


  Workplace


  Our Theory group benefits from the international recognition in the field of
  theoretical modeling of heterogeneous catalysis for more than 30 years. In
  addition, it benefits from the international context of ENS Lyon, which
  welcomes hundreds of students each year. Lyon’s listing by UNESCO as a World
  Heritage Site gives recognition to the long history heritage of the city. It
  is also recognized for its gastronomy and last but not least, Lyon is a vivid
  city with thousands of students.


  Contact/Application


  To apply, please send a detailed CV and the names and addresses of at least
  three references to Dr. Carine MICHEL & Dr. Stephan STEINMANN by
  emailing:  carine.michel@ens-lyon.fr <mailto:carine.michel@ens-lyon.fr> using
  PostDoc ECLAT as a title.


