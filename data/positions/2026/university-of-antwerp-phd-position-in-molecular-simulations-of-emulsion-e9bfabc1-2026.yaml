description: A PhD position at the University of Antwerp's MOSAIC group focuses
  on atomistic modelling of seeded emulsion polymerization via molecular
  dynamics simulations and machine-learning potentials. The research
  investigates monomer transport into polymer particles, chain incorporation,
  polymer dynamics, phase compatibility, and morphology development, in
  collaboration with the iPRACS experimental group. Candidates need a master's
  in chemistry, physics, chemical engineering, or related field; experience in
  MD, computational chemistry, polymer science, and Python is advantageous. This
