description: PhD position at the Max Born Institute in Berlin as part of the
  joint German-French FEMTO-switch project. The research focuses on the
  ultrafast dynamics of photoswitches, investigating how chemical structure
  controls molecular energetics and excited state dynamics at conical
  intersections. The role is experimental, employing femtosecond UV/VIS/NIR and
  photoelectron spectroscopy in the liquid phase, combined with quantum
  chemistry calculations.
