description: A PhD position is available at the University of Cambridge,
  Department of Materials Science and Metallurgy, funded by the ERC Starting
  Grant QUANTEX. The project investigates how extreme pressure changes
  electronic structure, chemical bonding, and periodicity, using
  first-principles calculations, crystal structure prediction, machine learning,
  and chemical bonding analysis. Candidates should have a strong interest in
  theoretical chemistry, condensed matter physics, or computational materials
  science.
