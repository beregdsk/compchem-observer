description: The official webpage of the research group of Prof. Dr. Ferdi
  Schüth at the Max Planck Institute for Coal Research in Mülheim an der Ruhr,
  Germany. The group focuses on heterogeneous catalysis, specializing in the
  synthesis and characterization of inorganic materials, nanostructured
  catalysts, and porous solids. Their research covers key areas such as
  electrocatalysis, biomass conversion, hydrogen storage, and mechanochemistry,
  aiming to develop sustainable chemical processes and energy solutions.
