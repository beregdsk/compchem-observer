description: The Computational Biomolecular Dynamics group, led by Bert L. de
  Groot at the Max Planck Institute for Multidisciplinary Sciences, studies the
  relationship between dynamics and function of biological macromolecules at the
  atomic level using computer simulations. Their research focuses on permeation
  events in membrane channels like aquaporins, collective modes of motion in
  enzymes, and the development of novel simulation techniques.
