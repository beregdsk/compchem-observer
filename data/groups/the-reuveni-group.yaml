description: The Reuveni Group at Tel Aviv University focuses on theoretical and
  mathematical research in the natural sciences, specializing in stochastic
  processes, first-passage kinetics, and molecular dynamics. Their research
  includes adaptive resetting strategies, transport in disordered and deformable
  media, machine learning for physical sciences, and diffusion NMR methods for
  biological systems.
