description: The Fundamental Quantum Science Program (FQSP) at RIKEN is a
  research initiative under the TRIP Headquarters, led by Program Director Naoto
  Nagahara. It focuses on the foundational aspects of quantum science across
  fundamental physics, chemistry, mathematics, quantum information, and
  non-equilibrium science. The program aims to be a global research hub,
  promoting international collaboration, researcher exchange, and talent
  development.
