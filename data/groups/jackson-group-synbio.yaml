description: The Jackson Group - SynBio at the ANU Research School of Biology
  explores the interface of biology, chemistry, and physics to study fundamental
  chemical processes in biology, such as enzyme catalysis and evolution. The
  group also applies chemical techniques to design small-molecule drugs and
  engineer proteins with novel functions.
