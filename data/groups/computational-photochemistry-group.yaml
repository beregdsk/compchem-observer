description: The Computational PhotoChemistry (CPC) Group, led by Prof. Dr.
  Carolin Müller, focuses on light-induced physical processes and chemical
  reactions. Using advanced computational methods such as excited-state quantum
  chemistry, photodynamics, and machine learning, the group investigates
  photoactive molecules, designs functional materials, and develops data
  infrastructure for excited-state dynamics.
