description: The Casarotto Group investigates how the structural properties of
  biological molecules influence biological processes, focusing on molecular
  recognition, drug design, and protein folding. The lab uses molecular biology,
  kinetics, and molecular modelling to study molecular mechanisms in diseases
  like cancer, malaria, and heart disease.
