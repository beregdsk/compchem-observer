description: The research group led by Prof. José A. Berrocal at the Institut
  Català d’Investigació Química (ICIQ) focuses on combining small molecule and
  macromolecule chemistry to develop functional materials for sustainable
  development. They specialize in stimuli-responsive and reconfigurable polymers
  that alter their properties in response to external stimuli such as heat,
  light, chemical reagents, and mechanical force, studying their behavior
  through the rational design of macromolecular architectures.
