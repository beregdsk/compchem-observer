description: The AsymCat research group, based at the Universitat de València,
  focuses on the design and synthesis of new chiral catalysts, including metal
  complexes and organocatalysts, and their application in enantioselective
  carbon-carbon bond formation reactions to synthesise chiral compounds of
  pharmacological and agrochemical interest, incorporating photoredox catalysis.
