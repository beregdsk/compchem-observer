description: The Structural Chemistry research programme at Uppsala University
  investigates materials' chemical structure, dynamics, properties, and
  mechanisms at the atomic and molecular level. Combining experimental
  techniques like X-ray diffraction with computational methods such as DFT and
  molecular dynamics, the group focuses heavily on advanced materials for
  electrochemical energy storage, particularly rechargeable batteries.
