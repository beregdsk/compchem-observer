description: The Fritz Haber Center for Molecular Dynamics is a research
  institute at the Hebrew University of Jerusalem, founded in 1981 by the
  university and the Minerva Foundation. It conducts advanced research in
  computational and theoretical chemistry, focusing on molecular dynamics,
  electronic structure, density functional theory, biomolecular simulations, and
  drug design.
