description: The Crystalline Order and Disorder Group at the Faculty of
  Chemistry, University of Warsaw, led by Dr. Wojciech Sławiński, investigates
  the local and short-range atomic structures of advanced crystalline materials.
  By utilizing Pair Distribution Function (PDF) analysis from synchrotron and
  neutron diffraction experiments, the group aims to understand how local
  disorder influences material properties. Additionally, they develop software
  tools like RMCProfile and RMCAnalyze to support structural analysis and
  modeling.
