description: The Block Group at Freie Universität Berlin, within the Department
  of Biology, Chemistry, Pharmacy, focuses on developing and applying novel
  approaches to characterize complex interactions at (bio)interfaces. Their
  research involves quantifying virus-receptor interactions, parallelizing
  single-molecule force spectroscopy, and measuring single enzyme turnover rates
  using advanced optical microscopy and microfluidics.
