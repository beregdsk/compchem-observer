description: The Advanced General Intelligence for Science (AGIS) Program is a
  research initiative at RIKEN's Research Platform Program for
  Advanced/Integrated Research Platforms (TRIP). Led by Program Director
  Masahiro Taichi, the program aims to develop foundation models and AI agents
  for scientific research by leveraging large language models and scientific
  data. It focuses on key areas including life sciences, materials science, and
  drug discovery, working to automate scientific research and accelerate the
  scientific cycle through open collaboration.
