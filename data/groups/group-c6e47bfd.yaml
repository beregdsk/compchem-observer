description: The Strongly Correlated Materials Research Group at RIKEN's Center
  for Emergent Matter Science focuses on exploring new materials in strongly
  correlated electron systems, such as transition metal alloys, oxides, and
  chalcogenides. Their research targets skyrmion materials, multiferroics,
  thermoelectric materials, and superconductors, focusing on the correlation
  between spin states and charge dynamics to discover novel functional materials
  with giant cross-responses.
