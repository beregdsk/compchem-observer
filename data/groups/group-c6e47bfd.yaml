description: The Strongly Correlated Materials Research Group (強相関物質研究グループ) at
  the Center for Emergent Matter Science, RIKEN, focuses on exploring new
  functional materials in strongly correlated electron systems, such as
  transition metal alloys, oxides, and chalcogenides. Their research targets
  include skyrmions, multiferroics, thermoelectric materials, and
  superconductors, focusing on the correlation between spin states and charge
  dynamics to discover novel cross-response phenomena.
