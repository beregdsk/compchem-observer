description: The innovative Resources and Waste Technologies (iRWT) group at
  RMIT University focuses on the sustainable transformation of renewable
  resources and waste into valuable energy and materials. Their research themes
  include process development, energy, and materials, with core capabilities in
  novel process intensification, engineered processes for diverse feedstocks,
  and advanced materials production from waste or low-cost renewable resources.
