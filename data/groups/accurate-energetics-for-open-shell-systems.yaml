description: The research group 'Accurate Energetics for Open-Shell Systems' at
  the Max Planck Institute for Carbon Research, led by Dimitrios Pantazis,
  focuses on applying high-level quantum chemistry and correlated wave function
  methods to accurately compute spin-state energetics, redox potentials, and
  electron affinities for transition metal complexes and organic molecules.
