description: The research group of Prof. Dr. Martin E. Garcia at the University
  of Kassel, known as Festkörper und Ultrakurzzeitphysik (Condensed Matter and
  Ultrafast Physics), focuses on the theoretical study of ultrafast phenomena in
  solids and nanostructures. Key research includes laser-induced structural
  changes, electronic transport, optical properties, and the dynamics of protein
  folding and vesicle transport.
