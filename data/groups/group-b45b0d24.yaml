description: The Emergent Photo-Functional Properties Research Group at RIKEN,
  led by Group Director Naoki Ogawa, focuses on exploring emergent
  photo-functional properties and controlling non-equilibrium electron and spin
  states in materials with strong electron correlations and topological
  characteristics. Using advanced optical and spectroscopic techniques, the
  group investigates ultrafast phenomena, spin currents, and novel quantum
  properties in complex materials.
