description: The Emergent Optical Property Research Group, part of the Center
  for Emergent Matter Science at RIKEN and directed by Naoki Ogawa, explores
  emergent optical properties and controls non-equilibrium electron and spin
  dynamics in topological and strongly correlated materials. Using broadband and
  ultrafast optical spectroscopy, they investigate shift and injection currents,
  spin transport, and the manipulation of topological magnetic orders to
  discover novel photofunctional materials.
