description: The GreenMet Lab at the Faculty of Chemistry, University of Warsaw,
  led by Dr. Hab. Wojciech Hyk, focuses on nanoelectroanalysis, single-particle
  ICP-MS, and the electrochemical recycling of electronic waste to produce metal
  nanoparticles. The group also develops reference materials, software for
  statistical analysis and quality control, and models ion transport during
  nanoparticle synthesis.
