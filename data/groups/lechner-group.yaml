description: The Lechner Group, led by Wolfgang Lechner at the Department of
  Theoretical Physics, University of Innsbruck, is a research group focused on
  theoretical quantum physics. They aim to solve computationally challenging
  problems on near-term quantum devices, researching adiabatic processes,
  machine learning, optimization, and qubit implementations.
