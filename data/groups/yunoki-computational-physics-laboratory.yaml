description: The official page of the Yunoki Computational Physics Laboratory at
  RIKEN, led by Chief Scientist Seiji Yunoki. The lab investigates quantum
  phenomena in strongly correlated electron systems using computational methods
  like variational Monte Carlo and density-matrix renormalization group. Their
  research focuses on exotic electronic states, quantum spin liquids,
  topological phases, and quantum transport, with recent work involving quantum
  computing applications in physics.
