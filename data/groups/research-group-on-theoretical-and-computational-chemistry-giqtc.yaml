description: The group has extensive research experience in theoretical and
  computational chemistry, grid computing, and eScience. Research focuses on
  applying computational chemistry techniques to systems of technological
  interest, studying the electronic and optical properties of molecular and
  polymeric materials for molecular electronics and energy storage, and
  developing new methodologies for chemical processes. Technically, the group
  implements Grid technology for the efficient use of computational resources in
  scientific grid computing and eScience.
