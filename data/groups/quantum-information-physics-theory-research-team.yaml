description: The Quantum Information Physics Theory Research Team, directed by
  Franco Nori at the RIKEN Center for Quantum Computing, conducts
  interdisciplinary theoretical and computational research in quantum
  information, quantum optics, superconducting quantum circuits, and condensed
  matter physics. The team is widely known for developing the QuTiP open-source
  software for quantum simulation and applying machine learning to quantum
  physics and optimization problems.
