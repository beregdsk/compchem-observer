description: The Statistical Physics (STAT) team at the Charles Coulomb
  Laboratory studies the macroscopic properties of complex systems, from glasses
  and active matter to 2D heterostructures. Using numerical and analytical
  methods like DFT, molecular dynamics, Monte Carlo, and machine learning
  potentials, they focus on soft matter, materials modeling, and disordered
  systems.
