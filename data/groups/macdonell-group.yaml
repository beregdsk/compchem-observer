description: The MacDonell Group is a computational chemistry research group
  based at Dalhousie University in Halifax, Canada. The group focuses on
  understanding the fundamentals of photochemistry, internal conversion, and
  nonadiabatic dynamics, developing new analysis tools to study photochemical
  reaction pathways, and creating quantum computing platforms to simulate
  chemical reactions.
