description: The Sundborger-Lunna lab is a research group at the Department of
  Cell and Molecular Biology, Uppsala University, specializing in structural
  biology. Led by Anna Sundborger-Lunna, the group uses cryo-electron microscopy
  and biochemical methods to investigate how membrane-remodeling proteins and
  lipids regulate mitochondrial function, cell death, and neurodegeneration,
  with aims to identify targets for drug development.
