description: The Erik Johansson group at Uppsala University's Department of
  Chemistry focuses on developing novel solar cell devices, including
  perovskite, quantum dot, and dye-sensitized solar cells. Their research
  involves synthesizing and optimizing hybrid inorganic/organic nanoscale
  materials for efficient and eco-friendly energy conversion, utilizing advanced
  spectroscopic techniques to study device physics, and exploring large-scale
  manufacturing and applications in transportation.
