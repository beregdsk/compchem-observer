description: The Digital Materials Science Research Team at RIKEN Center for
  Computational Science, led by Team Principal Shinji Tsuneyuki, develops
  advanced simulation methods for materials science, including first-principles
  calculations, molecular dynamics, and data-driven approaches. The team works
  on predicting structures and properties of dielectrics, superconductors, and
  amorphous materials under extreme conditions, aiming to create digital twins
  for materials research and development.
