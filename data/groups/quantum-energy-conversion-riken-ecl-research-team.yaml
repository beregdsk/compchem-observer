description: The Quantum Energy Conversion RIKEN ECL Research Team, led by Team
  Leader Miyabi Imai-Imada, is a research group based at RIKEN in Wako, Saitama,
  Japan. The team utilizes photon scanning tunneling microscopes to perform
  atomic-scale spectroscopic measurements. Their research focuses on revealing
  the structure-function relationships of molecules in biological systems and
  organic electronics to create novel energy conversion functionalities.
