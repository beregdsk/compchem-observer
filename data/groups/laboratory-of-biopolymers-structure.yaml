description: The Laboratory of Biopolymers Structure is a research group at the
  Intercollegiate Faculty of Biotechnology UG&MUG, led by Assoc. Prof. Stanisław
  Ołdziej. The group conducts theoretical and computational research on protein
  folding, biomolecular simulations, and the development of coarse-grained force
  fields, notably the UNRES model, to study complex biochemical processes and
  macromolecular dynamics.
