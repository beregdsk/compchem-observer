description: This division at Uppsala University focuses on first-principles
  computational studies of materials for sustainable energy conversion and
  storage. Research areas include functional magnetic materials, novel 2D
  materials, nuclear energy applications, solar fuel production, hybrid
  perovskite solar cells, hydrogen storage, molecular electronics, and organic
  batteries, utilizing density functional theory and advanced electronic
  structure methods.
