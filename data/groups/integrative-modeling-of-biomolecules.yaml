description: The research group of Professor Aaron Frank at the University of
  Michigan focuses on integrative modeling of biomolecules, particularly
  functional ribonucleic acids. The group develops computational tools to
  predict molecular structures and simulate their dynamics, using experimental
  data to guide both structure prediction and atomistic simulations. Their work
  aims to understand how RNA molecules achieve specific cellular functions.
