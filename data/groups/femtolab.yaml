description: Femtolab is a primarily experimental laser physics and physical
  chemistry group located at the Department of Chemistry, Aarhus University, led
  by Henrik Stapelfeldt. The group focuses on the quantum control and reaction
  dynamics of molecules, atoms, and ions in superfluid helium nanodroplets using
  ultrafast laser pulses, velocity-map imaging spectrometry, and theoretical
  simulations.
