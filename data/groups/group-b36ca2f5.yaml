description: The Computational Materials Science Research Team at RIKEN
  investigates the non-trivial electronic properties of strongly correlated and
  topological materials using first-principles calculations. Focusing on
  many-body effects, the team aims to predict novel physical phenomena, design
  new functional materials, and develop novel theoretical frameworks and
  computational methods, including machine learning approaches, to advance the
  field of computational materials science.
