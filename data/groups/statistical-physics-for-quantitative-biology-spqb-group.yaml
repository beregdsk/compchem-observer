description: An interdisciplinary team conducting research at the crossroads of
  physics and biology, delocalized between Paris and Rome. They focus on
  developing generative machine learning models rooted in statistical physics to
  model the structure, function, and evolution of biological sequences like RNA
  and proteins, guiding directed evolution and tracing evolutionary paths.
