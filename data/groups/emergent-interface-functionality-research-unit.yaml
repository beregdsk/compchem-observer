description: The Emergent Interface Functionality Research Unit, led by Shinichi
  Nishihaya at RIKEN Center for Emergent Matter Science, investigates quantum
  physical phenomena in artificially engineered interfaces and nanostructures.
  Focusing on high-mobility materials like topological materials and
  semiconductors, the unit uses advanced epitaxial growth to create thin-film
  samples and heterointerfaces, studying novel quantum phases and transport
  functionalities through precise measurements and local probes.
