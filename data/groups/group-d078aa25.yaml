description: The Quantum Matter Science Research Team at RIKEN Center for
  Computational Science, led by Team Principal Seiji Yunoki, focuses on the
  study of strongly correlated quantum systems. The team develops advanced
  computational methods such as quantum Monte Carlo, density matrix
  renormalization group, and tensor networks to investigate electronic phases,
  metal-insulator transitions, and topological states. Their research also
  encompasses quantum computing algorithms, classical simulations of quantum
  systems on supercomputers, and the application of machine learning potentials
  to materials science.
