description: The Electron State Spectroscopy Research Team at RIKEN's Center for
  Emergent Matter Science, led by Director Kyoko Ishizaka, investigates spin,
  electronic, and crystal structures in functional materials using light and
  electron beams. By utilizing photoelectron spectroscopy and ultrafast
  time-resolved electron microscopy, the team explores superconductivity,
  topological states, strongly correlated systems, and nanoscale magnetic
  dynamics to advance the development of new functional materials.
