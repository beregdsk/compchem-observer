description: The team, led by Director Kyoko Ishizaka, conducts experimental
  research using light and electron beams to clarify spin, electronic, and
  crystal structures in materials exhibiting diverse properties. They employ
  photoelectron spectroscopy to study superconductors, thermoelectric and
  spintronic materials, topological states, and strong correlation effects.
  Additionally, they use pulsed laser-based ultrafast transmission electron
  microscopy to investigate magnetic, electronic, and crystal structure dynamics
  on femtosecond to nanosecond scales with nanoscale spatial resolution.
