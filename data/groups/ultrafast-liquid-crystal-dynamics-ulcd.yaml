description: The Ultrafast Liquid Crystal Dynamics (ULCD) group, led by Dr.
  Laura Cattaneo at the Max Planck Institute for Nuclear Physics, investigates
  the ultrafast dynamics of liquid crystals on femtosecond to picosecond
  timescales. Using advanced pump-probe spectroscopy from terahertz to extreme
  ultraviolet, the research explores molecular reorientations, collective
  excitations, and energy redistribution, bridging microscopic mechanisms with
  macroscopic material performance.
