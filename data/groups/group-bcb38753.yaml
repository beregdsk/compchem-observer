description: The Photonic Quantum Computing Research Team at RIKEN's Quantum
  Computing Research Center, led by Akira Furusawa. The team focuses on
  realizing large-scale fault-tolerant photonic quantum computers using
  deterministic quantum teleportation and time-domain multiplexed cluster
  states. Their research encompasses quantum optics, quantum information
  science, and advanced photonic quantum computing technologies.
