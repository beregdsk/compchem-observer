description: The Cheah group at Uppsala University's Department of Chemistry -
  Ångström Laboratory, led by Mun Hon Cheah, focuses on renewable energy
  conversion through the electrochemical activation of small molecules such as
  CO2, N2, and H2O. They utilize electrochemical, FTIR, and XAS
  spectroelectrochemistry, DFT calculations, and stable isotope labeling to
  investigate water oxidation and reduction reactions using molecular catalysts
  and biological enzymes.
