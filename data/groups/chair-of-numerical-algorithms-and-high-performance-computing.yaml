description: The Chair of Numerical Algorithms and High-Performance Computing at
  EPFL is a research group within the School of Basic Sciences. It focuses on
  the design and analysis of efficient numerical algorithms, particularly
  randomized methods for matrix computations, low-rank approximations,
  eigenvalue problems, and tensor networks, leveraging high-performance
  computing to solve large-scale mathematical challenges.
