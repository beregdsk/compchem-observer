description: The Innovative Function Design Research Unit at the RIKEN Center
  for Emergent Matter Science, led by Shun Okumura, focuses on the theoretical
  and computational investigation of strongly correlated electron systems. The
  unit explores topological magnetic structures, spin-charge coupled states, and
  non-equilibrium dynamics using first-principles calculations and response
  theory to design novel functional materials.
