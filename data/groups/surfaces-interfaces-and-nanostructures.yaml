description: The Surfaces, Interfaces and Nanostructures (SIN) team at the
  Institut Néel focuses on investigating the structural, magnetic, and
  electronic properties of low-dimensional systems like ultra-thin films,
  nanostructures, and interfaces. Their research covers nanosystems for
  magnetism (including magnetic oxide films, heterostructures, and skyrmions),
  electrochemical interfaces and catalysis for energy, and the development of ab
  initio theory and software (such as FDMNES using DFT) to simulate X-ray
  spectroscopies.
