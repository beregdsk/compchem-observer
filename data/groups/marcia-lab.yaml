description: The Marcia lab, led by Marco Marcia at Uppsala University, focuses
  on the structural and molecular biology of large non-coding RNAs. The group
  integrates biochemical, biophysical, and computational simulation methods to
  study RNA splicing and the structural dynamics of long non-coding RNAs, aiming
  to design novel RNA-based therapies for diseases like cancer.
