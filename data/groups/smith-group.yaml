description: Our group utilises quantum-mechanical methods to understand enzyme
  mechanisms, molecular mechanical methods to explore the dynamics of proteins,
  and a variety of tools to predict how molecules interact. We employ X-ray
  crystallography to determine the structures of complexes of proteins,
  polypeptides, and small molecules.
