description: The Electronic Properties (PGI-6) institute at the Peter Grünberg
  Institute investigates the interrelations between electronic structure and
  physical properties such as magnetism. Using synchrotron radiation and
  spectroscopic methods, the institute studies thin films, quantum wires, dots,
  and molecules, focusing on nanosciences, spintronics, and quantum computing.
