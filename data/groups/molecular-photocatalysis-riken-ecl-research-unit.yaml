description: The Molecular Photocatalysis RIKEN ECL Research Unit, led by Kei
  Murata, focuses on developing molecular transformation reactions catalyzed by
  transition-metal complexes using visible and near-infrared light. The unit
  targets photochemical transformations of small molecules like carbon dioxide
  and photouncaging of bioactive molecules, aiming to contribute to
  environmental and medical sciences through organometallic chemistry,
  photochemistry, and chemical biology.
