description: The Semiconductor Quantum Information Device Theory Research Team
  at RIKEN's Quantum Computing Research Center, headed by Daniel Loss, conducts
  theoretical research on spin-based quantum computing. The team designs
  CMOS-compatible gate-controlled quantum dots using silicon and germanium,
  focusing on electric-field-controlled spin qubits leveraging spin-orbit
  interactions. Their work includes modeling low-dimensional electrons and
  holes, studying noise and decoherence to protect qubits, and analyzing
