description: The TMC (Théorie de la Matière Condensée) group at Institut Néel
  performs theoretical and computational research in condensed matter physics,
  focusing on quantum materials such as frustrated systems, multiferroics,
  superconductors, and topological matter. They develop and use first-principles
  methods, including DFT, TDDFT, many-body perturbation theory, and
  wavefunction-based approaches.
