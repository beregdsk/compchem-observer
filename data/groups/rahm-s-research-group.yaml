description: We are a theoretical chemistry group at Chalmers University of
  Technology in Gothenburg, Sweden, working at the intersection of chemistry,
  physics, materials science, and planetary science. Our research focuses on
  cross-disciplinary mastery of chemical bonding, analysis and rationalization
  of electronic structure, and the development of chemical concepts and quantum
  mechanical methods to simplify electronic structure analysis and study
  materials under extreme conditions, such as high pressure or high energy
  density, as well as prebiotic processes.
