description: The Drug Design Unit (創薬分子設計基盤ユニット) at RIKEN Center for Life
  Science Technologies, led by Teruki Honma, focuses on in silico drug discovery
  and design. The unit integrates structure-based and ligand-based screening,
  applying machine learning to optimize compounds with ADMET considerations.
  They perform quantum chemical interaction analyses using the fragment
  molecular orbital (FMO) method on protein-ligand complexes, supporting drug
  development and cardiotoxicity prediction.
