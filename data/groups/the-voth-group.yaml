description: The Voth Group at the University of Chicago, led by Gregory A.
  Voth, conducts theoretical and computer simulation studies of biomolecular,
  condensed phase, quantum mechanical, and materials systems. The group develops
  multiscale theory and computational methods, including coarse-graining and
  machine learning, to study complex phenomena such as protein self-assembly,
  charge transport, and energy conversion materials.
