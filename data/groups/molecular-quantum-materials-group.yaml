description: The Molecular Quantum Materials Group, led by Dr. Daniel Bürgler at
  the Peter Grünberg Institute (PGI-6) of Forschungszentrum Jülich, investigates
  emergent magnetism and spin transport in single organic molecules. The group
  studies spin-dependent hybridization with ferromagnetic substrates and
  chirality-induced spin selectivity to engineer tunable quantum properties for
  advanced spintronic and quantum information applications.
