description: The Laursen Group at the University of Copenhagen, part of Nano
  Chemistry, focuses on the design and synthesis of fluorescent dyes and
  molecular materials with novel optical properties. Their research explores
  molecular photophysics, self-assembly of molecular materials, and the creation
  of ultra-bright crystals, nanoparticles, and thin films for applications in
  sensing, cell imaging, and fluorescence-guided surgery.
