description: The Atmospheric Physical Chemistry group at Aarhus University's
  Department of Chemistry investigates the formation, growth, and properties of
  atmospheric aerosols, which represent the largest uncertainty in climate
  prediction and impact human health. Led by Professor Merete Bilde, the group
  utilizes advanced facilities such as a custom-built sea spray tank and an
  atmospheric simulation chamber to study sea spray aerosols, microplastics,
  bioaerosols, clouds, and ice nucleation.
