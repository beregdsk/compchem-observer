description: The Melander-Bowden group, led by Tim Melander Bowden at the
  Department of Chemistry - Ångström Laboratory, Uppsala University, focuses on
  synthetic strategies and materials characterization of functional polymers.
  Their research areas include biomedical applications, such as
  anti-inflammatory polymers and drug delivery systems, as well as energy
  storage materials like solid polymer electrolytes for lithium-ion batteries.
