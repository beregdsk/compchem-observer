description: The Huynh Group at the National University of Singapore is a
  research group led by Prof. Han Vinh Huynh, focusing on N-heterocyclic carbene
  (NHC) chemistry. The group designs tailored ligands, develops the Huynh
  Electronic Parameters (HEPs) for quantifying ligand donor strength using 13C
  NMR spectroscopy, and applies these in catalysis including C-C coupling, C-H
  activation, and hydroelementation. They also design organometallic precursors
  for ALD and CVD thin-film deposition in the semiconductor industry, and have
  authored a textbook on the organometallic chemistry of NHCs.
