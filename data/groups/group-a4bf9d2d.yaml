description: The Polymeromics Team at RIKEN, led by Team Director Ryo Yoshida,
  develops foundational models for polymer materials by integrating real-world
  experimental data with computational experiments. The team builds the world's
  largest polymer materials database using automated molecular dynamics and
  first-principles calculations, and researches Sim2Real machine learning and
  AI-driven automated material exploration systems.
