description: The Kjaergaard Group at the University of Copenhagen performs
  physical chemistry research focused on atmospheric radical reactions and
  aerosol formation. The group combines experimental spectroscopic
  techniques—such as FTIR, matrix isolation, UV-Vis, and cavity ring-down
  spectroscopy—with theoretical computational methods, including local mode
  models and multi-conformer transition state theory, to study hydrogen-bonded
  complexes, reaction kinetics, and spectroscopic properties of atmospherically
  relevant molecules.
