description: The Spry Group at the Australian National University's Research
  School of Biology focuses on drug discovery for infectious diseases, primarily
  targeting malaria and tuberculosis. The group validates new drug targets and
  identifies potential therapeutics using strategies such as drug repurposing
  and fragment-based drug discovery, integrating protein biophysics, structural
  biology, and molecular biology.
