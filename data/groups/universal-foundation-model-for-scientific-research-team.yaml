description: The Universal Foundation Model for Scientific Research Team, part
  of RIKEN's AGIS program, develops large multimodal foundation models and
  multi-AI agent systems to autonomously execute research workflows. The team
  applies computational simulation and machine learning techniques—including
  NLP, generative AI, and multimodal learning—to bio and materials sciences,
  aiming to create a foundational system for science that can learn through
  trial-and-error using both simulation and experimentation.
