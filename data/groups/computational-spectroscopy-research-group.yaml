description: The Computational Spectroscopy Research Group at the Faculty of
  Chemistry, University of Warsaw, led by Prof. Magdalena Pecul-Kudelska,
  focuses on bridging spectroscopy, photochemistry, and quantum chemistry. The
  group applies molecular modeling and quantum chemistry methods to study
  spectroscopic properties, photo-induced processes, and excited states of
  molecules, nanosystems, and materials, with applications in photoswitches,
  molecular machines, and photovoltaics.
