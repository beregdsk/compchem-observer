description: The Quantum Many-Body Dynamics Research Team, led by Team Director
  Takeshi Fukuhara, investigates non-equilibrium quantum many-body dynamics
  using ultracold atoms in optical lattices. The team focuses on real-time,
  real-space measurements to understand strongly correlated quantum systems and
  advance quantum simulation and quantum information processing.
