description: The Grennberg Group, part of the Organic Chemistry division at the
  Department of Chemistry for Life Sciences, Uppsala University, is led by
  Helena Grennberg. The group's research centers on the purification,
  functionalization, and evaluation of carbon nanomaterials like fullerenes,
  carbon nanotubes, and graphene. Additionally, they work on dyes and molecular
  dyads for solar cells and molecular electronics, as well as supramolecular and
  organometallic chemistry.
