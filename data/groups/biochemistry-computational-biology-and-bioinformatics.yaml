description: The Biochemistry, Computational Biology and Bioinformatics research
  group at the Department of Pharmacy and Biotechnology (FABIT) of the
  University of Bologna, coordinated by Pier Luigi Martelli, focuses on
  characterizing biomolecular structure-function relationships in physiological
  and pathological states. The group develops computational methods, algorithms,
  and machine learning approaches for annotating proteins and their variants,
  analyzing omics data, modeling protein-protein interactions, and integrating
