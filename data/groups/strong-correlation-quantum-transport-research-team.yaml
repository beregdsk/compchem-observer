description: The Strong Correlation Quantum Transport Research Team, directed by
  Yoshinori Tokura at the RIKEN Center for Emergent Matter Science, investigates
  quantum transport phenomena in thin films, hetero-interfaces, and bulk
  samples. Their research focuses on spin-orbit interaction effects in
  non-centrosymmetric systems, electron transport in non-trivial spin textures,
  and unconventional superconductors using high-pressure resistivity and THz
  spectroscopy. They study strongly correlated electron systems, multiferroics,
  and topological insulators.
