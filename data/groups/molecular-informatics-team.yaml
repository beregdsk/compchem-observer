description: The Molecular Informatics Team at the RIKEN Center for Advanced
  Intelligence Project focuses on developing artificial intelligence methods to
  design functional biomolecules, such as proteins, and inorganic materials,
  including metals, ceramics, and nanoparticles. The team conducts theoretical
  and computational studies on automatic design methods like Bayesian
  optimization and Monte Carlo tree search, integrating machine learning with
  quantum chemistry to advance molecular and materials design.
