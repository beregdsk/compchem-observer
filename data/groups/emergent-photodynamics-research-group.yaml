description: The Emergent Photodynamics Research Group, led by Naoki Ogawa at
  RIKEN Center for Emergent Matter Science, investigates novel photodynamics of
  electron, spin, and lattice in bulk crystals and thin-film interfaces. Their
  research focuses on ultrafast spectroscopy, spin current generation mediated
  by Dirac/Weyl electrons, and manipulation of topological magnetic textures,
  aiming to discover new photo-electric and magnetic effects in solids.
