description: The Strong Correlation Quantum Phase RIKEN ECL Research Unit
  conducts theoretical research on strongly correlated electron systems in
  solid-state materials like superconductors and magnets. Starting from
  microscopic theoretical models of electron behavior, the unit aims to propose
  novel electronic phases, quantum phase transitions, and transport phenomena,
  bridging theory and experiment.
