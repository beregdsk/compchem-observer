description: The group's research spans method development, calculation of
  molecular properties in spectroscopy, and modelling heterogeneous reactions
  such as electrocatalysis. It contributes to the ORCA quantum chemistry
  program, develops novel schemes for solving the FCI problem and grand
  canonical DFT approaches for electrochemistry, and applies these to
  intermolecular interactions, NMR spectroscopy, nanoparticles on surfaces, and
  materials science.
