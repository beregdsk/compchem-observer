description: The Division of Materials Theory at Uppsala University's Department
  of Physics and Astronomy focuses on the quantum mechanical description of
  materials to understand and predict properties like superconductivity,
  magnetism, and topological phases. Research encompasses electronic structure
  theory, density functional theory, and molecular dynamics to design functional
  materials for green energy conversion, such as solar cells, battery materials,
  and hydrogen storage, alongside code development and computational physics.
