description: The Innovative Functional Magnetic Materials Research Unit, led by
  Kosuke Karube at the Center for Emergent Matter Science, RIKEN, focuses on
  synthesizing and exploring novel magnetic materials with topological and
  high-performance magnetic functionalities. The unit uses magnetic
  measurements, scanning probe microscopy, and neutron scattering to clarify
  magnetic structures and topological properties.
