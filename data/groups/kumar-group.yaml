description: The Kumar group at UNSW Sydney focuses on organic chemistry,
  medicinal chemistry, and drug discovery, integrating medicinal chemistry,
  chemical biology, and computational approaches. Their research spans
  antimicrobial agents and materials, cancer drug discovery, synthetic methods,
  and PFAS remediation, targeting diseases like cancer and infectious diseases
  while developing novel therapeutic agents.
