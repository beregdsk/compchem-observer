description: The Kumar group at UNSW Sydney focuses on synthetic organic and
  medicinal chemistry, specifically the discovery and development of novel
  bioactive molecules for industrial and medical settings. The research involves
  designing and synthesizing novel antimicrobial and anticancer agents,
  combining synthetic organic chemistry, molecular modelling, and biological
  screening to develop new therapeutic leads and overcome drug resistance.
