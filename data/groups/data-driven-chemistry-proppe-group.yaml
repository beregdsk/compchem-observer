description: The Data-Driven Chemistry Proppe Group at the Institute of Physical
  and Theoretical Chemistry, TU Braunschweig, is a computational chemistry
  research group. They combine computational chemistry and machine learning to
  predict chemical reactions and molecular structure-property relationships,
  focusing on CO2 conversion and drug discovery to identify new bioactive
  compounds.
