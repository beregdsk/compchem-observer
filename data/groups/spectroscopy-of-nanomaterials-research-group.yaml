description: The Spectroscopy of Nanomaterials Research Group at the Faculty of
  Chemistry, University of Warsaw, led by Prof. Barbara Pałys, focuses on
  designing and synthesizing nanostructures with catalytic and light-absorbing
  properties for electrochemical and SERS-based sensors. The group studies
  spectroelectrochemical properties of compounds, analyzes marine samples for
  microplastics, and applies infrared and Raman spectroscopy to materials
  science and cultural heritage.
