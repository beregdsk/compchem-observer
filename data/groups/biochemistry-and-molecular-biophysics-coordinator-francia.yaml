description: The Biochemistry and Molecular Biophysics group at the University
  of Bologna's Department of Pharmacy and Biotechnology, led by Francesco
  Francia, investigates molecular mechanisms using UV/visible and infrared
  spectroscopy. Research focuses on the preservation of biological
  macromolecules like proteins with trehalose, and the effects of ionic liquids
  on photosynthetic membrane potentials using bacterial chromatophores.
