description: The Integrated Data and Computational Science Program (CoRe) is a
  research initiative under the RIKEN TRIP Headquarters. It focuses on
  developing hybrid computing environments integrating supercomputers and
  quantum computers, accumulating high-quality research data, and creating
  advanced simulation, data science, and machine learning algorithms. The
  program aims to expand computational capabilities and apply these technologies
  to physics, chemistry, biology, and other scientific fields to tackle global
  challenges.
