description: The Scott Group, part of the Nano Chemistry section at the
  University of Copenhagen, is led by Søren Scott. The group focuses on the
  fundamental understanding of electrochemical interfaces and energy conversion,
  particularly electrocatalysis for water oxidation and CO2 reduction. They
  develop in-situ spectroscopic and mass spectrometry methods, apply machine
  learning for catalyst discovery, and create open-source software for data
  handling.
