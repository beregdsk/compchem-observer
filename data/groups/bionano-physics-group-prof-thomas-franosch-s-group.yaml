description: The BioNano-Physics Group, led by Prof. Dr. Thomas Franosch at the
  Department of Theoretical Physics of the Universität Innsbruck, addresses
  fundamental questions in biological and nano physics using theoretical and
  computational tools. Their research encompasses complex transport phenomena in
  crowded environments, the non-equilibrium physics of self-propelled particles,
  the glass transition of strongly confined liquids, thermophoresis of colloidal
  particles, and the elastic and dynamic properties of polymers.
