description: The Quantum Sensing and Information group, led by Dr. Taner Esat at
  the Peter Grünberg Institute, focuses on using scanning probe microscopy and
  electron spin resonance to engineer and study artificial nanostructures with
  custom quantum states. Their research spans atomic-scale quantum sensing,
  coherent control of spins, analog quantum simulation on surfaces, and the
  development of millikelvin scanning tunneling microscope technology.
