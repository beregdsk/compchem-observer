description: Bolognesi's MedChem Lab (BOMedChem Lab) is a research group at the
  Department of Pharmacy and Biotechnology - FABIT, University of Bologna, led
  by Maria Laura Bolognesi. The group focuses on the design and synthesis of
  small molecules, particularly multi-target-directed ligands and degraders like
  PROTACs, for neurodegenerative and infectious diseases, alongside sustainable
  drug discovery from agro-industrial waste.
