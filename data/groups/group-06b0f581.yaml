description: The Medical Science Deep Learning Team, led by Director Jun Seita
  at RIKEN iTHEMS, researches the foundational theories required to apply deep
  learning to medical science. Their main themes include deep learning
  frameworks for predicting time-series data, reinforcement learning involving
  multiple interacting agents, and extending these areas into quantum computing.
