description: The Liquid Crystals Physics Group at the Institute of Physics, Lodz
  University of Technology, led by Mariola Buczkowska, specializes in the
  theoretical and numerical modeling of liquid crystals. The group's research
  focuses on director field deformations, optical transmission, and
  flexoelectric effects in nematic layers using continuum theory to study soft
  matter systems.
