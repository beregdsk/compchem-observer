description: The Electron Density Modelling Group, led by Prof. Paulina Dominiak
  at the Faculty of Chemistry, University of Warsaw, develops new methods for
  electron density modelling applicable to X-ray and electron crystallography,
  chemistry, and structural biology. Their research focuses on extracting more
  information from diffraction data, bridging classical mechanics and quantum
  mechanics, and analyzing intermolecular interactions and electrostatics in
  organic crystals, proteins, and nucleic acids, with relevance to drug design.
