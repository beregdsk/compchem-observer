description: The Phase Transition Engineering (PTE) group at the Max Planck
  Institute for Dynamics of Complex Technical Systems, led by Dr. Leif-Thore
  Deck, focuses on bridging the gap between the microscopic physics of phase
  transitions and industrial-scale manufacturing processes. The group combines
  high-throughput droplet microfluidics with mechanistic modeling to study
  crystallization, precipitation, and liquid-liquid phase separation of
  pharmaceuticals and biomolecules like proteins, peptides, and RNA.
