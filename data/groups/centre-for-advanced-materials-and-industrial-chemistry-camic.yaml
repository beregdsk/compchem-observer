description: The Centre for Advanced Materials and Industrial Chemistry (CAMIC)
  is a multidisciplinary research centre at RMIT University that brings together
  expertise in industrial chemistry, materials chemistry, nanotechnology,
  catalysis, chemical engineering, and electrochemistry. It focuses on
  developing real-world solutions for industry challenges through innovative
  research in applied electrochemistry, molecular engineering,
  nano-biotechnology, and advanced materials.
