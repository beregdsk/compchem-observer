description: The Strong Correlation Physics Research Group at the RIKEN Center
  for Emergent Matter Science, led by Group Director Yoshinori Tokura,
  investigates emergent phenomena in strongly correlated electron systems. Their
  research focuses on transport and optical properties in non-trivial spin and
  orbital structures, as well as electron systems with strong spin-orbit
  interactions, aiming to clarify the correlation between responses and
  spin/orbital states.
