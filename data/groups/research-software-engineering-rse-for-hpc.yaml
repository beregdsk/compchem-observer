description: The Research Software Engineering (RSE) for HPC group at the Jülich
  Supercomputing Centre focuses on applying software engineering practices to
  scientific research, particularly for high-performance computing (HPC)
  software. The group develops tools for continuous testing, integration, and
  benchmarking, provides training for researchers across all career levels, and
  fosters the RSE community.
