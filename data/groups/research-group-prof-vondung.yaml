description: A young research group at the University of Hamburg led by Prof.
  Lisa Vondung, specializing in fundamental actinide and lanthanide coordination
  chemistry with emphasis on uranium. The group synthesizes air- and
  moisture-sensitive coordination and organometallic compounds, investigates
  them via crystallography and spectroscopy, and applies quantum chemical
  computational methods to understand unusual bonding situations and
  reactivities.
