description: The Orthaber group, led by Andreas Orthaber at the Department of
  Chemistry - Ångström Laboratory, Uppsala University, focuses on how main group
  elements like phosphorus and arsenic affect the optical and electronic
  properties of pi-conjugated molecules. Using experimental and theoretical
  approaches, the group investigates these compounds for applications in
  homogeneous catalysis and organic electronics.
