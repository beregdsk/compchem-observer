description: The Emergent Functional Magnetic Materials Research Unit at RIKEN
  Center for Emergent Matter Science, led by Kosuke Karube, focuses on
  synthesizing new magnetic materials with topological and high-performance
  functions. The unit investigates intermetallic and oxide compounds, exploring
  skyrmions, strongly correlated electron systems, and topological properties
  using magnetometry, scanning probe microscopy, and neutron scattering.
