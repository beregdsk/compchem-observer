description: Research group at KTH Department of Chemistry focused on
  theoretical chemistry and biology. Develops software for quantum molecular
  modeling on contemporary and future high-performance computing (HPC)
  platforms, provides microscopic understanding of novel catalysts for the
  utilization and conversion of solar energy and bioenergy, and develops theory
  for light–matter interactions, performing simulations to understand
  spectroscopy, solar-energy conversion, and bio-imaging.
