description: The Biogenic Crystals Research Group at the Institute of Physics,
  Lodz University of Technology, led by Prof. Jolanta Prywer, investigates the
  experimental and theoretical aspects of crystal growth, focusing on biogenic
  crystals such as those in plants and infectious urinary stones. The group
  employs kinetic-geometric modeling, ab initio quantum mechanical calculations,
  and optical spectroscopic techniques to study crystal morphology, nucleation,
  and biomineralization processes.
