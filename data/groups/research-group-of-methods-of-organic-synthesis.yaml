description: The research group of methods of organic synthesis at the Faculty
  of Chemistry, University of Warsaw, led by dr hab. Michał Barbasiewicz,
  focuses on developing new synthetic methodologies. Their research investigates
  nucleophilic reactions with π-electrophilic compounds, including nucleophilic
  substitutions, olefination of carbonyls, functionalization of arenes, and
  enantioselective additions.
