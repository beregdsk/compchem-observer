description: The Energy Material Physics and Applications research division at
  Uppsala University's Department of Physics and Astronomy focuses on
  understanding atomic-level processes in renewable energy systems, including
  solar cells, batteries, fuel cells, and catalysis. They utilize advanced X-ray
  based spectroscopic techniques to investigate complex interfaces and charge
  dynamics to promote sustainable energy conversion.
