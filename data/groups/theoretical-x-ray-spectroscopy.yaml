description: The group aims to uniquely correlate spectroscopic properties to
  electronic structure and geometric properties of target materials, working
  closely with the experimental X-ray spectroscopy groups of the neighbor
  MPI-CEC institute. They employ wavefunction-based methods to evaluate unique
  spectroscopic signatures of transition metal complexes and materials in both
  equilibrium and under operando conditions, developing and using methods like
  ROCIS, PNO-ROCIS, CASCI/NEVPT2, MRCI, and MREOM-CC to compute XAS and VtC-RXES
  spectra of molecular and solid systems.
