description: The Emergent Molecular Electronics Research Team at the RIKEN
  Center for Emergent Matter Science focuses on organic semiconductors, polymer
  physics, and molecular electronics. The team utilizes original technology to
  combine polymers, small molecules, and ions to create 'metallic plastic
  materials' that exhibit metal-like electrical and thermal conductivity,
  conducting research from basic physical properties to applied material
  synthesis.
