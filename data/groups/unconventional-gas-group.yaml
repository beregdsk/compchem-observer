description: The Unconventional Gas Group (UGRG) at Curtin University, led by
  Professor Reza Rezaee, focuses on evaluating unconventional gas resources,
  particularly tight gas and shale gas in the Perth and Canning Basins of
  Western Australia. The group conducts research in geological reservoir
  modelling, pore network modelling, NMR spectroscopy for pore size
  distribution, and the application of intelligent systems for shale gas
  evaluation.
