description: The Dynamic Emergent Phenomena Research Team, part of the Center
  for Emergent Matter Science at RIKEN, focuses on elucidating the dynamic
  aspects of emergent properties in strongly correlated electron systems. The
  team investigates topological magnetic structures and domain walls using
  spectroscopy and scanning probe microscopy, aiming to discover and control
  novel material properties under external fields.
