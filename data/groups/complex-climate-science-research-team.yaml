description: The Complex Climate Science Research Team, led by Hirofumi Tomita
  at the RIKEN Center for Computational Science (R-CCS) in Kobe, develops
  foundational software libraries and computational tools for high-performance
  climate modeling. Their research focuses on improving the numerical accuracy
  and efficiency of global atmospheric and climate simulations on supercomputers
  to better understand and predict climate dynamics.
