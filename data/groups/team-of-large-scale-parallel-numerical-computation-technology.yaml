description: The Large-scale Parallel Numerical Computation Technology Research
  Team at RIKEN Center for Computational Science (R-CCS), led by Toshiyuki
  Imamura, focuses on developing high-performance numerical computation software
  libraries, such as KMathLIB and EigenExa, for supercomputers like Fugaku.
  Their research targets core numerical algorithms, including parallel
  eigenvalue solvers, linear algebra, and mixed-precision computing, to enable
  efficient large-scale scientific simulations.
