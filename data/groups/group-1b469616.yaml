description: The Comprehensive Disaster Prevention and Mitigation Research Team
  at RIKEN Center for Computational Science, led by Team Principal Hirofumi
  Tomita, conducts large-scale numerical simulations of complex disasters—such
  as earthquakes, tsunamis, and heavy rains—targeting real cities in Kobe and
  Hyogo Prefecture. The team develops automated urban structure modeling
  techniques and high-performance computing tools to bridge scientific research
  and administrative disaster mitigation planning.
