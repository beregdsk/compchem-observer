description: The Gutiérrez de Terán lab at Uppsala University focuses on
  computational biology and bioinformatics, developing molecular dynamics
  simulation methods and machine learning models for membrane receptors
  (especially GPCRs), protein-ligand interactions, and predicting pathogenic
  mutations. Their research also covers free energy methods for ligand screening
  and optimization, protein stability, and novel cancer immunotherapy
  strategies.
