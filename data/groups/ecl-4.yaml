description: The Imai Extreme Energy Conversion Science RIKEN ECL Research Team,
  led by Miyabi Imai, is a research group at RIKEN in Wako, Japan. The team uses
  scanning tunneling microscopy and single-molecule spectroscopy to investigate
  structure-function relationships of molecules at the atomic scale. Their
  research focuses on understanding energy conversion mechanisms in individual
  molecules, particularly those relevant to biological systems and organic
  electronics. By correlating molecular structure with energy conversion
  function at atomic resolution, they aim to design novel materials with
