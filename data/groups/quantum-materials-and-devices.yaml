description: Quantum Materials and Devices is a research division at Uppsala
  University's Department of Physics and Astronomy. The group explores novel
  charge, spin, and orbital phenomena in 2D quantum materials like graphene,
  semiconductors, and magnets. Using state-of-the-art nanofabrication and
  spectroscopic techniques, they study ultrafast dynamics for applications in
  energy-efficient electronics, computing, and catalysis.
