description: The Emergent Functionality Design Research Unit at RIKEN Center for
  Emergent Matter Science, led by Unit Leader Shun Okumura, focuses on the
  theoretical and computational investigation of emergent functionalities in
  quantum materials. Their research includes electrical and optical
  conductivity, non-equilibrium dynamics, and first-principles calculations for
  spin-charge coupled and topological systems.
