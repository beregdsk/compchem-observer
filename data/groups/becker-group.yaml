description: The Becker Group at the Institute of Physical and Theoretical
  Chemistry of TU Braunschweig, led by Prof. Dr. K.-D. Becker, focuses on
  experimental physical chemistry, particularly solid-state chemistry,
  diffusion, and ionic conductivity. Their research employs various
  spectroscopic techniques, including gamma, Mössbauer, PAC, and optical
  spectroscopy, alongside impedance spectroscopy and X-ray diffraction.
