description: The Li Research Group at the University of Southern California, led
  by Principal Investigator Zhenglu Li, focuses on computational and theoretical
  chemistry and materials science. The group conducts research in excited-state
  dynamics, photochemistry, quantum dynamics, and the modeling of advanced
  materials, utilizing electronic structure methods and machine learning to
  understand and predict molecular behavior.
