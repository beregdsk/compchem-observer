description: The Associate Professorship of Theoretical Chemistry at the
  Technical University of Munich, led by Prof. Dr. Christopher Stein, focuses on
  theoretical and computational chemistry applied to energy materials such as
  batteries and catalysts. The group uses cluster-embedding models, grand
  canonical Monte Carlo, semiempirical electronic structure methods, and machine
  learning to explore chemical spaces and identify lifetime-shortening
  processes.
