description: The Quantum Lab (Quantum Material Device Laboratory) at Uppsala
  University's Department of Physics and Astronomy is an experimental research
  group led by Associate Professor M. Venkata Kamalakar. Founded in 2017, the
  lab investigates low-temperature charge and spin transport in nanodevices of
  low-dimensional and 2D materials, such as graphene and 2D magnets. Its
  research spans spintronics, orbitronics, quantum sensors, and van der Waals
  heterostructures, using advanced nanofabrication, magneto-transport, and
  spectroscopic techniques. The group also operates a millikelvin facility and
