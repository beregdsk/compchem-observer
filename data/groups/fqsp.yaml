description: 'The Fundamental Quantum Science Program (FQSP) is a research
  program under the RIKEN TRIP division. It focuses on deepening the fundamental
  understanding of quantum science through four key pillars: basic physics and
  chemistry, mathematics, quantum information, and non-equilibrium science. The
  program promotes international collaboration and talent development to
  establish a global research hub for fundamental quantum science.'
