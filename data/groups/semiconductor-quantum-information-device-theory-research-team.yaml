description: The Semiconductor Quantum Information Device Theory Research Team
  at RIKEN Center for Quantum Computing works on the theory of spin-based
  quantum computers. They design CMOS-compatible Si and Ge gated quantum dots,
  study spin qubits manipulated by electric fields via spin-orbit interactions,
  investigate electronic properties in low-dimensional geometries using
  bandstructure models, and seek ways to protect qubits from noise and scale up
  qubit networks.
