description: The Kasson lab at Uppsala University, led by Peter Kasson,
  investigates how enveloped viruses infect cells by combining single-virus
  optical microscopy with molecular dynamics simulations. The research focuses
  on the physical determinants of virus-membrane interactions and fusion to
  understand viral entry mechanisms and tropism.
