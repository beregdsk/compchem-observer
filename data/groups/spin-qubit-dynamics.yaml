description: The Spin qubit dynamics group, part of the Quantum Control division
  at the Peter Grünberg Institute (PGI-8), focuses on optimizing the control of
  solid-state spin qubits in electrostatically defined quantum dots. They
  develop differentiable models and apply quantum optimal control to improve
  single- and two-qubit operations and spin shuttling, collaborating with
  experimentalists to tackle challenges like charge noise.
