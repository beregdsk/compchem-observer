description: The Cronin Group, also known as the Digital Chemistry group at the
  University of Glasgow and led by Professor Lee Cronin, focuses on advancing
  digital chemistry and chemputation. Their research integrates automated
  robotic platforms, machine learning, and chemical programming languages to
  synthesize molecules, explore chemical space, and investigate complex chemical
  systems and the origins of life.
