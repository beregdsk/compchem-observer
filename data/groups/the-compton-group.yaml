description: The Compton Group at the University of Oxford is a leading research
  group specializing in electrochemistry, led by Richard Compton. Their research
  spans fundamental theory of electron transfer and mass transport to practical
  applications in chemical sensors, electroanalysis, nanoelectrodes, room
  temperature ionic liquids, and bioelectrochemistry, with dedicated
  experimental and theoretical subgroups.
