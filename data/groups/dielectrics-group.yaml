description: The Dielectrics Group at the Institute of Physics, Lodz University
  of Technology, conducts theoretical, numerical, and experimental research on
  dielectric materials, including liquid crystals, polymers, epoxy resins, and
  carbon films. The group's work focuses on computer simulations, DFT
  calculations, and dielectric spectroscopy to study molecular dynamics and
  structural properties for microelectronic and optoelectronic applications.
