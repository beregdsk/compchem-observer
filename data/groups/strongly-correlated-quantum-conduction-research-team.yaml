description: The Strongly Correlated Quantum Conduction Research Team at the
  Center for Emergent Matter Science, RIKEN, led by Director Yoshinori Tokura,
  investigates quantum transport phenomena in thin films, hetero interfaces, and
  bulk materials. Their research focuses on spin-orbit interactions in
  non-centrosymmetric systems, spin structures, unconventional superconductivity
  under high pressure, and topological insulators, using low-temperature,
  high-magnetic-field transport measurements and terahertz spectroscopy.
