description: The Energy Materials research group at Aarhus University's
  Department of Chemistry, led by Professor Torben René Jensen, focuses on the
  discovery, synthesis, and structural characterization of novel inorganic
  materials and nanocomposites. The group's core research lies in developing
  advanced electrolyte materials for solid-state magnesium, calcium, and lithium
  batteries, as well as porous materials for gas storage and nanoconfined
  chemical reactions.
