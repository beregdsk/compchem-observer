description: The INNOMAT research group at the Universitat de València focuses
  on the synthesis of innovative porous, mesoporous, and nanostructured
  materials for applications in sensors, catalysis, drug delivery, and cultural
  heritage conservation. They also develop and apply advanced material
  characterization techniques, such as Raman and EDXRF spectroscopy, and
  high-resolution optical and electrical characterization methods.
