description: This is the official homepage of the research group led by Anatole
  von Lilienfeld, currently based at the University of Toronto and the Vector
  Institute. The group focuses on theoretical, computational, and statistical
  learning methods for understanding chemical compound space, utilizing density
  functional theory, molecular dynamics, machine learning, and high-performance
  computing to study materials, liquids, and molecular crystals.
