description: SurfLab is a research group based at the Department of Chemistry,
  Aarhus University, led by Professor Tobias Weidner. The group investigates
  molecular structures, orientations, and dynamics at interfaces using static
  and time-resolved sum frequency generation spectroscopy, NEXAFS, and molecular
  dynamics simulations. Their research spans protein folding at surfaces,
  biomolecular interactions, photodegradation, and surface modifications for
  anti-fouling and friction reduction.
