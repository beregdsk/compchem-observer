description: 'Professor of Physics at the Universitat de Barcelona leading
  theoretical and computational research on soft matter out of equilibrium,
  across three intertwined directions: collective phenomena in active matter,
  soft and complex fluids (colloids, droplets, electrokinetics, and the rheology
  of confined red blood cells), and the mesoscale algorithms — lattice Boltzmann
  and dissipative particle dynamics — that bridge particle-level statistical
  physics and continuum hydrodynamics.'
