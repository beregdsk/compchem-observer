description: The Maia lab at Uppsala University, within the Department of Cell
  and Molecular Biology, is led by Filipe Maia. The lab focuses on developing
  lensless X-ray imaging techniques using X-ray free-electron lasers (XFELs) to
  study structural dynamics at the nanoscale. They design novel sample delivery
  methods, such as aerosol-based and solution-based jet systems, and develop
  advanced algorithms and software for data analysis to capture molecular movies
  of proteins in action.
