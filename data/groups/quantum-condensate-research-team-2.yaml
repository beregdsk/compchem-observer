description: The Quantum Condensate Research Team, part of the Center for
  Emergent Matter Science at RIKEN, is led by Director Masahito Ueda. The team
  investigates quantum condensates—such as ultracold atomic gases,
  superconductors, and liquid helium—where macroscopic quantum properties
  emerge. Their research spans fundamental quantum physics, topological and
  non-Hermitian systems, quantum thermalization, and applications in quantum
  information, control, and quantum simulators, incorporating machine learning
  techniques.
