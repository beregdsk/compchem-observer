description: The Gerrit Boschloo group at Uppsala University investigates
  fundamental aspects of dye-sensitized solar cells and perovskite solar cells.
  Their research focuses on the molecular design of dyes, redox mediators, and
  hole conductors, alongside studying ion conduction and stability to advance
  low-cost photovoltaic technologies.
