description: The Görling Group is a computational and theoretical chemistry
  research group led by Prof. Dr. Andreas Görling, located at the Department of
  Chemistry and Pharmacy of Friedrich-Alexander-Universität Erlangen-Nürnberg in
  Erlangen, Germany. The group focuses on the development and application of
  advanced quantum chemical methods, including density functional theory (DFT)
  and wavefunction methods for electronic structure and excited states.
