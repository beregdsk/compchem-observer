description: The RIKEN Center for Computational Science (R-CCS) is a leading
  Japanese research institute focused on the research and development of core
  information technologies for high-performance computing (computational
  science) and utilizing HPC to solve scientific and societal challenges
  (science by computation). It hosts multiple research teams working on areas
  including quantum chemistry, molecular dynamics, first-principles
  calculations, climate modeling, and the development of advanced supercomputing
  architectures, such as the Fugaku supercomputer.
