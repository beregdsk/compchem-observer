description: The Laboratory for Computational Molecular Design (LCMD) is a
  computational, theoretical, and digital laboratory at EPFL, focusing on
  electronic structure theory, method development, and conceptual work applied
  to homogeneous catalysis and organic molecular materials. Its research
  exploits the interplay between quantum chemistry, machine learning techniques
  (e.g., Q-stack), and data-driven pipelines (e.g., the NaviCat platform) for
  molecules and materials discovery.
