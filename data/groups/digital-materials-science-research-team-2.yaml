description: The Digital Materials Science Research Team, led by Shinji
  Tsuneyuki, is based at the RIKEN Center for Computational Science in Wako,
  Japan. The team develops advanced computational methods, including
  first-principles calculations and molecular dynamics, to predict material
  properties under extreme conditions and for dielectric or thermoelectric
  applications. By integrating data science, AI, and physics-based simulations,
  they aim to build digital twins for materials research and accelerate the
  discovery of novel functional materials.
