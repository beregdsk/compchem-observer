description: A research group at the Universitat de València that focuses on
  Molecular Electron Density Theory (MEDT) to study organic reactivity. It uses
  quantum mechanical analysis of electron density to understand reaction
  mechanisms, develops new concepts in conceptual DFT, and provides theoretical
  insights into organic reactions.
