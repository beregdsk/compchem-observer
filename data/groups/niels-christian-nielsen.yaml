description: The research group of Niels Christian Nielsen at Aarhus
  University's Department of Chemistry focuses on developing advanced magnetic
  resonance methods, including NMR, MRI, EPR, and DNP, to study molecular
  systems with atomic resolution. Their research covers NMR spectroscopy, soft
  materials chemistry, membrane proteins, and metabonomics, using advanced
  instrumentation and optimal control pulse sequence design.
