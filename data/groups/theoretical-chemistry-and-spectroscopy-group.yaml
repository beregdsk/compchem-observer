description: The Theoretical Chemistry and Spectroscopy Group at the Department
  of Chemical and Pharmaceutical Sciences of the University of Trieste. The
  group consists of theoreticians and experimentalists working on the
  development and application of methods to spectroscopic problems, such as
  plasmonic excitations in metal clusters, time-resolved processes, core-level
  transitions, and high-harmonic generation.
