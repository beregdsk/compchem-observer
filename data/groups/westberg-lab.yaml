description: The Westberg Lab at Aarhus University is a multidisciplinary
  research group combining computational and experimental methods to design,
  characterize, and apply light- and ligand-controlled protein tools. Their
  research focuses on designing non-natural proteins to study and control
  biological processes, with applications in cell signaling, neuroimmunology,
  drug targets, and sustainable biotechnologies.
