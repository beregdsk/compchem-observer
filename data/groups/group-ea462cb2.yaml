description: The Complex Climate Science Research Team, led by Team Principal
  Hirofumi Tomita, is part of the RIKEN Center for Computational Science
  (R-CCS). The team focuses on climate modeling and computational climate
  science, developing foundational libraries and analysis tools to run
  high-efficiency climate simulations on large supercomputers. Their research
  aims to understand and reduce uncertainties in computational methods,
  conducting pioneering high-resolution global atmospheric simulations to better
  represent convective processes and climate dynamics.
