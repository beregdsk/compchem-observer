description: The Quantum Computer Architecture Research Team at RIKEN conducts
  theoretical research on quantum computer architecture, spanning from
  fault-tolerant quantum computing to physical implementation. The team focuses
  on high-rate codes to minimize the resource overheads required for
  fault-tolerant quantum computation, aiming to enable practical quantum
  computers.
