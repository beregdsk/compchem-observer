description: The Quantum Materials Synthesis Research Team, led by Director
  Atsushi Tsukazaki, focuses on thin films and stacked interfaces of quantum
  materials. The team works on establishing thin-film fabrication techniques for
  topological materials, evaluating unique properties, discovering novel quantum
  materials, and clarifying the origins of their properties to develop
  functional low-power devices.
