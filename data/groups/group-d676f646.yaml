description: The Strongly Correlated Interface Research Group, led by Group
  Director Masato Kawasaki at the Center for Emergent Matter Science, RIKEN,
  focuses on designing interface structures with varying charge, spin, and
  orbital degrees of freedom. The group fabricates quantum materials,
  heterostructures, and artificial lattices using epitaxial growth techniques to
  explore novel quantum transport, interfacial magnetism, and topological
  phenomena. Their research aims to develop next-generation switching devices,
  memory, solar cells, and sensors based on strongly correlated quantum
  electronics.
