description: The Strongly Correlated Interface Research Group at RIKEN's Center
  for Emergent Matter Science, led by Group Director Masashi Kawasaki, designs
  interface structures with varied electronic degrees of freedom and fabricates
  epitaxial devices and artificial lattices. The group investigates quantum
  transport, interface magnetism, and responses to external fields, aiming to
  develop novel switching devices, memories, solar cells, and sensors based on
  strongly correlated quantum electronics.
