description: The Yunoki Computational Condensed Matter Physics Laboratory, led
  by Principal Researcher Seiji Yunoki at RIKEN, focuses on theoretically
  elucidating quantum phenomena in strongly correlated electron systems, such as
  transition metal oxides and low-dimensional organic conductors. Utilizing
  numerical methods like variational Monte Carlo and density matrix
  renormalization group, the group investigates novel electronic states, quantum
  dynamics, spin liquids, and topological phases, while developing new
  computational physics software and techniques.
