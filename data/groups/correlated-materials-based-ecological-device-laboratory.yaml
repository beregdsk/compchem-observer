description: The Correlated-materials-based Ecological-device Laboratory is a
  research team under the RIKEN Baton Zone Program, led by Team Director Satoshi
  Okamoto. The laboratory focuses on strongly correlated materials to develop
  next-generation, environmentally friendly devices, such as ultra-low power
  consumption ferromagnetic memory and energy harvesting systems. Their research
  integrates physics, chemistry, and engineering to explore complex systems and
  advanced functional materials.
