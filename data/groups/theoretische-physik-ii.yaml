description: The page is the official homepage of the research group Theoretical
  Physics II (Theoretische Physik II) at the Institute of Physics, University of
  Augsburg, Germany. Led by Prof. Dr. Abhinav Sharma, the group focuses on
  theoretical and computational soft matter physics, including active matter,
  polymer dynamics, biopolymer networks, and organic electronics. The page lists
  group members, contact details, address in Augsburg, and a comprehensive
  publication list.
