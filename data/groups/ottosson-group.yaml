description: The Ottosson group, led by Henrik Ottosson at Uppsala University,
  focuses on physical and theoretical organic chemistry, particularly
  excited-state aromaticity and antiaromaticity. Their research explores these
  fundamental concepts for applications in solar energy conversion, sustainable
  aviation fuels, and photovoltaics, combining experimental and computational
  approaches.
