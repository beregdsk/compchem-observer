description: The Laboratory of Bioorganic and Medicinal Chemistry at the Faculty
  of Chemistry, University of Warsaw, led by dr hab. Marzena Jankowska-Anyszka,
  conducts interdisciplinary research at the interface of chemistry, biology,
  and medicine. The group focuses on the design and investigation of bioactive
  compounds, particularly synthetic mRNA cap analogues as potential therapeutic
  agents and tools for studying translation. Their work also spans
  peptidomimetic inhibitors, prebiotic chemistry, catalytic peptides, and
  archaeometry.
