description: The Quantum Chemistry Group at the Institute of Physics, Lodz
  University of Technology, led by Katarzyna Pernal, focuses on the development
  of theoretical and computational methods in quantum chemistry. Their research
  centers on electronic structure methods, particularly density matrix
  functional theory (RDMFT), range-separated methods, and density functional
  theory (DFT) for predicting molecular properties, excited states, and
  intermolecular interactions. They also explore quantum computing applications
  like the variational quantum eigensolver.
