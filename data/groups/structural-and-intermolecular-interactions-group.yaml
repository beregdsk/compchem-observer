description: The Structural and Intermolecular Interactions Group, led by Dr.
  Maura Malińska at the Faculty of Chemistry, University of Warsaw, focuses on
  molecular recognition in chemical and biological systems. The group combines
  X-ray crystallography with computational chemistry and molecular modeling to
  study non-covalent interactions, host-guest complexes, and protein-ligand
  interactions for drug design.
