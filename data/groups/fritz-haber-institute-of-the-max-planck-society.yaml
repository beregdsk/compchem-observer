description: The Fritz Haber Institute of the Max Planck Society is a leading
  research institute located in Berlin-Dahlem, Germany. Established in 1911 as
  the Kaiser Wilhelm Institute for Physical Chemistry and Electrochemistry, it
  covers a broad range of topics including chemical kinetics, colloid chemistry,
  atomic physics, spectroscopy, surface science, theoretical chemistry, and
  materials science. Its current departments focus on inorganic chemistry,
  electronic structure, electron microscopy, interface science, molecular
  physics, physical chemistry, and theory.
