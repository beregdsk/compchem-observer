description: The Integrated Data and Computational Science Program (CoRe) at
  RIKEN aims to build and advance hybrid computing environments combining
  supercomputers and quantum computers, accumulate high-quality experimental and
  measurement data, and develop advanced simulation methods, data science, and
  predictive algorithms. It seeks to expand computational capabilities and
  pioneer future predictive control science, applying its outcomes to diverse
  fields such as physics, chemistry, and life sciences.
