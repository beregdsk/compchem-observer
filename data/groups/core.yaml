description: The Integrated Data and Computational Science Program (CoRe) is a
  research group under the TRIP headquarters at RIKEN. Led by Program Director
  Masashi Tsuneyoshi, the program focuses on building hybrid computing
  environments combining supercomputers and quantum computers, accumulating
  high-quality experimental data, and developing advanced simulation, data
  science, and machine learning methodologies. It aims to expand the frontiers
  of computational science and apply these technologies to physics, chemistry,
  biology, and other fields to solve global challenges.
