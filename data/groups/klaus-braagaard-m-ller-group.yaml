description: The Klaus Braagaard Møller Group at DTU Chemistry focuses on
  theoretical and computational physical chemistry, investigating atomistic
  structures and transformation pathways in chemical dynamics. Their research
  encompasses quantum and semi-classical theory of molecules, materials, and
  light, statistical mechanics, reaction kinetics and dynamics, and
  theory/simulation of ultrafast time-resolved experiments. They study
  structural dynamics, solvation phenomena, electron excitation, relaxation, and
  transport, with applications in photochemistry, photocatalysis, and materials
