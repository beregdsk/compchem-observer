description: The Quantum Control (PGI-8) research group at the Peter Grünberg
  Institute, Forschungszentrum Jülich, focuses on combining quantum optimal
  control with applications in few- and many-body systems for the development of
  quantum technologies. Its main research areas include automated optimization,
  control and design to enable quantum technology, as well as synthetic matter
  and quantum simulation to explore novel many-body phases.
