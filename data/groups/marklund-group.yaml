description: The Marklund Group, led by Erik Marklund at the Department of
  Chemistry for Life Sciences, Uppsala University, focuses on the structural
  dynamics and interactions of proteins and protein complexes. The group
  combines advanced computational methods, such as molecular dynamics
  simulations, with mass-spectrometric techniques like ion-mobility spectrometry
  to study macromolecules and gas-phase proteins.
