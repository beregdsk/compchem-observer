description: The page presents the research group 'Calculations of Parameters of
  the NMR Spectroscopy' at the Max-Planck-Institut für Kohlenforschung. The
  group focuses on the computational prediction of NMR chemical shifts and
  shielding tensors using high-accuracy quantum chemical methods like
  double-hybrid DFT and coupled-cluster theory. Their work includes developing
  algorithms for the ORCA software package, creating specialized basis sets, and
  applying these methods to chemical synthesis and materials science.
