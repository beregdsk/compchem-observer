description: The Micro- and NanoMagnetism (MNM) team at the Institut Néel
  focuses on investigating and engineering functional properties of
  nanostructured magnetic materials for applications in spintronics, energy, and
  life sciences. Their research includes studying micromagnetic configurations
  in thin films and nanostructures, manipulating them via magnetic/electric
  fields or currents, and developing high-throughput combinatorial methods
  combined with machine learning for sustainable magnet design.
