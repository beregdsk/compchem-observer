description: The Quantum Information Processing (QIP) group at the Jülich
  Supercomputing Centre (JSC) focuses on benchmarking gate-based and analog
  quantum computers, simulating quantum systems, and developing prototype
  applications. They work on integrating quantum devices into HPC architectures
  for hybrid classical-quantum computing, targeting optimization, quantum
  simulations for materials and chemicals, and drug design.
