description: The Quantum Theory of Materials Research Group at RIKEN's Center
  for Emergent Matter Science explores novel quantum phases emerging from
  strongly correlated electron systems in solids. Their research focuses on
  transport phenomena, magnetism, and superconductivity in topological
  insulators, frustrated quantum magnets, transition metal oxides, and molecular
  conductors, employing analytical and computational physics approaches.
