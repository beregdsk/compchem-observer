description: 'This page is the official division page for X-ray Photon Science
  at the Department of Physics and Astronomy, Uppsala University. Headed by
  Nicusor Timneanu, the division conducts advanced research in X-ray
  spectroscopy, electronic structure, photochemistry, and bio-molecular physics,
  utilizing synchrotron radiation and free-electron lasers. It comprises two
  sub-sections: Condensed Matter Physics of Energy Materials and Chemical and
  Bio-Molecular Physics, hosting a large team of professors, researchers, and
  students.'
