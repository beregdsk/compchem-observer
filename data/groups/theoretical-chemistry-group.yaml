description: The Theoretical Chemistry Group at the University of Oxford
  conducts pioneering research in theoretical and computational chemistry. Their
  research spans quantum condensed matter theory, electronic, magnetic, and
  transport properties of condensed phase materials, electronic and optical
  processes in organic macromolecular systems, quantum mechanics of molecular
  collisions, chemical reaction dynamics, soft condensed matter and biological
  materials, and computational studies of structure, bonding, reactivity, and
  catalysis in inorganic and organic systems.
