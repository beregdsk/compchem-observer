description: The RIKEN ECL Research Team / Fujishiro Unit focuses on the physics
  of emergent phenomena in magnetic topological materials and strongly
  correlated electron systems under extreme conditions. Using advanced
  micro-fabrication of quantum single crystals, they generate ultra-high
  pressures, drive magnetic dynamics with high-density currents, and tune
  carrier densities with ionic liquids to explore novel quantum phases and
  quantum transport properties.
