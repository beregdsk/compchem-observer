description: The research group 'Enabling quantum-computing applications'
  focuses on the foundations of quantum-computing applications and their
  operational principles. Covering the full quantum-computing stack, they
  investigate near-term quantum algorithms, quantum control, and quantum systems
  theory based on symmetries of high-dimensional quantum dynamics, aiming to
  bridge quantum computing with science and industry.
