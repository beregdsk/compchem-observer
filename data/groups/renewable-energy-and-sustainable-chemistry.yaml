description: The Tilley Group, operating under the Renewable Energy and
  Sustainable Chemistry division at the University of Zurich, is led by Prof.
  Dr. David Tilley. The group conducts experimental and applied research focused
  on sustainability, specifically targeting the enhancement of
  photoelectrochemical water splitting through nanostructured inorganic thin
  films, and developing green synthetic pathways using organic electrochemistry.
