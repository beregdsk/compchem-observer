description: Jens Carlsson's group at Uppsala University's Department of Cell
  and Molecular Biology focuses on structure-based protein modelling for drug
  design. Using molecular dynamics, docking, and machine learning, they study
  protein-ligand interactions—particularly in GPCRs and enzymes involved in
  cancer and infections—to improve atomic-level understanding and accelerate
  drug discovery.
