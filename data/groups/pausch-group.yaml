description: The Pausch group is a junior research group for theoretical
  chemistry at the University of Münster. The group focuses on
  environment-controlled quantum chemistry, modeling how complex environments
  shape molecular and spectroscopic properties. Research includes the effects of
  high pressure and solvation on UV/Vis and fluorescence spectroscopy, the
  quantum geometry framework, molecular Berry curvature, relativistic effects,
  magnetic fields, and current density functional theory.
