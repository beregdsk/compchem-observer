description: The page is the official group page for the Femtosecond Quantum
  Dynamics and Reaction Kinetics research group, led by Associate Professor
  Niels Engholm Henriksen at DTU Chemistry. The group focuses on the quantum
  mechanical description of molecules, femtosecond dynamics, and using
  ultrashort laser pulses to control chemical reactions, combining analytical
  theory, computational modeling, and high-performance computing.
