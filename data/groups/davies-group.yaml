description: The Davies Group, part of the School of Chemistry at the University
  of Birmingham, is a multinational research team led by Dr. Paul Davies.
  Focusing on catalysis for molecular synthesis, the group designs novel
  multifunctional catalysts and studies reaction mechanisms to promote
  sustainable chemistry, early-stage drug discovery, and molecular electronics.
