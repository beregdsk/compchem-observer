description: The Mowbray lab at Uppsala University's Department of Cell and
  Molecular Biology, led by Sherry Mowbray, investigates protein structures at
  the atomic level to understand their biological functions. The lab focuses on
  cloning, expressing, and crystallizing essential pathogen enzymes, using X-ray
  crystallography and drug design to develop small molecule inhibitors targeting
  diseases like malaria and tuberculosis.
