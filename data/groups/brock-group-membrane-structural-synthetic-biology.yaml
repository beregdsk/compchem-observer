description: The Brock Group, led by Joseph Brock at the ANU Research School of
  Biology, focuses on the structural and synthetic biology of membrane proteins.
  Using X-ray crystallography and Cryo-Electron Microscopy, the group visualises
  membrane proteins to understand drug resistance, receptor signalling, and
  disease mechanisms. They also engineer yeast using synthetic biology for
  biosensors and protein production.
