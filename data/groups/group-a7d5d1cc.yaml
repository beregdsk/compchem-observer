description: The Innovation Soft Matter Function Research Group at the RIKEN
  Center for Emergent Matter Science, led by Group Director Takuzo Aida, focuses
  on the precise control of structures and properties from molecular to
  macroscopic scales to address global energy and environmental issues. Their
  research includes developing efficient photocatalysts for water splitting
  using abundant elements, organic ferroelectrics for low-power, high-density
  recording media, and novel soft graphene materials based on rapid graphite
  exfoliation.
