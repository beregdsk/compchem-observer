description: The Materials Dynamics Group at the RIKEN SPring-8 Center, led by
  Group Director Alfred Baron, investigates the dynamics of materials on meV
  energy scales and atomic length scales. Using non-resonant inelastic x-ray
  scattering, the group studies crystalline materials under extreme conditions,
  thermal transport, and disordered systems like liquids and glasses. They
  operate advanced x-ray instrumentation to explore mesoscale dynamics and
  phonon behavior.
