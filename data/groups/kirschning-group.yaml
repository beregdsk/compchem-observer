description: The Kirschning Group, led by Andreas Kirschning at the Department
  of Chemistry for Life Sciences, Uppsala University, focuses on natural
  products, antiinfectives, chemobiosynthesis, and the origin of life. Their
  research includes the search for and medicinal chemical development of new
  antibiotics and antiviral agents, as well as the chemical use of terpene
  cyclases to expand the terpenome.
