description: Computational chemistry group led by Prof. Feliu Maseras at ICIQ in
  Tarragona, applying DFT and DFT/MM methods to study chemical processes of
  practical interest, with a main focus on homogeneous catalysis in
  collaboration with experimental groups; ongoing research also covers
  photocatalysis, mechanochemistry, and organic electrosynthesis, aiming to
  improve the efficiency of catalytic processes.
