description: The Computational Chemistry Unit at the University of Copenhagen,
  part of the CBMR, focuses on translational pharmacology and rational drug
  design. The unit develops and applies cutting-edge computational chemistry and
  molecular dynamics methods to discover ligands and pharmacological tool
  compounds for metabolic target proteins, such as GPCRs, supporting basic
  metabolic research and innovation.
