description: The Strong-Field Nanophysics Group investigates ultrafast and
  highly nonlinear light-matter interactions in finite systems, focusing on
  strong-field physics of many-particle systems, attosecond nanophotonics, and
  ultrafast X-ray imaging. They aim to control collective electronic dynamics on
  the scale of a single optical cycle using precisely waveform-controlled light
  and X-ray pulses. To decipher response processes from infrared to X-ray
  ranges, they develop many-body simulation techniques for nanoparticles,
  nanoplasmas, and nanostructured solids.
