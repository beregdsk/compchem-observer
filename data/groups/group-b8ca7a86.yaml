description: The Particle-based Biophysics Research Team at RIKEN, led by Yuji
  Sugita, focuses on molecular dynamics simulations to understand the structure,
  dynamics, and function of biological macromolecules in crowded cellular
  environments and complex membranes. They develop multiscale models and the
  high-performance GENESIS software for large-scale simulations on
  supercomputers like Fugaku.
