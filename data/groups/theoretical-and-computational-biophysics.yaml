description: The group of Theoretical and Computational Biophysics, led by
  Helmut Grubmüller at the Max Planck Institute for Multidisciplinary Sciences,
  focuses on the computational and theoretical study of biomolecular machines,
  protein dynamics, and complex biomolecular systems. They develop efficient
  parallel simulation algorithms, statistical mechanics concepts, and quantum
  hybrid methods to simulate and understand the functional mechanisms of
  proteins.
