description: The Theoretical and Computational Chemistry department at Radboud
  University's Institute for Molecules and Materials focuses on explaining and
  predicting properties of molecules, clusters, and molecular solids. Using
  quantum mechanical, semiclassical, classical, and statistical mechanical
  methods, the group computes intermolecular potentials, studies molecular
  dynamics and collisions, and investigates diffusion in molecular solids. Led
  by Prof. Gerrit Groenenboom and Prof. Herma Cuppen, the group also contributes
  to education in quantum chemistry and molecular modelling.
