description: The Complex Phenomena Unified Solution Research Team, led by Makoto
  Tsubokura, develops integrated simulation frameworks like CUBE for complex
  multi-physics phenomena on large-scale HPC systems. The team focuses on
  accelerating simulations for next-generation CPU/GPU architectures,
  integrating AI and machine learning for surrogate modeling and real-time
  simulation, and developing quantum computing algorithms for partial
  differential equations to solve industrial challenges in automotive
  aerodynamics and fluid dynamics.
