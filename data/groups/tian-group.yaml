description: The Tian group, led by Professor Haining Tian at Uppsala
  University, works on molecular devices for artificial photosynthesis. Their
  research focuses on developing organic materials and devices for solar energy
  conversion and storage, including organic polymer nano-photocatalysts, water
  splitting, CO2 reduction, and solid-state mesoporous solar cells.
