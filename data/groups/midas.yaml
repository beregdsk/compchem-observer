description: The MIDAS group (Molecular Interactions Dynamics And Simulation) at
  Aarhus University, led by Professor Ove Christiansen, focuses on theoretical
  and computational chemistry. Their research centers on developing new
  computational methods for the quantum description of molecular dynamics,
  utilizing coupled cluster theory and vibrational coupled cluster (VCC)
  approaches. They aim to apply these methods to large molecular systems and
  develop specialized software like MidasCpp, alongside contributing to packages
  like Dalton and Turbomole.
