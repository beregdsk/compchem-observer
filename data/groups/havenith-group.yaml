description: The Havenith Group at the University of Groningen works on quantum
  chemistry method development, magnetic properties, organic photovoltaics,
  non-orthogonal configuration interaction, and valence bond theory.
  Participating in the FOM Focus Group 'Next Generation Organic Photovoltaics',
  they use electronic structure methods and optoelectronic device models to
  predict material properties and solar cell performance, focusing on
  structure-property relations, exciton mobility, and charge transfer.
