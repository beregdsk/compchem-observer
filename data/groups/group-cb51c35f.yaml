description: The Cooling Atom Quantum System Research Team at RIKEN's Quantum
  Computing Research Center, led by Sylvain de Léséleuc, focuses on developing
  quantum technologies using individual atoms manipulated by lasers. The team
  cools atoms to absolute zero, traps them using optical tweezers, and excites
  them to Rydberg states to engineer atom-by-atom quantum systems, aiming to
  realize neutral-atom quantum computers.
