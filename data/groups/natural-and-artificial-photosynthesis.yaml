description: The research group 'Natural and Artificial Photosynthesis' at the
  Max Planck Institute for Coal Research, led by Dimitrios Pantazis,
  investigates the fundamental mechanisms of biological photosynthesis, focusing
  on the water-oxidizing complex of Photosystem II. The group develops and
  applies accurate quantum chemical methods to compute energetics, spin states,
  and spectroscopic properties (such as EPR and X-ray spectroscopy) of complex
  metalloenzymes, bridging the gap between biological photosynthesis and
  artificial solar fuel production.
