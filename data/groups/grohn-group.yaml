description: The Gröhn Group, led by Prof. Dr. Franziska Gröhn at the Department
  of Chemistry and Pharmacy of Friedrich-Alexander-Universität
  Erlangen-Nürnberg, focuses on molecular nanostructures and functional
  materials assembled via self-assembly. Their research covers sustainable
  synthesis of quantum dots, photocatalysis, light-switchable nanosystems,
  triggerable drug delivery, and nanostructure characterization of biomimetic
  systems.
