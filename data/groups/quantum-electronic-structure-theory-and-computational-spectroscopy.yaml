description: The group focuses on the development and application of advanced
  electronic-structure methods for predicting molecular response properties and
  spectra. They work at the interface of chemistry, physics, and computational
  science, pioneering coupled cluster methods for X-ray spectroscopy, damped
  response theory, and quantum computing approaches for simulating molecular
  processes.
