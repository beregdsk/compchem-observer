description: The Atomic group Jena at the Helmholtz Institute Jena and
  Friedrich-Schiller-Universität Jena studies the relativistic quantum dynamics
  of ions and beams. It investigates the structure, properties, and dynamical
  behavior of few- and multi-electron ions in strong Coulomb and radiation
  fields, aiming to understand relativistic, many-body, and QED effects under
  extreme conditions. Research impacts astro- and nuclear physics, warm dense
  matter, plasma diagnostics, and laser spectroscopy.
