description: The Modelling group, led by Fernando Martín, focuses on the
  theoretical and computational modeling of photoexcitation and photoionization
  processes in atomic, molecular, and solid-state systems induced by synchrotron
  radiation and ultrashort laser pulses, aiming to image and control ultrafast
  electron and nuclear dynamics. It also predicts the properties of complex
  molecular systems, aggregates, and fullerenes on surfaces, and designs novel
  two-dimensional materials like graphene.
