description: The Britton Research Group, led by Professor Melanie Britton at the
  University of Birmingham, focuses on developing nuclear magnetic resonance
  (NMR) spectroscopy and magnetic resonance imaging (MRI) methods to
  characterize complex chemical systems and visualize chemical processes. Their
  research spans visualizing electrochemical processes in batteries and
  corrosion, probing colloidal stability, characterizing reverse micelles, and
  studying thin films, utilizing molecular dynamics and NMR experiments to
  provide insights into molecular dynamics and soft matter systems.
