description: The Topological Properties Theory Research Team at the Center for
  Emergent Matter Science, RIKEN, led by Team Director Shuichi Murakami,
  conducts theoretical research on emergent physical phenomena focusing on
  topological structures in electrons, quasiparticles, and waves in
  metamaterials. Using primarily analytical models, the team investigates
  quantum to classical systems to discover universal laws and phenomena. Their
  research covers topological phases, chiral phonons, electromagnetic
  multipoles, non-Hermitian systems, and topological properties of classical
  waves in metamaterials…
