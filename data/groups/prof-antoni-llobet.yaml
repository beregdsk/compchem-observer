description: The research group led by Prof. Antoni Llobet at ICIQ focuses on
  molecular redox catalysis using transition metal complexes for the oxidation
  of water and ammonia, as well as the reduction of carbon dioxide and nitrogen.
  The group's research aims to generate clean and renewable solar fuels via
  artificial photosynthesis.
