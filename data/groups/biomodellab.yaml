description: Biomodellab is a computational chemistry research group at the
  Faculty of Chemistry, University of Warsaw, led by Prof. Sławomir Filipek. The
  group specializes in the molecular modeling of membrane proteins, focusing on
  G protein-coupled receptors (GPCRs) and the enzyme gamma-secretase. Their
  research investigates ligand binding, receptor activation, signal
  transduction, and the role of lipids and cholesterol, with a strong emphasis
  on drug design and understanding Alzheimer's disease. They also develop novel
  coarse-grained modeling methods for membrane proteins.
