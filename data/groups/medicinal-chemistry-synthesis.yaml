description: The Medicinal Chemistry - Synthesis group, coordinated by
  Alessandra Locatelli at the University of Bologna's Department of Pharmacy and
  Biotechnology, focuses on designing and synthesizing small heterocyclic
  molecules for anticancer and antibacterial therapies. Their research
  integrates chemical synthesis with biological evaluation, structure-activity
  relationships, and computational methods like molecular docking and molecular
  dynamics simulations to target proteins like tubulin, G-quadruplexes, and
  FtsZ.
