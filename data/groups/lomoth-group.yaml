description: The Lomoth group, led by Reiner Lomoth at the Department of
  Chemistry - Ångström Laboratory, Uppsala University, focuses on redox
  reactions and catalysis in molecular systems. The group investigates photo-
  and electrochemical processes for solar energy conversion, photoredox
  catalysis, and molecular catalysts for hydrogen evolution, utilizing
  spectroscopic and electrochemical methods.
