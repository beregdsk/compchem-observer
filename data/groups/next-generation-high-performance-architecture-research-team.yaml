description: The Next Generation High Performance Architecture Research Team at
  RIKEN Center for Computational Science focuses on researching and developing
  next-generation high-performance computer architectures to address the
  post-Moore's law era. The team works on improving power efficiency in exascale
  supercomputers, exploring non-von Neumann architectures like systolic arrays
  and neuromorphic computers, integrating non-volatile memories and
  accelerators, advancing scientific simulations via machine learning, and
  developing hybrid classical-quantum computing architectures.
