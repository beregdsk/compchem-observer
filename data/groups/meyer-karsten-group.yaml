description: The Meyer (Karsten) Group, led by Prof. Dr. Karsten Meyer at the
  Department of Chemistry and Pharmacy of Friedrich-Alexander-Universität
  Erlangen-Nürnberg, is an inorganic chemistry research group. Their research
  focuses on molecular materials for energy, information, and sustainability,
  including the electronic structures of coordination complexes, spectroscopic
  and computational analyses, electrocatalytic hydrogen production, and small
  molecule activation at reactive metal complexes.
