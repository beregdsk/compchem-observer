description: This page represents the research area of Nanoporous Materials and
  Soft Matter within the Computational Chemistry division at the Van 't Hoff
  Institute for Molecular Sciences, University of Amsterdam. The research
  focuses on the computational modeling of adsorption and diffusion in
  nanoporous materials (such as zeolites, MOFs, COFs, and ZIFs) and soft matter
  systems, including self-assembly, active soft matter, and polymer chemistry,
  using molecular dynamics and enhanced sampling techniques.
