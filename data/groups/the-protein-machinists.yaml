description: The Protein Machinists, led by Prof. Dr. Helen Ginn at the
  Institute of Nanostructure and Solid State Physics, University of Hamburg,
  focuses on understanding the dynamics of proteins and engineering them as
  molecular machines. The lab aims to deliver precision engineering of protein
  structures to advance biotechnological and green chemistry applications.
