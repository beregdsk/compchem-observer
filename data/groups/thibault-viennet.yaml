description: The research group of Thibault Viennet at Aarhus University's
  Department of Chemistry, under the Danish Center for Ultrahigh Field NMR
  Spectroscopy, focuses on protein regulation by NMR. They investigate the dark
  proteome, intrinsically disordered regions, and the impact of phosphorylation
  on protein dynamics and interactions using solution NMR spectroscopy and
  biophysical methods.
