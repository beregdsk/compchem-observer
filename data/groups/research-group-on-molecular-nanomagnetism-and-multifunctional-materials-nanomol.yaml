description: The NanoMol research group, led by Eugenio Coronado Miralles at the
  University of Valencia, focuses on the chemistry and physical characterization
  of molecular materials, including polyoxometalates, molecular conductors, and
  magnetic clusters. Their work spans molecular nanomagnetism, molecular
  spintronics devices, and the modeling of exchange interactions in magnetic
  systems.
