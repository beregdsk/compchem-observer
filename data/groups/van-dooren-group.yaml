description: The van Dooren Group at the ANU Research School of Biology studies
  the cell biology and metabolism of apicomplexan parasites, primarily focusing
  on Toxoplasma gondii and Plasmodium. Their research investigates nutrient
  acquisition, mitochondrial biology, and the parasite life cycle to identify
  and characterise novel compounds and develop new treatment options against
  these diseases.
