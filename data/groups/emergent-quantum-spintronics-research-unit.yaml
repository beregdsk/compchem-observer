description: The Emergent Quantum Spintronics Research Unit at RIKEN Center for
  Emergent Matter Science, led by Tomoyuki Yokouchi, focuses on understanding
  quantum and emergent properties in spintronics. By employing microfabrication
  techniques, the unit develops novel spintronic and quantum transport phenomena
  in various magnetic materials. Additionally, they investigate the classical
  and quantum dynamics of topological spin structures to establish emergent
  computational techniques like physical reservoir computing.
