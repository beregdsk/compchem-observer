description: The Mathematics of Complex Systems division at ZIB develops methods
  for modeling, simulation, and optimization of complex multiscale and
  multiphysics processes, alongside visualization and data analysis. It focuses
  on numerical mathematics, uncertainty quantification, and high-performance
  computing, with applications in individualized medicine, molecular biology,
  and materials sciences.
