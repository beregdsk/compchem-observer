description: The Dynamic Emergent Phenomena Research Team at the RIKEN Center
  for Emergent Matter Science, directed by Fumitaka Kagawa, explores dynamic
  phenomena in strongly correlated electron systems. They focus on
  external-field-driven dynamics in sub-micron structures like topological spin
  textures and domain walls, using spectroscopy and scanning probe microscopy to
  control novel condensed matter properties.
