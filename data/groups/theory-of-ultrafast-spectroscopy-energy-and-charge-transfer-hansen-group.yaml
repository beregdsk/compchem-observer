description: The Hansen group is a theoretical chemistry research group at the
  University of Copenhagen, focusing on ultrafast spectroscopy, energy and
  charge transfer in molecular systems, including molecular junctions, solar
  cells, and photosynthetic proteins. Their research explores quantum dynamics,
  catalysis in metalloproteins, and electron transport phenomena.
