description: The RMIT Centre for Additive Manufacturing (RCAM) is a
  multi-disciplinary research centre dedicated to advancing industrial additive
  manufacturing technologies. It unifies research in next-generation materials,
  technology and process development, digital ecosystems, sustainability, and
  AI-driven manufacturing. The centre collaborates with industry partners across
  aerospace, biomedical, automotive, mining, and energy sectors to enhance
  competitiveness and deliver innovative solutions.
