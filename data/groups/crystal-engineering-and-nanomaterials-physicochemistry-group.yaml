description: The Crystal Engineering and Nanomaterials Physicochemistry Group at
  the Faculty of Chemistry, University of Warsaw, led by Prof. Michał Ksawery
  Cyrański, conducts experimental and theoretical research in physical
  chemistry. Key research areas include X-ray structural analysis of pi-electron
  systems, modeling of aromatic stabilization energy, photochemical reactions in
  crystals, synthesis of carbon nitride materials, and the application of
  graph-topological models in chemistry.
