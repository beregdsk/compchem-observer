description: The Quantum Computational Science Research Team at RIKEN Center for
  Quantum Computing focuses on developing quantum-classical hybrid algorithms
  for simulating quantum many-body systems and analyzing quantum dynamics using
  quantum information. Their research encompasses computational science,
  condensed matter physics, and high-performance computing, with interests in
  tensor networks and quantum entanglement. The team is led by Director Seiji
  Yunoki and is based in Wako, Saitama, Japan.
