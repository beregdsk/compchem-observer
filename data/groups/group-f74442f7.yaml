description: This research group, led by Director Takahisa Arima at the Center
  for Emergent Matter Science, RIKEN, focuses on clarifying the origins of
  emergent properties in strongly correlated electron systems at the atomic
  level. They investigate the static spatial distributions and dynamic
  fluctuations of atomic arrangements, electron density, and spin density using
  quantum beams like X-rays, neutrons, and high-energy electrons for scattering,
  spectroscopy, and imaging.
