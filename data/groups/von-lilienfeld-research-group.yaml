description: The chemspacelab, led by Anatole von Lilienfeld at the University
  of Toronto, is a computational and theoretical chemistry research group. The
  lab focuses on developing and applying quantum chemical methods, machine
  learning potentials, and density functional theory (DFT) to model molecular
  systems, materials, and chemical reactions.
