description: The QCEXVAL group determines high-precision chemical mechanisms
  from the interaction of visible-UV radiation with molecular systems in
  biology, medicine, nanotechnology, and the environment, establishing the basis
  for predicting electronic properties and proposing new molecules. They use
  theoretical and computational chemistry, develop new methodologies, and
  research DNA damage/repair, dark photochemistry, chemiluminescence, and
  optical spectroscopy methods.
