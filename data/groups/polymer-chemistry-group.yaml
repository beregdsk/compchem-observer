description: The Polymer Chemistry Group at the Faculty of Chemistry, University
  of Warsaw, led by dr Grzegorz Szczepaniak, focuses on developing novel
  synthetic methods for advanced materials. Their research centers on
  photocatalysis, sustainable polymer depolymerization, and biocompatible
  photoinduced polymerization, with key applications in biomedical engineering,
  3D bioprinting, and soft matter materials.
