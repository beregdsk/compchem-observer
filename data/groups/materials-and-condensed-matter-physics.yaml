description: The Materials and Condensed Matter Physics research group at the
  University of Glasgow studies the physics of materials with an emphasis on the
  nanoscale. Focused on solving critical issues in energy, healthcare, and
  information technology, the group is underpinned by advanced characterisation
  and transmission electron microscopy techniques. Key research areas include
  functional materials, magnetic nanostructures, and theory and modelling.
