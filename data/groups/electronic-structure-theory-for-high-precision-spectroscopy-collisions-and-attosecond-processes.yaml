description: The research group led by Prof. dr hab. Robert Moszyński at the
  Faculty of Chemistry, University of Warsaw, focuses on the development of
  high-precision electronic structure methods for spectroscopy, collisions, and
  attosecond science. Their work targets ultracold molecules, relativistic and
  QED effects in molecular spectra, and multi-electron dynamics in strong laser
  fields, such as high harmonic generation and above-threshold ionization.
