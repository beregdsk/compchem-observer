description: The RIKEN Hakubi research team led by Erika Kawakami focuses on
  quantum information processing and quantum computing using electrons floating
  on helium surfaces. These surface electrons are free from impurities and
  defects, offering an ideal platform for quantum bits (qubits). The team also
  works on developing the necessary peripheral technologies for qubit
  integration to realize practical quantum computers.
