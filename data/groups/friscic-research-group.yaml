description: The Friščić Research Group at the University of Birmingham, led by
  Professor Tomislav Friščić, specializes in solid-state chemistry,
  mechanochemistry, and green sustainable chemistry. The group conducts research
  on metal-organic frameworks (MOFs), pharmaceutical cocrystals, and organic
  synthesis using mechanochemical techniques. It also integrates theoretical and
  computational chemistry, such as molecular dynamics and materials modeling, to
  understand solid-state reactivity and develop sustainable chemical processes.
