description: The Solid State Quantum Optics group at Forschungzentrums Jülich,
  part of the Peter Grünberg Institute (PGI-8), studies few-body quantum systems
  based on spins in solid-state materials for quantum technology applications.
  The group investigates the interplay of quantum control, environment and
  measurements from theoretical and numerical perspectives, focusing on coherent
  and dissipative manipulations including quantum optimal control, dynamical
  decoupling and measurement-based protocols. Research directions include
