description: The NPSC (Nanophysics and Semiconductors) team is a joint research
  group between Institut Néel (CNRS) and CEA-IRIG, focusing on fundamental
  nanoscience in low-dimensional II-VI and III-V semiconductor heterostructures.
  Their expertise covers advanced epitaxy (MBE, MOCVD), spintronics with
  magnetic quantum dots, quantum optics and optomechanics, quantum foundations
  and thermodynamics, 2D materials spectroscopy, semiconductor nanowires for
  quantum technologies, and rare-earth ion-based quantum memories and
  transducers.
