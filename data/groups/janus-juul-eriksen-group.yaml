description: The Janus Juul Eriksen Group at DTU Chemistry focuses on developing
  novel theories for decomposing complex electronic-structure theory. Their
  research explores spatial locality to understand chemical phenomena using
  quantum chemistry and machine learning. Activities range from near-exact
  electronic-structure methods to HPC- and GPU-accelerated quantum chemistry,
  and machine-learned quantum chemistry.
