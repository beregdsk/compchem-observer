description: The Quantum Device Theory group, part of Quantum Computing
  Analytics (PGI-12) at the Peter Grünberg Institute (PGI) within
  Forschungszentrum Jülich, explores how quantum principles like superposition
  and entanglement can be used to design advanced technologies. The group
  focuses on simulating theoretical designs to predict and refine performance
  before experiments, covering research areas such as circuit Quantum
  Electrodynamics for large quantum processors, simulating superconducting
  qubits, gates, and circuits, error correction and mitigation, and quantum
  machine learning for design and…
