description: Led by Unit Leader Kantaro Ohmori, this research unit focuses on
  understanding quantum field theory across particle physics, condensed matter
  physics, and quantum information using category theory and higher algebra.
  Based on generalized and non-invertible symmetries, they build frameworks to
  translate macroscopic matter behaviors into microscopic quantum models,
  combining tensor networks and lattice models to establish algebraic
  computational methods for quantum system design and simulation.
