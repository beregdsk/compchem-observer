description: The Laboratory of Chemistry of Biomimetic Functional Structures
  (ChemBioFuN Lab) at the Faculty of Chemistry, University of Warsaw, led by
  Prof. Sławomir Sęk, focuses on bioelectrochemistry, surface physicochemistry,
  and functional biomimetic systems. The group constructs and analyzes
  biomimetic lipid membranes to study interactions with antimicrobial peptides,
  investigates ion channels and long-range electron transport in peptides for
  molecular electronics, and utilizes advanced surface techniques like AFM and
  ATR-SEIRAS to develop bioinspired sensors and nanostructured biomaterials.
