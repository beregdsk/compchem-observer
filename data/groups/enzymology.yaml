description: The Enzymology group at the University of Bologna's Department of
  Pharmacy and Biotechnology, led by Alejandro Hochkoeppler, focuses on
  understanding enzyme function and catalysis at the molecular level. Research
  includes studying lactate dehydrogenase assembly, peptide inhibitors, and the
  effects of trehalose on enzyme stability, with applications in industrial,
  plant, and environmental biotechnology.
