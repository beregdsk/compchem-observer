description: The Quantum Plumbing Lab (LNQ) at EPFL, led by Prof. Nikita
  Kavokine, investigates quantum effects that emerge when liquids flow through
  extremely narrow channels in nanoscale systems. The lab focuses on quantum
  nanofluidics, leveraging theoretical and computational methods to model
  quantum behaviors in confined liquids for sustainability and renewable energy
  applications.
