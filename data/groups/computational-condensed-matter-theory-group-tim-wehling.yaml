description: The Computational Condensed Matter Theory group led by Prof. Dr.
  Tim Wehling at the I. Institute of Theoretical Physics, University of Hamburg,
  focuses on the theoretical study of quantum materials. The group investigates
  the interplay of electron and nuclear dynamics, correlation effects like
  metal-insulator transitions and superconductivity, and develops advanced
  ab-initio and many-body methods to design and control complex quantum states
  via nanostructuring and optical excitations.
