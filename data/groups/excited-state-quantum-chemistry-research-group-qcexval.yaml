description: The Excited State Quantum Chemistry Research Group (QCEXVAL)
  focuses on high-precision determination of chemical mechanisms resulting from
  the interaction of visible-UV radiation with molecular systems in biology,
  medicine, nanotechnology, and the environment. Utilizing theoretical and
  computational chemistry, they research photochemistry, DNA damage and repair,
  optical spectroscopy simulation, and chemiluminescence to predict electronic
  properties and propose novel molecules.
