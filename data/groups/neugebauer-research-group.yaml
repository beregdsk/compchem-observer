description: The Neugebauer Research Group at the University of Münster develops
  and applies smart quantum chemical methods for selective, efficient
  calculations in complex environments like solvents, proteins, molecular
  crystals, and surfaces. They focus on subsystem-based DFT and density-based
  embedding for ground and excited states, working on subsystem TDDFT,
  CC2/ADC(2), and GW/Bethe-Salpeter methods, light-driven processes, multi-level
  correlation methods, and the SERENITY software.
