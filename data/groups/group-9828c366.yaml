description: The Electronic State Microscopy Research Team at RIKEN's Center for
  Emergent Matter Science uses advanced electron microscopy to investigate
  electronic states, charge, spin, and their dynamics in materials at the atomic
  scale. Their research focuses on topological materials, high-temperature
  superconductors, and transition metal chalcogenides, aiming to understand
  emergent phenomena through nanoscale electronic state microscopy.
