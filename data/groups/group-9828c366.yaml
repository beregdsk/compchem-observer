description: The Electronic State Microscopy Research Team, part of the Center
  for Emergent Matter Science at RIKEN, utilizes advanced electron microscopy
  with atomic-level spatial resolution to investigate electronic states, charge,
  spin, and their dynamics in real space. Using ultrafast electron imaging and
  quantitative field measurements, the team explores emergent phenomena in
  materials such as high-temperature superconductors, topological magnets, and
  heterointerfaces, focusing on nanoscale electronic states and topological spin
  textures like skyrmions.
