description: The Guldi Group, headed by Prof. Dr. Dirk Michael Guldi at the
  Department of Chemistry and Pharmacy of Friedrich-Alexander-Universität
  Erlangen-Nürnberg, focuses on the design, synthesis, and modeling of
  nanometer-scale materials for energy conversion and storage. Utilizing
  advanced spectroscopic and microscopic techniques, the group investigates
  light- and charge-management processes, such as charge separation and
  transport, in nanocarbon-based molecular materials.
