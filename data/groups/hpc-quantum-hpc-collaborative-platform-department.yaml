description: The Quantum HPC Collaborative Platform Department at RIKEN Center
  for Computational Science (R-CCS) focuses on the integration of quantum
  computing (QC) and high-performance computing (HPC) to expand the frontiers of
  computation. The department develops system software to link QC and HPC,
  builds platform infrastructures for quantum research, and supports the
  practical application of quantum computers. It also conducts advanced
  technology development to validate quantum-HPC hybrid systems as a Platform as
  a Service (PaaS), in collaboration with NEDO, SoftBank, the University of
