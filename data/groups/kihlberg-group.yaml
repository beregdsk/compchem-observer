description: Led by Jan Kihlberg at Uppsala University's Department of Chemistry
  for Life Sciences, the Kihlberg Group focuses on designing novel chemical
  probes and drugs for challenging targets in cancer, kidney disease, and
  arthritis. Working at the interface of chemical biology and biomedicine, the
  group uses molecular dynamics, free energy simulations, virtual screening, and
  machine learning to optimize macrocycles, PROTACs, and GPCR ligands.
