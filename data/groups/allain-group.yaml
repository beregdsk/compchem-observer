description: The Allain Group at ETH Zurich investigates protein-RNA
  interactions central to pre-mRNA splicing and RNA editing, employing NMR
  spectroscopy alongside biochemical, biophysical, and computational approaches
  to elucidate molecular mechanisms underlying diseases such as spinal muscular
  atrophy, myotonic dystrophy, and ALS.
