description: "The Lindh Group at Uppsala University's Department of Chemistry
  for Life Sciences conducts quantum chemistry research in two main directions:
  method development and computer implementations of models to describe
  electronic wave functions, with a focus on multi-configurational wave
  functions for breaking bonds and excited molecules; and developing methods and
  algorithms to study non-adiabatic processes, chemoluminescence,
  bioluminescence, and photochemical and photophysical processes."
