description: The High-Performance AI Systems Research Team at RIKEN Center for
  Computational Science (R-CCS) is led by Team Principal Mohamed WAHIB. Based in
  Tokyo, the team focuses on the mutual high-performance integration of
  artificial intelligence/machine learning and high-performance computing (HPC).
  They research and develop advanced systems, software, and algorithms to enable
  ultra-scale, ultra-fast deep learning and accelerate complex AI models on
  flagship supercomputers like Fugaku.
