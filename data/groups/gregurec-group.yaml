description: The Gregurec Group, also known as the Biointerfaces Lab at the
  Department of Chemistry and Pharmacy of Friedrich-Alexander-Universität
  Erlangen-Nürnberg, is led by Prof. Dr. Danijela Gregurec. The group focuses on
  the design and synthesis of anisotropic magnetic nanomaterials, such as
  nanodiscs, and their applications in wireless neuromodulation, nanomedicine,
  biointerface engineering, and magnetic resonance imaging.
