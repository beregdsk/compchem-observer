description: The group applies electronic structure theory to materials
  sciences, especially when molecular structures or details are unknown or
  poorly characterized. The work focuses on assessing hypothesis plausibility,
  accounting for structural diversity, solvent, and environment effects, and
  rationalizing connections between atomic and electronic structure, properties,
  and mechanisms. In close cooperation with experimentalists, the group models
  complex material systems, reaction mechanisms, heterogeneous catalysis, and
  twin polymerization processes.
