description: The Kassal Group at the University of Sydney, led by Ivan Kassal,
  develops theoretical and computational tools for simulating energy and charge
  transport in disordered or dissipative materials and their interaction with
  light, applying techniques to next-generation materials and biological systems
  to improve solar energy conversion, and creating quantum computing methods for
  calculations too hard for classical supercomputers.
