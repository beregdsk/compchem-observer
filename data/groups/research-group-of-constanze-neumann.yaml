description: The research group of Dr. Constanze Neumann at the Max Planck
  Institute for Coal Research focuses on heterogeneous catalysis, particularly
  metal-organic frameworks (MOFs) and nanoparticle catalysis. Their work
  involves designing catalysts with unusual selectivity, developing cooperative
  MOF-based catalysts, synthesizing alloy nanoparticles, and creating smart
  support materials to guide reactions. Funded under the Lise Meitner Excellence
  program, they aim to facilitate the efficient production of fuels and
  chemicals from renewable resources.
