description: The Computational Molecular Design Research Team at the Center for
  Life Function Research, RIKEN, led by Team Director Masahiro Taiji, aims to
  design molecules that control target biomolecular functions through
  large-scale computer simulations. The team utilizes molecular dynamics and
  quantum chemistry simulations to bridge the gap between three-dimensional
  structures and biological functions of biomacromolecules. They also develop
  specialized high-performance computers, such as the MDGRAPE series, to conduct
