description: The research group of Prof. Dr. Volkhard Helms at the Center of
  Bioinformatics Saar applies numerical simulations and statistical methods to
  study biomolecular interactions, protein-protein contacts, DNA-protein
  interactions, and membrane bioinformatics. The group aims to understand
  cellular processes at the molecular level and develop clinical therapies for
  diseases like cancer.
