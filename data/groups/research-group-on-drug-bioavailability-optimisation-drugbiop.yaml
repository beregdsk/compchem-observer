description: The Research Group on Drug Bioavailability Optimisation (DRUGBIOP)
  at the University of Valencia focuses on designing drug delivery systems to
  optimise bioavailability. Their work covers in silico QSAR modelling,
  excipient and material design for drug transport, and biopharmaceutical
  evaluation of drug absorption via skin, ocular, intestinal, and pulmonary
  routes. They develop nano- and microparticles, microneedles, and polymeric
  films to enhance drug solubility, target specific tissues, and reduce systemic
  toxicity, using in vitro, in vivo, and computational methods.
