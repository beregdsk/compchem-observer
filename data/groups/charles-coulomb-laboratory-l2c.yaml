description: The Charles Coulomb Laboratory (L2C) is a research institute based
  at the Université de Montpellier in Montpellier, France. It conducts
  multidisciplinary research in condensed matter physics, soft matter, complex
  systems, and quantum physics, structured into six research axes and eighteen
  teams. Key topics include optical and electronic properties, spectroscopy,
  quantum phenomena, and bio-nano imaging, combining theoretical and
  experimental approaches.
