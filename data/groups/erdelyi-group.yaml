description: The Erdélyi Group, based at the Department of Chemistry for Life
  Sciences at Uppsala University, is a research group led by Máté Erdélyi. The
  group focuses on organic chemistry, specifically halogen bonding, NMR method
  development, antibiotic resistance, natural product chemistry, and macrocycle
  conformation, aiming to solve societal challenges through fundamental chemical
  research.
