description: The official website of the Miguel Caro Group at Aalto University,
  Finland, led by Prof. Miguel Caro. The group focuses on computer simulation of
  materials using atomist models, including machine learning potentials,
  molecular dynamics, and spectroscopy such as X-ray photoelectron spectroscopy,
  linking computational predictions to experiment to infer the structure of
  disordered materials.
