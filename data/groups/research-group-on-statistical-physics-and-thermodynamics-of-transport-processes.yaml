description: The research group focuses on the theoretical and experimental
  study of functionalised polymeric nanopores for micro- and nanofluidics,
  bio-inspired nanostructures for information processing, and cellular
  bioelectricity. Their research includes modeling membrane potentials,
  simulating multicellular electrical maps, and developing nanofluidic devices
  for logic and signal processing.
