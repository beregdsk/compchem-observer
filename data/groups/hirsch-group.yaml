description: The Hirsch Group is a research group at the Department of Chemistry
  and Pharmacy of Friedrich-Alexander-Universität Erlangen-Nürnberg, led by
  Prof. Dr. Andreas Hirsch. The group's research focuses on molecular materials
  for energy storage and molecular switches for information storage. It is
  affiliated with several collaborative research centers and profile centers at
  FAU.
