description: The official page of the Center for Photonics and Quantum
  Engineering (RAP) at RIKEN. The center aims to pioneer photonics by leveraging
  light's observation, analysis, and information capabilities. Its research
  spans ultra-precise optical lattice clocks, attosecond lasers, next-generation
  semiconductors, biophotonics, and AI-driven photonics. Organized into teams
  covering laser spectroscopy, nano photochemistry, quantum optoelectronics, and
  terahertz imaging, it seeks to open new frontiers across science and
  technology.
