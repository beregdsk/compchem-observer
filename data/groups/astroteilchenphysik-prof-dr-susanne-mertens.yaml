description: The Astroparticle Physics department led by Prof. Dr. Susanne
  Mertens at the Max Planck Institute for Nuclear Physics in Heidelberg conducts
  experimental research on fundamental questions of particle physics and
  cosmology. The group's main focus is on neutrino physics, including the direct
  measurement of neutrino mass with the KATRIN experiment and the search for
  neutrinoless double beta decay with LEGEND-1000, as well as the investigation
  of dark matter candidates using the XENON experiment and other detector
  technologies.
