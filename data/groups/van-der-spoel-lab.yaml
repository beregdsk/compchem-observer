description: The David van der Spoel lab at Uppsala University develops the
  Alexandria Chemistry Toolkit (ACT) to derive force fields for molecular
  simulation using quantum chemistry data. Research focuses on machine learning
  force fields, evaluating energy functions, predicting noble gas crystal
  properties, studying sigma holes in water, and determining partial charges,
  with future goals of simulating proteins in solution.
