description: The Hudson Group, led by Associate Professor Toby Hudson at the
  University of Sydney, investigates structural materials chemistry using
  computational techniques like Monte Carlo simulation, classical molecular
  dynamics, and genetic algorithms. Their research covers liquid-solid
  interfaces, defect migration in fusion metals, ceramic interfaces, network
  glasses, amorphous solar cell materials, and supercooled liquid water.
