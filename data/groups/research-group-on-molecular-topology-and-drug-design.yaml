description: The Research Group on Molecular Topology and Drug Design (UDF-TM)
  focuses on the design of new chemical compounds, especially drugs, using
  topological descriptors and molecular topology. They use topological indices
  in reverse to generate new molecules with desired properties, working on
  analgesics, antibacterials, antivirals, antineoplastics, anti-Alzheimer's
  drugs, and green chemistry, with over 100 published articles.
