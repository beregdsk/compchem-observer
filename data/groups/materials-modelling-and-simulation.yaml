description: The group develops fundamental relationships between atomic
  structure and properties of molecules and materials to design advanced
  materials. Their research simulates materials for biomedical and industrial
  applications, focusing on nanoparticle interactions with biological
  environments. They use electronic structure calculations, molecular mechanics,
  dynamics, and Monte Carlo methods to study soft and solid state matter.
