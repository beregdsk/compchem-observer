description: The Quantum Optics and Quantum Metrology research group, led by
  Klemens Hammerer at the Department of Theoretical Physics, University of
  Innsbruck, focuses on theoretical quantum optics, quantum metrology, and
  precision measurement. The group investigates quantum systems such as trapped
  ions, Bose-Einstein condensates, and light-matter interfaces to advance
  quantum technologies and explore quantum dynamics.
