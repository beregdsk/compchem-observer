description: The Nanophotonic Resonator Quantum Electrodynamics Research Team at
  RIKEN's Quantum Computing Research Center conducts experimental research on
  cavity quantum electrodynamics (QED) using advanced nanophotonic devices. Led
  by Team Director Takao Aoki, the team develops novel nanophotonic devices,
  such as nanofiber cavities, to build hybrid atom-cavity systems for quantum
  information processing and scalable quantum technologies.
