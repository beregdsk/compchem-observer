description: The Quan2m group at Institut Néel explores quantum states in
  two-dimensional materials like graphene and transition metal dichalcogenides.
  Their research focuses on tuning electronic, phononic, and magnonic
  excitations through electromagnetic fields, mechanical deformation, and
  proximity effects. Key research areas include quantum optoelectronics, quantum
  engineering (such as superconducting qubits), optothermics, and 2D ordering
  phenomena, utilizing low-temperature magnetotransport, optical spectroscopy,
  and custom 2D material fabrication platforms.
