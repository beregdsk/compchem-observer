description: The Computational Condensed Matter Theory group led by Prof. Dr.
  Tim Wehling at the I. Institute of Theoretical Physics, University of Hamburg,
  focuses on the theoretical study of electron and nuclear dynamics in condensed
  matter. They develop ab-initio and many-body methods to understand and predict
  quantum mechanical correlation effects, such as metal-insulator transitions,
  superconductivity, and exotic quantum states in complex materials.
