description: The Computational Physics Machine Learning Team at the RIKEN Center
  for Advanced Intelligence Project, led by Director Takaharu Yaguchi,
  specializes in scientific machine learning and physics-informed neural
  networks. The team develops methods that respect physical laws, such as energy
  conservation, to enable reliable simulations of complex physical phenomena and
  accelerate physical modeling through operator learning and theoretical
  analysis.
