description: The Emergent Soft Matter Function Research Group, led by Group
  Director Takuzo Aida at the RIKEN Center for Emergent Matter Science, focuses
  on establishing novel principles in material science to address environmental
  and energy issues. The group develops unprecedented functional materials with
  precisely controlled structures from the molecular to macroscopic levels,
  including water photolysis catalysts, organic ferroelectrics, and graphitic
  soft materials like graphene, studying their optical, electrical, and
  morphological properties.
