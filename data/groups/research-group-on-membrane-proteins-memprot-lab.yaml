description: The Research Group on Membrane Proteins (MemProt Lab) explores the
  mechanistic principles of membrane protein insertion, folding, assembly, and
  stability in lipid membranes. Focusing on transmembrane segments,
  protein-protein interactions, and viral membrane proteins, the group combines
  experimental and computational approaches to understand these biological
  processes.
