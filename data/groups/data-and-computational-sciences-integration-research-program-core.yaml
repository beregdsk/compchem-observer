description: The Data and Computational Sciences Integration Research Program
  (CoRe) at RIKEN focuses on constructing a quantum-supercomputer hybrid
  platform, developing high-quality data storage and use environments, and
  creating advanced simulation and prediction algorithms. By integrating data
  and computational science, the program aims to expand computationally viable
  regions and pioneer predictive control science, applying these innovations to
  physics, chemistry, and life sciences to address global challenges.
