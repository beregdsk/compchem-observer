description: The Zeng Group at York University, led by Tao Zeng, focuses on
  using theoretical and computational chemistry tools to investigate interesting
  chemical problems. Research interests include vibronic interactions,
  relativistic effects, microscopic superfluidity, excited state chemistry,
  organic electronics, and radical chemistry.
