description: The Laboratory for Physicochemistry of Materials „Szoszlab” is a
  research group at the Faculty of Chemistry, University of Warsaw, led by
  Professor Robert Szoszkiewicz. The group focuses on the physico-chemical
  properties of engineering surfaces and single-molecule biophysics of proteins
  and peptides, particularly studying the oxidation of 2D materials and
  nanomechanical properties of biological molecules using techniques like AFM,
  SEM, Raman, XPS, Auger, XANES, and EDS spectroscopy.
