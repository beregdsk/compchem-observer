description: The Molecular Modeling and Drug Discovery Lab, led by Marco De Vivo
  at the Istituto Italiano di Tecnologia in Genova, Italy, focuses on molecular
  modeling of enzymes, proteins, and nanoparticles for drug discovery. The group
  integrates computational and medicinal chemistry to design, synthesize, and
  test novel compounds, with a strong focus on enzymatic catalysis and
  structure-based drug design.
