description: The Theoretical Chemistry and Molecular Thermodynamics axis at ENS
  de Lyon is a computational team of 10 permanent staff and approximately 20 PhD
  students and postdocs, coordinated by Tangui Le Bahers and Stephan Steinmann.
  It models the reactivity, spectroscopy and thermodynamics of liquids,
  interfaces, biomolecules and materials using DFT and molecular dynamics,
  develops reactive and polarizable force fields and free energy techniques, and
  covers reactive interfaces, photo-induced phenomena, structural biology and
  thermodynamics of liquids.
