description: The group develops and applies computational techniques—ab initio
  (DFT, GW) and semi-empirical (AEPs) coupled to quantum-chemistry methods like
  screened CI—to study quantum mechanical and optical properties of nanoscopic
  systems, from colloidal semiconductor quantum dots to epitaxial ones.
  Many-body wave-function calculations yield accurate optical properties
  relevant to quantum information science and solid-state quantum optics.
