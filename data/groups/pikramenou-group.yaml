description: The Pikramenou Group is a supramolecular photochemistry research
  group based at the University of Birmingham. Their research focuses on
  photochemical processes incorporating nanoscale structures, with projects
  spanning biomedical imaging, supramolecular systems for light conversion
  devices, and chemical biology. Key areas include luminescent nanoparticles as
  flow trackers, nanowire-based supramolecular assemblies, inorganic dyes for
  solar cells, luminescent sensors, DNA recognition by luminescent metal
  complexes, and ligand design for luminescent and MRI-active lanthanide
