description: The Houk Group solves problems in organic and bio-organic chemistry
  using theoretical and computational methods and programs. Theoretical
  predictions and designs of new reactions, reagents, and catalysts are tested
  experimentally in the Houk lab or with collaborators. The group is currently
  heavily involved in the study of dynamics of chemical reactions and the
  motions and properties of nanomachines.
