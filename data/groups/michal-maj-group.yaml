description: The Michal Maj group, based at the Department of Chemistry -
  Ångström Laboratory at Uppsala University, specializes in ultrafast
  multidimensional laser spectroscopy and structural biology techniques like
  cryo-EM to explore fundamental chemical and biophysical questions. Their
  research encompasses topics such as protein misfolding, plant photoreceptor
  signaling, and the photophysics and photochemistry of prebiotic molecules,
  utilizing both experimental and computational methods.
