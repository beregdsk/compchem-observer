description: AlphaVar is a research group led by Dr. Vera Schäfer at the Max
  Planck Institute for Nuclear Physics in Heidelberg, Germany. The group focuses
  on precision spectroscopy of highly charged ions using quantum logic
  techniques to test fundamental physics, search for new physics beyond the
  Standard Model, and investigate the constancy of fundamental constants.
