description: The Research Group on Switchable Molecular Materials (SMolMat)
  focuses on the synthesis, characterization, and processing of molecular
  materials that switch electronic states under external stimuli. They aim to
  develop functional molecular switches, sensors, memories, and optoelectronic
  devices, with research lines in spin crossover, luminescent materials, and
  porous coordination polymers.
