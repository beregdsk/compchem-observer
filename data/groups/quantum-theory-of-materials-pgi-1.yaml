description: The Quantum Theory of Materials (PGI-1) division at the Peter
  Grünberg Institute, Forschungszentrum Jülich, focuses on calculating and
  analyzing structural, electronic, magnetic, and transport properties of
  quantum materials. Their work targets fundamental research and applications in
  materials for information processing, developing theoretical concepts and
  advanced scientific software for exascale computing.
