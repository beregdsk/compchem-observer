description: The Discrete Event Simulation Research Team at RIKEN Center for
  Computational Science, led by Nobuyasu Ito, focuses on statistical and
  computational physics. The team tackles the 'Neo-Avogadro Challenge' using
  supercomputers for microscopic simulations of macroscopic phenomena, such as
  social systems, traffic, and disaster evacuation. They develop simulation
  management software like OACIS to run massive numbers of simulations on
  large-scale parallel systems.
