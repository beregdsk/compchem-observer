description: The Quantum Molecular Science Research Team at the RIKEN Center for
  Computational Science (R-CCS), led by Takahito Nakajima, focuses on developing
  next-generation theoretical molecular science to predict and clarify chemical
  reactions, properties, and functions of complex molecular systems, such as
  energy and biological molecules. The team develops the highly parallel quantum
  chemistry software NTChem to leverage supercomputing resources like Fugaku,
  and applies high-throughput simulations and materials informatics to design
  novel energy materials.
