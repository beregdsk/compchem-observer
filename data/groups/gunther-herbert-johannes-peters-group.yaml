description: The Günther Herbert Johannes Peters Group, also known as the
  Chemistry at the Interface to Biology Group, is a research group at the
  Technical University of Denmark (DTU). The group focuses on protein
  structure-function relationships, employing molecular dynamics simulations and
  experimental techniques to study membrane interactions, enzyme behavior,
  protein structure prediction, and drug design and delivery.
