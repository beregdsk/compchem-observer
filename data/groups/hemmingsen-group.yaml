description: The Hemmingsen Group, led by Associate Professor Lars Hemmingsen at
  the Department of Chemistry, University of Copenhagen, focuses on bioinorganic
  chemistry and PAC spectroscopy. The research aims to elucidate the role of
  metal ions in biological systems, such as enzyme-catalyzed reactions, protein
  aggregation in Alzheimer's disease, bacterial enzymes in antibiotic
  resistance, and biosensors, utilizing spectroscopic techniques, PAC, beta-NMR
  spectroscopy, and quantum chemical calculations.
