description: The SoftSimu group, led by Dr. Mikko Karttunen, focuses on
  biological and soft matter at the interface of materials science, biology, and
  biomedical sciences. They study lipid diffusion, membrane proteins, and DNA
  translocation using large-scale high-performance computer simulations,
  analytical studies, and machine learning methods.
