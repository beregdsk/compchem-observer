description: The Research Group on Photochemistry Reactivity (GRFQ), part of the
  Institute of Molecular Science at the University of Valencia, specializes in
  the design, synthesis, and study of photophysical and photochemical properties
  of molecular and supramolecular materials. Their research covers light-induced
  energy and electron transfer, photocatalysis, and photoactive nanosystems like
  semiconductor, metallic, up-conversion, and perovskite nanoparticles for
  sensors, bioimaging, and optoelectronics.
