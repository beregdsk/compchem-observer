description: Theoretical Nanoelectronics (PGI-2) is a theoretical research
  institute at the Peter Grünberg Institute within Forschungszentrum Jülich,
  under the directorship of Prof. Dr. Markus Müller. It investigates the quantum
  mechanical behaviour of electronic devices using many-body physics, quantum
  statistics, and topology to advance quantum technologies, strongly correlated
  systems, and spintronics.
