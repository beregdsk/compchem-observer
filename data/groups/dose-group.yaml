description: The Dose Group at the University of Sydney, led by Dr. Wesley Dose,
  focuses on materials chemistry and electrochemistry for electrochemical energy
  storage. Their research explores emerging materials for lithium-ion,
  sodium-ion, and beyond-lithium-ion batteries, investigating structure-property
  relationships, interfacial reactivity, and degradation pathways using advanced
  characterization techniques to develop sustainable, low-cost, and high-energy
  battery solutions.
