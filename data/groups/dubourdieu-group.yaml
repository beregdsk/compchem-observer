description: The Dubourdieu Group is a research group led by Prof. Dr. Catherine
  Dubourdieu at the Institute of Chemistry and Biochemistry, Freie Universität
  Berlin. The group specializes in physical and theoretical chemistry, focusing
  on the development and application of quantum chemical methods, density
  functional theory (DFT), and electronic structure calculations to study
  complex molecular systems, materials, and interfaces.
