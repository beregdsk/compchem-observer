description: The RIKEN ECL Research Team / RIKEN ECL Research Unit is a
  theoretical physics research group led by Unit Leader Kantaro Ohmori. The
  group studies quantum field theory, category theory, higher algebra,
  generalized symmetries, topological phases, tensor networks, and lattice
  models to translate macroscopic behaviors of matter into microscopic quantum
  models, aiming to guide the design and simulation of quantum systems.
