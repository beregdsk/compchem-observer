description: The Laboratory of Synthesis of New Ionic Materials, led by Dr. hab.
  Tomasz Jaroń, focuses on the synthesis and characterization of weakly
  coordinating anions and their alkali and alkaline earth metal salts for
  solid-state ionic conductors and battery applications. The group investigates
  hydrogen-rich compounds, fullerides, and superconductors, utilizing
  experimental techniques like NMR, XPS, and diffraction, complemented by
  solid-state DFT calculations.
