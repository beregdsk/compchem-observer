description: This page represents the Quantum Computing for Quantum Chemistry
  (QCQC) Discussion Group, part of the Thom Group at the University of
  Cambridge. It is an informal forum for discussing quantum computing
  applications in quantum chemistry, hosting fortnightly hybrid talks, sharing
  recordings, and listing contacts and schedules for members and external
  researchers.
