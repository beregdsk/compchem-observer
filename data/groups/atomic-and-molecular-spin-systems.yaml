description: The Atomic and Molecular Spin Systems group, led by Prof. Dr.
  Markus Ternes at the Peter Grünberg Institute, uses state-of-the-art scanning
  probe microscopes to investigate quantum spins in atomic and molecular
  systems. Their research focuses on designing quantum systems, exploring highly
  correlated states, studying emergent properties in 2D van der Waals
  heterostructures, and developing simulation tools for quantum technologies.
