description: The Matyjaszewski Polymer Group at Carnegie Mellon University, led
  by Professor Krzysztof Matyjaszewski, is renowned for developing and advancing
  Atom Transfer Radical Polymerization (ATRP). The group focuses on synthesizing
  well-defined functional polymers with controlled topologies for applications
  in energy, medicine, and advanced materials.
