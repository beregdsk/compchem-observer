description: The Houk Research Group, led by Professor Kendall N. Houk at the
  University of California, Los Angeles (UCLA), conducts theoretical and
  computational research in organic and bio-organic chemistry. The group focuses
  on predicting and designing new reactions, reagents, and catalysts, with a
  strong emphasis on enzyme mechanisms, pericyclic reactions, molecular
  dynamics, and the design of nanomachines.
