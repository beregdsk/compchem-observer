description: The Non-Equilibrium Soft Matter group of Liesbeth Janssen at
  Eindhoven University of Technology focuses on the behavior of materials that
  are inherently out of thermodynamic equilibrium, ranging from glasses and gels
  to active and living matter. Using theory, computer simulations, and
  machine-learning methods, they study the structural, dynamical, and mechanical
  properties of such materials.
