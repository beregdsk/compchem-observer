description: The RIKEN ECL Research Team, led by Team Leader Shuntaro Tani,
  focuses on the Digital Twin for Light-Matter Interaction. Their research
  involves using strong laser fields to control material states and
  understanding irreversible processes like laser ablation. They aim to automate
  experiments, extract microscopic processes from photoexcitation, and use deep
  learning to build predictive simulators and digital twins for optimizing laser
  processing.
