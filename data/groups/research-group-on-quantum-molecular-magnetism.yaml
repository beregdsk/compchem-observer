description: The Research Group on Quantum Molecular Magnetism (QMM) at the
  University of Valencia conducts experimental and theoretical research on
  molecular magnetism, focusing on the design of single-molecule magnets and
  molecular spin qubits for quantum computing and spintronics. Their work
  encompasses the modeling of exchange interactions in complex magnetic
  clusters, the physical characterization of molecular materials through
  spectroscopy and diffraction, and the development of computational software
  for simulating magnetic properties.
