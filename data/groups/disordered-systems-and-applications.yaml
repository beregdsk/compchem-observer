description: The 'Disordered systems and applications' is a theoretical physics
  research group within the Statistical Physics section of the Laboratoire de
  Physique de l’École normale supérieure, Sorbonne University. Led by Giulio
  Biroli, the group focuses on the statistical physics of disordered and glassy
  systems, random geometries, and quantum many-body systems, exploring phase
  transitions, transport, and quantum correlations.
