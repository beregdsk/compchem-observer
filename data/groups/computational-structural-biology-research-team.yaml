topics:
  - biomolecular-simulation
  - molecular-dynamics
  - software-hpc
description: The team develops computational methods to obtain atomic-level
  descriptions of functional states of biological complexes, integrating
  experimental data from X-ray crystallography, cryo-EM, small-angle X-ray
  scattering, fluorescence resonance energy transfer, and XFEL with
  computational modeling through high-performance computing on supercomputers K
  and Fugaku. They also collaborate with experimental groups and the
  pharmaceutical industry to elucidate functional mechanisms of biological
  systems.
