description: The Theoretical Chemistry group at Hokkaido University, led by
  Prof. Satoshi Maeda, develops and applies automated reaction path search
  methods based on quantum chemical calculations to predict complex reaction
  mechanisms. The group also focuses on materials informatics and data-driven
  design of catalysts and functional materials, integrating machine learning,
  high-throughput calculations, and data science.
