description: The group focuses on the dynamics of correlated quantum matter,
  exploring universal behaviors and phases in out-of-equilibrium quantum
  many-body systems using analytical methods and machine learning like neural
  quantum states. They also investigate strongly correlated light-matter
  systems, collective phenomena in quantum open systems, and quantum materials
  under strong light-matter coupling, employing tailored field-theoretical
  approaches that merge condensed matter and quantum optics methods.
