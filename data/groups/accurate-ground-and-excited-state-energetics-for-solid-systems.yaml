description: This page describes the research group or topic 'Accurate Ground
  and Excited State Energetics for Solid Systems' at the Max Planck Institute
  for Coal Research, under the Molecular Theory and Spectroscopy department. The
  group focuses on developing and applying accurate wavefunction-based ab initio
  methods, such as DLPNO-CCSD(T) and bt-PNO-STEOM-CCSD, to study surface
  adsorption energetics, band gaps of semiconductors, and excited states in
  solid-state catalytic systems.
