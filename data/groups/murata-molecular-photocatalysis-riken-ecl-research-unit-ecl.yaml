description: The Murata Molecular Photocatalysis RIKEN ECL Research Unit, led by
  Kei Murata, develops novel molecular transformation reactions driven by
  visible and near-infrared light using transition metal catalysts. Focusing on
  the phototransformation of small molecules like CO2 and photo-uncaging of
  bioactive substances, the unit integrates organometallic chemistry,
  photochemistry, and biochemistry to address environmental and medical
  challenges.
