description: The RIKEN Center for Interdisciplinary Theoretical and Mathematical
  Sciences (iTHEMS) is a research institute within RIKEN that promotes
  interdisciplinary theoretical and mathematical sciences. It leverages
  mathematical approaches, computational science, and theoretical physics to
  address global challenges and drive innovation. The center hosts various
  divisions and teams focusing on AI, quantum science, genomics, and social
  sciences, fostering collaboration among diverse researchers worldwide.
