description: The Chemical Reactivity, Catalysis, and Molecular Modeling group at
  the University of Amsterdam focuses on applying advanced molecular simulation
  techniques to understand and predict the properties of complex chemical
  systems and nano-sized materials. Their research spans catalysis, soft matter,
  and biomolecular systems, utilizing computational methods and machine
  learning.
