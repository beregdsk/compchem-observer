description: The page presents a computational research project investigating
  the molecular mechanisms of the selective antifungal action of amphotericin B.
  It focuses on the drug's interaction with lipid bilayers, sterol-dependent
  channel formation, and the molecular differences between fungal ergosterol and
  mammalian cholesterol. The research aims to provide a foundation for the
  rational design of safer, highly selective antifungal derivatives.
