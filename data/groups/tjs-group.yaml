description: The TJS Group at the University of Copenhagen, led by Thomas Just
  Sørensen, focuses on fluorescent dyes, optical sensors, and lanthanide
  coordination chemistry. The group investigates light-matter interactions at
  the molecular level, solution structures of lanthanide complexes, and develops
  responsive contrast agents and optical sensors. Their research spans synthetic
  chemistry, photophysical studies, polymer and material science, and software
  development.
