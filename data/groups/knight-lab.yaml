description: The Knight lab, led by Stefan Knight at Uppsala University, studies
  how proteins and peptides bind to form fibrillar structures like spider silk,
  bacterial fimbriae, and amyloid. Using X-ray crystallography, molecular
  biology, and computational techniques, the research aims to develop novel
  therapies for amyloid diseases and infections, as well as biomaterials.
