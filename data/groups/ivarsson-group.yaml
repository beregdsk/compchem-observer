description: The Ivarsson Group at Uppsala University's Department of Chemistry
  for Life Sciences, led by Ylva Ivarsson, investigates molecular interactions
  in cell function and dysfunction, focusing on linear motifs and peptide
  binding domains. The group aims to advance the understanding of human
  protein-protein interaction networks in health and disease by combining
  biochemical, biophysical, bioinformatic, and cell-based approaches.
