description: The research group of Tatiana Korona at the Faculty of Chemistry,
  University of Warsaw, specializes in computational quantum chemistry. Their
  research focuses on developing methods for molecular properties of large
  molecules, investigating electronic excited states, topological analysis of
  electron densities, and modeling intermolecular interactions using
  symmetry-adapted perturbation theory.
