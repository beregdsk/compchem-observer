description: The official homepage of the Research Group Herrmann at the
  Institute of Inorganic and Applied Chemistry, University of Hamburg. Led by
  Prof. Dr. Carmen Herrmann, the group focuses on the first-principles theory of
  molecular and nanoscale spintronics, exploring magnetoresistance, spin-orbit
  effects, and electronic communication using DFT, electronic structure methods,
  and software development.
