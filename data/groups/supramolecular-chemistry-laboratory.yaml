description: 'The Supramolecular Chemistry Laboratory at the Faculty of
  Chemistry, University of Warsaw, is a PI-led research group focusing on
  supramolecular chemistry. Its core expertise is organic synthesis applied to
  two main areas: developing functional materials based on Metal-Organic
  Frameworks (MOFs) for catalysis and gas storage, and synthesizing molecular
  receptors for anions for sensing and transport across biological membranes.'
