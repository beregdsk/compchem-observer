description: The Innovative Molecular Function Research Group, led by Group
  Director Kazuo Takimiya at RIKEN's Center for Emergent Matter Science,
  specializes in the synthesis and molecular design of high-performance organic
  semiconductor materials. Their research focuses on developing functional
  organic electronic materials for applications in transistors, solar cells, and
  thermoelectric devices, utilizing crystal structure control and simulation to
  enhance carrier mobility and device efficiency.
