description: The Soft Matter Properties Research Team studies the mesoscopic
  structural diversity of soft matter, including polymers and liquid crystals,
  to elucidate their physical properties and mechanisms. Their research focuses
  on applying these properties to optical and electronic devices and functional
  materials, exploring novel ferroelectric liquid crystals, self-organized
  chirality, and physical mechanisms in electronic devices using liquid
  crystals.
