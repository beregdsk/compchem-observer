description: The Low-Dimensional Quantum Phases Research Unit at the RIKEN
  Center for Emergent Matter Science, led by Takuro Sato, focuses on
  low-dimensional systems like organic conductors and two-dimensional materials.
  The unit investigates quantum phases driven by strong electronic correlations,
  develops novel devices with strategic symmetries, and explores emergent
  quantum phases, symmetry breaking, and nonlinear responses in low-dimensional
  environments.
