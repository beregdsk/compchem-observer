description: The research group of Prof. Dr. Marcella Iannuzzi at the Department
  of Chemistry, University of Zurich, focuses on computational and theoretical
  chemistry. The group conducts research in advanced simulation methods,
  including density functional theory (DFT) and molecular dynamics, and is
  heavily involved in the development of high-performance computational software
  like CP2K to study molecular systems and materials.
