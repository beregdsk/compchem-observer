description: The Mechanism and Simulation Group (MSG) is a computational
  chemistry research group based in the School of Chemistry at the University of
  New South Wales, Sydney. Their research focuses on the development and
  application of computational methods to predict molecular properties, chemical
  reaction mechanisms, and understand structure-activity relationships, which is
  crucial for the rational design of improved chemical reagents, materials, and
  drug molecules.
