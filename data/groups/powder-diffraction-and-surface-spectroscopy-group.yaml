description: The Powder Diffraction and Surface Spectroscopy research group led
  by Prof. Dr. Claudia Weidenthaler at the Max Planck Institute for Coal
  Research investigates inorganic functional materials for catalysis and energy
  storage. The group specializes in crystallographic and spectroscopic methods,
  including powder X-ray diffraction, X-ray photoelectron spectroscopy (XPS),
  and Raman spectroscopy, to study structure-property relationships and local
  structures of amorphous or disordered materials under in situ and operando
  conditions.
