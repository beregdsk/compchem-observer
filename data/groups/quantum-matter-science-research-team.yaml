description: The Quantum Matter Science Research Team at the RIKEN Center for
  Computational Science (R-CCS), led by Team Principal Seiji Yunoki, focuses on
  the development of numerical calculation methods for strongly correlated
  quantum systems, such as quantum Monte Carlo, density matrix renormalization
  group, and tensor network methods. The team also researches quantum computing
  algorithms and quantum simulations on large-scale supercomputers like Fugaku
  to explore new computational paradigms and investigate fundamental quantum
  phenomena in condensed matter physics and materials science.
