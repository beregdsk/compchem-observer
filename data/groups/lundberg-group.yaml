description: The Lundberg group at Uppsala University, led by Marcus Lundberg,
  specializes in computational modeling of transition-metal catalysts and
  enzymatic reactions for solar fuel generation. Their research focuses on
  electronic structure theory and simulating X-ray spectroscopy to guide the
  development of renewable energy catalysts.
