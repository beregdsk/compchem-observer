description: The Varghese group at the Department of Chemistry - Ångström
  Laboratory, Uppsala University, focuses on bioorthogonal chemistry for
  designing 3D scaffolds and smart hydrogels that mimic the extracellular matrix
  (ECM). Their research aims to perform organic reactions in living systems
  without toxic catalysts, modulating pKa of reactive groups to create stable
  covalent networks for tissue engineering and regenerative medicine.
