description: The Walla Group at the Institute of Physical and Theoretical
  Chemistry, TU Braunschweig, focuses on modern biophysical chemistry,
  particularly biomolecular and biomimetic processes. The group's expertise lies
  in single-molecule microscopy and ultrafast spectroscopy, working on
  biomimetic light-harvesting systems and efficient luminescent solar
  concentrators.
