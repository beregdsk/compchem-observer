description: The Biocomputing Group at the University of Calgary, led by Peter
  Tieleman, uses computer simulations to study biological problems. The group
  develops computational models of lipids and membrane proteins to investigate
  their structure, dynamics, and interactions, employing molecular dynamics
  simulations and the coarse-grained Martini force field. It is part of the
  Centre for Molecular Simulation and focuses on membrane biophysics.
