description: The Ravnsbæk Group, led by Professor Dorthe B. Ravnsbæk at Aarhus
  University and the University of Southern Denmark, focuses on inorganic
  materials for energy storage and conversion, particularly rechargeable battery
  materials. Their research spans material design, synthesis, structural
  characterization, and battery performance testing, targeting order-disorder
  phenomena, amorphous electrodes, and novel cathode and anode materials.
