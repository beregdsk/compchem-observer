description: The Emergent Functional Polymers Research Team at the RIKEN Center
  for Emergent Matter Science, led by Director Keisuke Tajima, focuses on the
  development of organic semiconducting polymer materials and their application
  to organic electronic devices. The team works on molecular- and nano-scale
  structural control to enhance device performance, targeting organic solar
  cells, field-effect transistors, and novel organic electronic devices.
