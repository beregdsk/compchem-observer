description: The team pursues novel development of theory, algorithms, and
  software for theoretical and computational molecular science via collaborative
  use of the Fugaku supercomputer. Its goals are to innovate next-generation
  molecular theory to handle large, complex molecules with high accuracy; to
  develop the NTChem high-performance quantum chemistry software package for
  general-purpose molecular electronic-structure calculations, including excited
  states; and to establish materials informatics through high-throughput
  simulations on massively parallel supercomputers.
