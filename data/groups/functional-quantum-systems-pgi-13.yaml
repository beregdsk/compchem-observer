description: The Functional Quantum Systems (PGI-13) group, led by Director Rami
  Barends at the Peter Grünberg Institute, Forschungszentrum Jülich, focuses on
  laying the scientific and technological foundations for useful quantum
  computing. They work on superconducting qubits, quantum devices, gates, and
  algorithm implementations at the intersection of scientific exploration and
  engineering.
