description: The Topological Materials Design Research Unit at RIKEN, led by
  Motoaki Hirayama, explores novel materials and properties using
  first-principles calculations. Focusing on topological electronic band
  structures, superconducting states, and Majorana fermions, the unit develops
  ab initio methods for theoretical materials design across various fields.
