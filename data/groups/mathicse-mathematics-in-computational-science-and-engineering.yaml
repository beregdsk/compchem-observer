description: MATHICSE (Mathematics in Computational Science and Engineering) is
  a research group at EPFL dedicated to promoting high-level research and
  education in mathematical and numerical modeling, algorithmic development, and
  simulation. It coordinates multiple chairs focusing on high-performance
  computing, materials modeling, and uncertainty quantification, applying these
  methods across science and engineering.
