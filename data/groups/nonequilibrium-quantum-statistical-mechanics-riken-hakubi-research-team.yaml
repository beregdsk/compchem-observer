description: The Nonequilibrium Quantum Statistical Mechanics RIKEN Hakubi
  Research Team, led by Ryusuke Hamazaki, studies the bridge between macroscopic
  nonequilibrium phenomena and microscopic quantum mechanics. They investigate
  thermalization, quantum dynamics, and nonequilibrium processes in isolated or
  dissipative quantum many-body systems, aiming to apply these insights to
  condensed matter physics, information theory, and biology.
