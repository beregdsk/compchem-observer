description: The Superconducting Quantum Computing System Research Unit at
  RIKEN's Quantum Computing Research Center, led by Yutaka Tabuchi, focuses on
  the practical realization of superconducting quantum computers. The unit works
  on the integration of superconducting quantum circuits, 3D integration via
  wafer bonding, system-level design of superconducting quantum circuits,
  computer architecture analysis to overcome performance bottlenecks, and
  enhancing the scalability and overall performance of quantum devices.
