description: The Elf lab, led by Johan Elf at the Department of Cell and
  Molecular Biology, Uppsala University, is a research group working at the
  intersection of physics, biology, and technology. They address fundamental
  questions in bacterial physiology, focusing on single-molecule tracking,
  optical pooled screening, and rapid antibiotic susceptibility testing. Their
  computational work includes developing algorithms and software for simulating
  stochastic chemistry and molecular dynamics, particularly for biomolecular
  simulations of transcription factor-DNA recognition and search kinetics.
