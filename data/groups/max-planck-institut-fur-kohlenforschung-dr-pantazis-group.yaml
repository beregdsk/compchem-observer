description: This page lists the projects and funding of the research group of
  Dr. Dimitrios Pantazis at the Max-Planck-Institut für Kohlenforschung. The
  group's research focuses on computational and theoretical chemistry,
  particularly the development and application of multireference methods,
  coupled-cluster theory, and spectroscopic techniques (such as EPR) to study
  bioinorganic systems, copper complexes, and manganese water-splitting
  catalysts. The projects are funded by organizations like the DAAD, ANR, BmBF,
  and DFG, involving collaborations with international partners.
