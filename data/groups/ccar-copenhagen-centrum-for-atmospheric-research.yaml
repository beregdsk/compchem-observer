description: CCAR is a research group at the Department of Chemistry, University
  of Copenhagen, led by Professor Ole John Nielsen. The group investigates
  atmospheric chemical and physical processes to quantify environmental impact
  and develop climate-friendly solutions, combining quantum mechanical
  computations with laboratory and field measurements. It has patented a
  photochemical air purification process and operates the Atmospheric Infuser
  Research laboratory.
