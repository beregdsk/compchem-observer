description: The MAC (Materials Chemistry) research team, led by Prof. Martin
  Pumera at the University of West Bohemia in Pilsen, focuses on the fundamental
  properties of active and smart materials. Their key research areas include
  flexible wearable electronics, 3D printing of catalytic systems,
  electrochemistry of nanomaterials for energy storage, and nanomedicine for
  targeted drug delivery.
