description: A research team at RIKEN led by Shuntaro Tani, focusing on the
  control of material states using intense photoelectric fields and laser
  excitation. The team develops digital twin technologies and automated
  experimental platforms combined with deep learning to model and optimize
  irreversible processes such as ultrafast laser ablation and precision
  drilling.
