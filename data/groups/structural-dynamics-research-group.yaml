description: The Structural Dynamics Research Group at the Faculty of Chemistry,
  University of Warsaw, led by Katarzyna N. Jarzembska, focuses on the
  experimental and computational study of solid-state photoactive materials,
  including organic compounds and transition metal complexes. The group
  investigates light-matter interactions, excited and metastable states, and
  material properties under varying temperature and pressure conditions. They
