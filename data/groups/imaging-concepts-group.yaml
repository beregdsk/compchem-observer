description: The Imaging Concepts Group at the University of Glasgow conducts
  leading research into advanced optical sensing and imaging techniques. Their
  work spans from fundamental imaging science to applications in microscopy,
  biomedical imaging (such as retinal oximetry and in vivo cardiovascular
  imaging in zebrafish), remote sensing, and surveillance, utilizing
  state-of-the-art optical equipment.
