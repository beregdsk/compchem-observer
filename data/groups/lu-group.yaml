topics:
  - catalysis
description: The Lu group creates and studies metal-metal bonding between two
  first-row transition metals and between a transition metal and a main group
  metal. Synergistic combinations of different metals can generate hybrid
  "metals" that exhibit original properties and/or unique reactivities. We are
  broadly interested in developing these bimetallic complexes for small-molecule
  catalysis (e.g., dinitrogen to amine), where using non-precious metals is
  sensible from economical and sustainability standpoints.
