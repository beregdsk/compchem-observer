description: The Computational Quantum Matter Research Team at the RIKEN Center
  for Emergent Matter Science, led by Director Seiji Yunoki, investigates
  emergent quantum phenomena in solid-state materials. By employing
  state-of-the-art numerical simulations such as the density matrix
  renormalization group and variational Monte Carlo, the team studies strongly
  correlated electron systems, transition metal oxides, and quantum dynamics to
  understand exotic phases like Mott insulators and superconductivity.
