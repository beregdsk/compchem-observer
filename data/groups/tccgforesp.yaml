description: The Theoretical/Computational Chemistry Group for ESP at UNIST
  develops novel methods to describe excited state phenomena of molecules and
  materials, applying them to design multi-functional futuristic devices. Their
  research covers nonadiabatic dynamics, machine learning for excited states,
  and software development for excited state molecular dynamics.
