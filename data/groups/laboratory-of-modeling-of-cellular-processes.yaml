description: The Laboratory of Modeling of Cellular Processes is a research
  group at the Faculty of Chemistry, University of Warsaw, led by Dr. Hab.
  Dorota Latek. The group focuses on computational drug design, cheminformatics,
  and machine learning to model protein targets, particularly G protein-coupled
  receptors (GPCRs). Their work spans molecular modeling, data sharing, and
  experimental validation for anti-inflammatory and anti-cancer therapies.
