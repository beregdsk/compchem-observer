description: The research group led by Prof. Dr. Michael Potthoff at the I.
  Institute of Theoretical Physics, University of Hamburg, focuses on the
  theoretical and computational study of strongly interacting quantum many-body
  systems. Their research covers collective magnetism, correlation-driven
  metal-insulator transitions, high-temperature superconductivity, quantum phase
  transitions, and non-equilibrium dynamics in low-dimensional systems using
  methods like mean-field theory, Monte Carlo, and density-matrix
  renormalization group.
