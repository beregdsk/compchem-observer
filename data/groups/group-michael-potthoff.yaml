description: The research group of Prof. Dr. Michael Potthoff at the I.
  Institute of Theoretical Physics, University of Hamburg, investigates the
  physical properties of strongly interacting quantum many-body fermion systems.
  Their research focuses on collective magnetism, correlation-driven
  metal-insulator transitions, high-temperature superconductivity, quantum phase
  transitions, and non-equilibrium real-time dynamics in low-dimensional systems
  and nanostructures.
