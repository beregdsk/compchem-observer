description: The Field Theory Research Team at RIKEN Center for Computational
  Science conducts theoretical and computational research in particle physics,
  focusing on lattice Quantum Chromodynamics (QCD) to explore the Standard Model
  and physics beyond it. The team develops high-performance computing
  algorithms, analysis methods, and codes for supercomputers like Fugaku to
  study particle systems under extreme conditions.
