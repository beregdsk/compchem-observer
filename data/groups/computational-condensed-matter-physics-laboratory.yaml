description: The Computational Condensed Matter Physics Laboratory is a
  theoretical research group at RIKEN, led by Chief Scientist Seiji Yunoki. The
  group focuses on understanding novel quantum phases and phenomena in
  materials, especially strongly correlated electron systems, using advanced
  numerical methods such as variational Monte Carlo and density matrix
  renormalization group.
