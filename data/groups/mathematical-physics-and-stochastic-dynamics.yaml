description: The Mathematical Physics and Stochastic Dynamics group, led by
  Aljaz Godec, develops and applies methods of mathematical physics and
  stochastic processes to study biophysical phenomena. Their primary focus is
  the non-equilibrium statistical mechanics of single molecules, including
  macromolecular conformation dynamics, spatial transport, binding, and
  reactions, using a mix of rigorous analysis and computer simulations.
