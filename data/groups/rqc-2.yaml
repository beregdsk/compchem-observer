description: The RIKEN RQC-Fujitsu Collaborative Center is a joint research
  center established in April 2021 between RIKEN and Fujitsu. It focuses on the
  research and development of superconducting quantum computers, integrating
  RIKEN's advanced superconducting circuit technology with Fujitsu's computing
  expertise. The center aims to develop large-scale hardware, software, and
  applications to realize fault-tolerant quantum computers and solve complex
  social issues.
