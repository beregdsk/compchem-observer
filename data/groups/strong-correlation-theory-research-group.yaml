description: The Strong Correlation Theory Research Group, led by Naoto Nagaosa,
  investigates strongly correlated electronic states in solids, focusing on
  topology and emergent functions. The group combines first-principles
  electronic structure calculations, quantum field theory, and numerical methods
  to predict magnetic, optical, transport and thermal properties. Research
  explores cross-correlation of spin, orbital and topological degrees of
  freedom, electron fractionalization, and non-dissipative quantum phenomena.
