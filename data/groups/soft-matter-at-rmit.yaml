description: The Soft Matter Group at RMIT University is a multidisciplinary
  research team spanning physics, chemistry, and biology. Focusing on the
  science of soft materials, the group's research projects include
  cryopreservation, next-generation antimicrobials, neoteric solvents, and
  complex colloids, bridging experimental and theoretical expertise.
