description: SCPN is a theoretical physics group at Charles Coulomb Laboratory,
  University of Montpellier, focusing on complex systems in biology,
  environmental sciences, and condensed matter. The team develops analytical and
  computational methods from statistical mechanics, stochastic processes,
  nonlinear physics, and fluid dynamics to study active and biological matter,
  collective phenomena, phase transitions, and transport. Research themes
  include intracellular organization, active matter and genome, nanofluidics,
  non-equilibrium systems, and interdisciplinary applications, in collaboration
