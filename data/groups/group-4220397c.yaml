description: The Quantum Information Physics Theory Research Team at RIKEN's
  Quantum Computer Research Center, directed by Franco Nori, focuses on
  interdisciplinary research at the intersection of nanoscience, quantum
  computing, quantum information, superconducting quantum circuits, quantum
  optics, and condensed matter physics. The team is globally recognized for
  developing the QuTiP software and utilizing AI and machine learning to tackle
  complex computational challenges, maintaining strong collaborative ties with
  leading technology corporations.
