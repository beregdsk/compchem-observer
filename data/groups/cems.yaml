description: The Center for Emergent Matter Science (CEMS) at RIKEN is a
  research institute exploring emergent properties and functions from the
  cooperative interactions of electrons and molecules. Focused on energy and
  environmental sustainability, it unites top researchers in physics, chemistry,
  and electronics. Research spans strongly correlated systems, quantum
  materials, topological electronics, soft matter, and molecular electronics,
  utilizing advanced computational, spectroscopic, and microscopic techniques.
