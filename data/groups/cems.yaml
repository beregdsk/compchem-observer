description: The Center for Emergent Matter Science (CEMS) at RIKEN is a
  research institute dedicated to exploring emergent phenomena arising from the
  collective behavior of electrons, molecules, and other components. It aims to
  contribute to sustainable energy solutions by developing efficient and
  low-impact technologies. The center fosters collaboration among leading
  researchers in physics, chemistry, and electronics, focusing on strongly
  correlated systems, quantum materials, soft matter, molecular electronics, and
  advanced spectroscopy.
