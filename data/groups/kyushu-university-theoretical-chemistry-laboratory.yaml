description: Theoretical Chemistry Laboratory at Kyushu University is a research
  group dedicated to advancing theoretical and computational chemistry. Their
  research focuses on developing high-precision quantum chemical methods,
  including electron correlation theories for excited states, relativistic
  molecular orbital theory, and ab initio dynamics for chemical reactions and
  proton transfer in solutions. They also work on biomolecular simulations and
  quantum computing algorithms for chemistry.
