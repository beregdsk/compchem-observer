description: The Quantum Computing Theory Research Team at RIKEN, led by
  Director Keisuke Fujii, conducts theoretical and applied research in quantum
  computing. The team focuses on quantum software foundation, quantum error
  correction, circuit optimization, and architecture for fault-tolerant quantum
  computers. They also explore applications of quantum computing in fundamental
  physics, quantum chemistry, and quantum machine learning.
