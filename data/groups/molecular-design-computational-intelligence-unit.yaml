description: The Molecular Design Computational Intelligence Unit develops novel
  hybrid computational methods that combine molecular simulation with artificial
  intelligence for rational drug design. Integrating AI with molecular
  simulation extends the applicability of in silico drug design in terms of both
  accuracy and efficiency, and the unit targets conventional small molecules as
  well as middle-sized and macro molecules.
