description: The Emergent Bioinspired Soft Matter Research Team, led by Yasuhiro
  Ishida, focuses on developing anisotropic, biomimetic soft materials, such as
  hydrogels, colloids, and polymer composites, through in-situ synthesis under
  external fields. Their research aims to create materials with autonomy and
  polarity, mimicking biological functions like muscles and nerves.
