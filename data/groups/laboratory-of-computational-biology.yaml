description: The Laboratory of Computational Biology (LCBio) is a research group
  at the Faculty of Chemistry, University of Warsaw, led by Professor Sebastian
  Kmiecik. The group develops and implements innovative computational methods
  for modeling and analyzing biomolecular structure and dynamics, creating
  flagship tools for peptide docking, protein flexibility, and aggregation
  prediction. They combine classical modeling with state-of-the-art deep
  learning to study protein complexes and design peptide-based therapeutics.
