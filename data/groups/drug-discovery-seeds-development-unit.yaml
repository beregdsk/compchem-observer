description: The Drug Discovery Seeds Development Unit at RIKEN Center for
  Sustainable Resource Science focuses on academic drug discovery by
  establishing high-throughput screening platforms using natural products and
  target-oriented libraries. The unit integrates computational chemistry,
  medicinal chemistry, experimental automation, and AI-driven screening
  technologies to explore and validate novel drug targets.
