description: Condensed Matter Physics of Energy Materials is a research
  programme at Uppsala University's Department of Physics and Astronomy. It
  focuses on fundamental and applied condensed matter physics to understand
  atomic-level functionality driving renewable energy solutions, utilizing
  advanced X-ray photon science and functional characterization tools. Research
  spans batteries, solar energy conversion, catalysis, quantum devices, and the
  development of X-ray methodologies.
