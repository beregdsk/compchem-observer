description: The Crispies Group, led by Dr. Ryan Crisp at the Department of
  Chemistry and Pharmacy of FAU, focuses on molecular materials for energy and
  sustainability. Their research encompasses nanomaterials for solar-to-X
  conversion, new optoelectronics with non-critical materials, and the
  photochemical degradation of PFAS.
