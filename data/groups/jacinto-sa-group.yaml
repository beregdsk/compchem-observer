description: The Sa group, led by Professor Jacinto Sá at Uppsala University's
  Department of Chemistry - Ångström Laboratory, conducts research on plasmonic
  nanosystems. The group investigates light-matter interactions, focusing on
  converting light into electrical charges and inducing near-field effects.
  Using advanced spectroscopic methods, they study artificial photosynthesis,
  photo-redox catalysis, and electrochemical CO2 reduction to develop
  sustainable chemical and energy solutions.
