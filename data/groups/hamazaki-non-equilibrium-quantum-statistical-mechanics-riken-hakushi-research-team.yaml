description: This is the official page of the Hamazaki Non-equilibrium Quantum
  Statistical Mechanics RIKEN Hakushi Research Team, led by Ryusuke Hamazaki at
  RIKEN in Wako, Japan. The team studies macroscopic non-equilibrium phenomena
  from microscopic quantum mechanics, focusing on quantum dynamics, statistical
  mechanics, and thermalization in isolated and open many-body quantum systems.
  They aim to contribute to condensed matter physics, biology, and information
  theory.
