description: The MacCallum Lab at the University of Calgary, part of the
  Department of Chemistry and the Centre for Molecular Simulation, focuses on
  protein structure and biomolecular recognition. The group uses computational
  modeling and biophysical experiments to study driving forces, determine
  structures, and design novel biomolecules.
