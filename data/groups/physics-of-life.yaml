description: The Physics of Life is a major research group at the University of
  York's School of Physics, Engineering and Technology. Established in 2015, the
  group investigates biological systems across multiple scales, from quantum
  biology and single molecules to cell populations. Their research encompasses
  theoretical soft-matter biological physics, molecular dynamics simulations,
  nano- and biomaterials, and single-molecule biophysics, bridging physical
  sciences and life sciences.
