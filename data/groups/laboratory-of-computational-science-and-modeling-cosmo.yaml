description: The Laboratory of Computational Science and Modeling (COSMO) at
  EPFL simulates matter at the atomic scale to predict and optimize the
  properties of materials and molecules. The lab develops advanced computer
  simulation methods combining statistical physics, quantum chemistry, materials
  engineering, and machine learning to address pressing societal issues, such as
  lightweight alloys and hydrogen-bonded pharmaceutical compounds.
