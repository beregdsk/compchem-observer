description: The Quantum Firmware and Control group at PGI-12 focuses on
  developing techniques to reduce errors in quantum computing systems,
  particularly quantum optimal control for high-fidelity gates in
  superconducting NISQ devices. They develop numerical tools for simulating,
  controlling, and characterizing quantum devices, and work on quantum error
  mitigation, error correction, and open quantum systems modeling.
