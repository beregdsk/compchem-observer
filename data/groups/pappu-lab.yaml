description: The Pappu Lab at Washington University in St. Louis, led by Rohit
  Pappu, investigates the physical principles of protein and nucleic acid
  organization within cells, focusing on macromolecular phase transitions and
  intrinsically disordered proteins (IDPs). Leveraging biophysical computations,
  statistical physics, and machine learning, their research addresses cancers
  and neurodegenerative diseases like ALS, while advancing synthetic biology,
  bioengineering, and materials science. The lab is part of the Center for
  Biomolecular Condensates at WashU.
