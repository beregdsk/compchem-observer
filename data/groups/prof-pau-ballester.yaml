description: The research group led by Prof. Pau Ballester at the Institut
  Català d'Investigació Química (ICIQ) focuses on engineering advanced
  supramolecular structures for applications in molecular sensing, catalysis,
  and transport. They apply molecular self-assembly to construct functional
  supramolecular aggregates and design molecular containers for physical organic
  chemistry and supramolecular catalysis.
