description: The Joint Lab Virtual Materials Design (JL-VMD) is a research group
  within the Quantum Theory of Materials (PGI-1) at the Peter Grünberg
  Institute, Forschungszentrum Jülich. It focuses on the development and
  validation of computational methods for material design, establishing a
  framework for high-throughput calculations, materials databases, and DFT-based
  electronic structure workflows. It collaborates internationally on HPC and
  materials informatics.
