description: The research group of Prof. Dr. Tobias Beck, based at the
  Department of Chemistry of the University of Hamburg, focuses on protein-based
  nanomaterials. The group uses protein containers to assemble inorganic
  nanoparticles into highly structured materials, employing computational
  protein design, protein production, nanoparticle synthesis, and
  crystallization-based assembly, with advanced characterization techniques.
