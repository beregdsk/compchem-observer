description: Quantum Matter Theory is a research programme and group at the
  Department of Physics and Astronomy, Uppsala University, led by Programme
  Professor Annica Black-Schaffer. The group focuses on condensed matter systems
  where quantum mechanical effects prominently determine material properties.
  Their research spans topological quantum matter, unconventional
  superconductivity, non-equilibrium physics, strongly correlated systems,
  ultracold atoms, and quantum information, utilizing low-energy models for
  quantum many-body systems.
