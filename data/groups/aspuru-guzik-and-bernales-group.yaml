description: The Aspuru-Guzik and Bernales Group at the University of Toronto is
  a theoretical and computational chemistry lab. They work at the interface of
  theoretical chemistry with physics, computer science, and applied mathematics,
  focusing on quantum computing, machine learning, and automation to accelerate
  the discovery of new chemicals and materials. Their research areas include
  quantum computing, energy and functional materials, AI for discovery and
  self-driving labs, electronic structure methods, and biophysics, molecular
  computers, and other topics.
