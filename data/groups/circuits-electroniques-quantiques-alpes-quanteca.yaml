description: The QuantECA (Quantum Electronic Circuits Alps) team at the
  Institut Néel focuses on the experimental study of quantum effects in novel
  nano-electronic devices. Their research encompasses superconducting qubits,
  quantum acoustics, spin qubits, and electronic flying qubits, utilizing
  state-of-the-art nanofabrication and low-temperature microwave techniques to
  advance quantum technologies.
