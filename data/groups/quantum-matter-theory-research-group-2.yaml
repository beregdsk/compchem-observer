description: The Quantum Matter Theory Research Group at RIKEN's Center for
  Emergent Matter Science conducts theoretical research on novel quantum phases
  emerging from strongly correlated electron systems in solids. Focusing on
  topological insulators, superconductors, frustrated quantum magnets, and
  molecular conductors, the group builds theoretical models to capture the
  unique electronic features of these materials. By employing analytical and
  computational many-body physics methods, they investigate transport
  properties, magnetism, and superconductivity to advance the understanding of
