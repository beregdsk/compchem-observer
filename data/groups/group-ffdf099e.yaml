description: This research team, led by Team Principal Atsuko Takefusa, focuses
  on developing high-performance cloud and HPC integrated computing
  infrastructure and secure software technologies. They work on adapting
  cloud-native technologies like virtualization and containers to
  supercomputers, linking cloud services with scientific computing, and building
  secure execution environments using hardware-based isolation like TEE to
  enable safe and advanced high-performance computing.
