description: The Raman Spectroscopy Research Group at the Faculty of Chemistry,
  University of Warsaw, led by Prof. Andrzej Kudelski, focuses on
  surface-enhanced Raman spectroscopy (SERS). The group develops advanced
  plasmonic nanomaterials, SERS sensors for medical and analytical applications
  (such as detecting contaminants), and studies enhancement mechanisms,
  including graphene-enhanced Raman spectroscopy (GERS) and pH nanosensors for
  cell organelles.
