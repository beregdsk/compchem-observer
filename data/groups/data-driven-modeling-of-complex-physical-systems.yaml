description: The Data-driven Modeling of Complex Physical Systems (DMP) group is
  an interdisciplinary team of applied mathematicians, physicists, and engineers
  working on new algorithms to model and simulate molecular systems. They
  develop robust data-based methods for modeling, analysis, and control of
  complex dynamical systems, combining machine learning, numerical linear
  algebra, and control theory, with applications to physical systems at the
  atomistic or molecular scale.
