description: The Anstöter Research Group, led by Cate S. Anstöter at the
  University of Glasgow, focuses on electron-dominated phenomena, particularly
  metastable anions and electron-driven reactivity. The group develops
  electronic structure methods to study the structure-property-charge
  relationships of organic molecules, aromaticity, and photoelectron
  spectroscopy. Their research bridges theory and experiment, investigating the
  dynamics of transient anions and photochemical processes. The group is also
  active in education, organizing the Virtual Winter School of Computational
