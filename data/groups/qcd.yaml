description: The High Energy QCD Theory Research Team, part of the FQSP program
  at RIKEN and led by Team Director Shinya Aoki, focuses on the theoretical
  study of high-energy Quantum Chromodynamics (QCD). The team aims to elucidate
  the quark-gluon structure of nucleons, the origins of nucleon spin and mass,
  and the properties of high-density quark matter. By employing lattice QCD and
  high-performance computing, they collaborate with major international
  experiments, including the Electron Ion Collider (EIC), to advance nuclear and
  particle physics.
