description: The List Laboratory at the Max Planck Institute for Coal Research,
  led by Director Benjamin List, focuses on homogeneous catalysis and organic
  synthesis. The group aims to develop highly selective and atom-economical
  catalytic reactions using small organic molecules. Key research areas include
  asymmetric counteranion-directed catalysis (ACDC), aminocatalysis, carbon
  dioxide splitting, and sustainable synthesis of fine chemicals from
  biomass-derived furans.
