description: The Senger Group at the Department of Chemistry for Life Sciences,
  Uppsala University, researches the molecular mechanisms of enzymatic catalysis
  for sustainable development, focusing on green hydrogen production, CO2
  fixation, and nitrogen conversion. They study protein structure-function
  relationships through expression, purification, crystallisation, biophysical
  characterisation, photochemical activation, and advanced structure
  determination using synchrotron and FEL X-ray sources.
