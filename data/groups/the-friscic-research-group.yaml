description: The Friščić Research Group, established in 2011 at the University
  of Birmingham, is led by Professor Tomislav Friščić. The group focuses on
  green and sustainable chemistry, specializing in solid-state, solvent-free,
  and near solvent-free synthesis. Their core research areas include
  mechanochemistry, solid-state chemistry, and crystal engineering for the
  development of advanced materials and energy-efficient molecular synthesis.
