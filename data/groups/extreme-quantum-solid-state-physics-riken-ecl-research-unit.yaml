description: Led by Unit Leader Yukako Fujishiro, the Extreme Quantum Solid
  State Physics RIKEN ECL Research Unit is part of the Center for Emergent
  Matter Science at RIKEN. The unit focuses on the fundamental science of
  emergent phenomena in magnetic topological materials and strongly correlated
  electron systems under extreme conditions. By utilizing advanced
  micro-fabrication techniques like focused ion beams, they achieve ultra-high
  pressures, high-density currents, and gate-controlled carrier densities using
  ionic liquids to explore novel quantum phases and quantum transport
  properties.
