description: The research group of Prof. Arjan W. Kleij at the Institut Català
  d’Investigació Química (ICIQ) focuses on sustainable and selective catalytic
  organic synthesis, CO2 valorization, and the development of biopolymers and
  circular polymers. Their work combines sustainable chemistry principles with
  innovative catalytic methods to produce fine chemicals and advanced materials.
