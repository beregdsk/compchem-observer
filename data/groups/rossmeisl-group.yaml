description: The Rossmeisl Group at the Department of Chemistry, University of
  Copenhagen, specializes in theoretical catalysis using atomic-scale
  simulations and dynamics. Their research focuses on electrocatalysis for
  reactions such as water splitting and CO2 reduction, utilizing periodic
  density functional theory (DFT) to model catalytic interfaces and screen
  high-entropy alloy and semiconductor materials.
