description: The Drug Discovery and Medical Technology Base Program (DMP) at
  RIKEN aims to bridge cutting-edge basic research with medical applications to
  create innovative therapeutics. It focuses on novel drug modalities,
  low-molecular-weight drugs, antibodies, vaccines, and cell therapies.
  Leveraging AI, quantum computing, and radiopharmaceuticals, the program
  promotes data-driven drug discovery. Its specialized units cover molecular
  design, protein chemistry, computational chemistry, and neuroscience,
  fostering industry-academia collaboration to contribute to next-generation
  healthcare.
