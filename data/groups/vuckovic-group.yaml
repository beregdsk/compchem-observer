description: The Vuckovic Group at the University of Fribourg, led by Prof.
  Stefan Vučković, develops rigorous quantum-chemical theories and practical
  approximations to address fundamental issues in simulations, focusing on
  strong correlation, weak interactions, and error reduction in DFT and QC
  simulations. The group also engages in community efforts to support
  under-represented groups and promote LGBTQ+ visibility in academic research.
