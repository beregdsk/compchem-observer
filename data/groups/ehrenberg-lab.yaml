description: The Ehrenberg lab at Uppsala University's Department of Cell and
  Molecular Biology, led by Måns Ehrenberg, focuses on the molecular mechanisms
  of prokaryotic translation, including ribosome recycling, tRNA selection, and
  protein synthesis. The group combines quantitative biochemistry, molecular
  genetics, and mathematical modeling to study cellular processes and the impact
  of antibiotics.
