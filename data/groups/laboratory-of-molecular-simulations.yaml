description: The Laboratory of Molecular simulations at IITH specializes in
  atomistic modeling and simulation of biological matter, using computational
  methods blended with statistical mechanics to understand biological form and
  function. They use all-atom and coarse-grained molecular dynamics to study
  biomolecular interactions and develop real-world applications in
  nanobiotechnology, water desalination, drug design, and nanomedicine.
