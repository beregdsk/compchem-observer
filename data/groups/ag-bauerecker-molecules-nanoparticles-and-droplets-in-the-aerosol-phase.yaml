description: The working group of Sigurd Bauerecker at the Institute of Physical
  and Theoretical Chemistry at TU Braunschweig investigates gas molecules,
  aerosol particles, and droplets. Their research explores the properties of
  matter between the molecular and macroscopic scales, atmospheric chemistry,
  and pharmaceutical applications, utilizing infrared spectroscopy as their
  primary analytical method.
