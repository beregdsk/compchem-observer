description: The Research Group on Condensed Matter and Polymers (GES) at the
  Universitat de València focuses on the theoretical and experimental study of
  semiconductor nanostructures, such as nanowires and quantum dots, for energy
  and photonic applications. Their research covers structural, electronic, and
  optoelectronic properties using first-principles and multi-scale
  semi-empirical modeling, alongside the synthesis and characterization of
  conductive, thermoplastic, and thermosetting polymers for thermoelectric and
  hybrid devices.
