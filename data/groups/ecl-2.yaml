description: The Strongly Correlated Quantum Matter Science ECL Research Unit,
  led by Dr. Rina Tazai at RIKEN Center for Emergent Matter Science, conducts
  theoretical research on many-body electron systems in solid-state materials
  like superconductors and magnets. The unit focuses on strongly correlated
  electron systems, quantum phase transitions, and transport phenomena to
  propose new electronic states and bridge theory with experimental validation.
