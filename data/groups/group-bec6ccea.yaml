description: The Informatics Chemistry Laboratory (情報化学研究室) at Hokkaido
  University, led by Prof. Keisuke Takahashi, focuses on materials and catalyst
  discovery through informatics. The group integrates experiments, theory,
  computation, and data science, leveraging artificial intelligence, machine
  learning, and high-throughput databases to accelerate the development of novel
  materials and catalysts. They also develop user-friendly software platforms to
  promote open science and make informatics tools widely accessible.
