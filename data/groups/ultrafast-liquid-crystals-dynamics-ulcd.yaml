description: The Ultrafast Liquid Crystals Dynamics (ULCD) group, led by Dr.
  Laura Cattaneo at the Max Planck Institute for Nuclear Physics in Heidelberg,
  is an independent research group. They study the ultrafast molecular and
  collective dynamics of liquid crystals on femtosecond to picosecond timescales
  using advanced pump-probe spectroscopy from terahertz to extreme ultraviolet
  wavelengths.
