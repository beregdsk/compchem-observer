description: The Innovative Soft Matter & Bio-related Research Team, led by Team
  Director Yasuharu Ishida at RIKEN's Center for Emergent Matter Science,
  focuses on developing biomimetic and functional soft materials. The team's
  research centers on creating anisotropic, responsive gels, hydrogels, and
  colloidal materials that exhibit advanced mechanical, optical, and dynamic
  properties, bridging the gap between artificial and biological systems.
