description: The page introduces the Emergent Device Research Group
  (創発デバイス研究グループ) at the Center for Emergent Matter Science, RIKEN. Led by Group
  Director Yoshihiro Iwasa, the group researches 'iontronics'—controlling
  electronic properties through ion modulation. They use organic electrolytes
  like ionic liquids combined with strongly correlated substances and
  nanomaterials in electric double-layer transistors to explore novel quantum
  phenomena, such as field-induced superconductivity and phase transitions, and
  to develop high-efficiency thermoelectric materials.
