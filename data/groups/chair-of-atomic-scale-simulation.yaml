description: The Chair of Atomic Scale Simulation at EPFL, led by Prof. Alfredo
  Pasquarello, studies atomic-scale phenomena from both structural and dynamical
  perspectives to complement experiments. By utilizing quantum mechanical
  electronic structure descriptions based on density functional theory and
  high-performance computers, the group visualizes atomic processes. Research
  projects focus on disordered materials and oxide-semiconductor interfaces,
  serving glass manufacturing and microelectronic technologies.
