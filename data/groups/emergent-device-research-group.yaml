description: The Emergent Device Research Group, led by Yoshihiro Iwasa at the
  RIKEN Center for Emergent Matter Science, focuses on the interdisciplinary
  concept of 'Iontronics' (ion-controlled electronics). The group uses electric
  double-layer transistors (EDLTs) with organic electrolytes or ionic liquids to
  generate ultrahigh electric fields, exploring novel quantum phenomena like
  superconductivity and Mott transitions in strongly correlated and
  nanostructured materials. Their work also focuses on creating high-efficiency
  thermoelectric materials and studying two-dimensional materials and colloidal…
