description: The Sugita Theoretical Molecular Science Laboratory at RIKEN is a
  computational chemistry and theoretical biophysics research group led by Yuji
  Sugita. The lab develops integrated theoretical and computational methods to
  elucidate structure and dynamics of biomolecular systems, including proteins,
  nucleic acids, glycans, and membranes. Research covers large-scale
  conformational changes, proton and electron transfer, electronic and
  vibrational states, and the effects of solvent and crowding environments. The
  group actively develops next-generation simulation software, such as the
