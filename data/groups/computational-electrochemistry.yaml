description: The Computational Electrochemistry group at Uppsala University, led
  by Dr. Chao Zhang, focuses on the fundamental aspects of ion-conducting
  solutions and electrically charged interfaces for electrochemical energy
  storage and conversion. Their research includes developing finite-field
  molecular dynamics methods, simulating ion transport in liquid and polymer
  electrolytes, and creating machine learning tools like the PiNN library for
  atomistic simulations.
