description: The group employs theory, modeling, and simulation to study the
  structure, self-assembly, and dynamics of complex fluids, active soft matter,
  and living matter. They focus on systems far from thermal equilibrium,
  particularly the collective behavior of mesoscopic self-propelled objects and
  the flow behavior of biofluids.
