description: A solid-state theory group at Okayama University's Research
  Institute for Interdisciplinary Science. It links the microscopic structure of
  materials to experimental measurements, studying magnetism, frustrated spin
  systems and superconductivity, and designing new materials. It also develops
  computational methods that describe materials more realistically and make more
  physical quantities affordable to compute, including the DCore dynamical
  mean-field theory package for correlated electrons.
