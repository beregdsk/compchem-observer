description: The Materials Technology and Sustainability Research Group (MATS)
  at the Universitat de València focuses on designing and validating
  technologies for material preparation and functionalisation, emphasising
  sustainability and the circular economy. Their work spans polymeric and
  composite membranes, supercritical fluid processing, advanced packaging,
  nanostructured photocatalysts, and plastic waste valorisation, combining
  experimental research with modelling and strong educational training.
