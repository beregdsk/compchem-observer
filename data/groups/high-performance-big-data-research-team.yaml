description: The High Performance Big Data Research Team at the RIKEN Center for
  Computational Science develops system software for advanced high-performance
  computers like the Fugaku supercomputer. The team focuses on integrating
  high-performance computing (HPC), big data, and artificial intelligence (AI)
  by researching scalable parallel I/O, machine learning platforms, fault
  tolerance, and advanced programming environments.
