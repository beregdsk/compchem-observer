description: The Deindl lab at Uppsala University, led by Sebastian Deindl,
  investigates the structural architectures and dynamics of proteins and protein
  complexes that regulate gene expression. The group uses single-molecule
  fluorescence imaging, structural techniques, biochemistry, and computer
  simulations to study molecular dynamics and mechanistic functions at the
  atomic level.
