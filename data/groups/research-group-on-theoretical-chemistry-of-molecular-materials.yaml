description: The Research Group on Theoretical Chemistry of Molecular Materials
  (MolMatTC) focuses on the theoretical characterization of structural,
  electronic, and self-assembly properties of molecular systems for molecular
  electronics, such as OLEDs, photovoltaic cells, and sensors. Using
  quantum-chemical calculations, they study structure-property relationships,
  charge transport, and optical properties of conjugated polymers, MOFs, and
  perovskites to design improved electroactive materials.
