description: The research group of Dr. Elisabet Romero at ICIQ designs and
  constructs bio-inspired systems for solar energy conversion into fuel.
  Focusing on chromophore-protein assemblies from biodegradable materials, the
  team studies light absorption, transfer, and conversion dynamics using
  ultrafast spectroscopy and computational modelling.
