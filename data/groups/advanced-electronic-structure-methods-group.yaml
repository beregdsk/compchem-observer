description: The Advanced Electronic Structure Methods Group at the Faculty of
  Chemistry, University of Warsaw, led by Michał Lesiuk, focuses on developing
  novel quantum chemistry and electronic structure methods. Their research
  interests include the theoretical design of organic materials for OLEDs,
  modeling proton-matter interactions for cancer radiation therapy, and
  high-precision ab initio calculations of molecular properties.
