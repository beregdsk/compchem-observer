description: The Laboratoire d'Ingénierie des Fonctions Moléculaires (IFM) is a
  computational chemistry research group at the Institut de Chimie de
  Strasbourg, University of Strasbourg, led by Marco Cecchini. Focused on
  computational modeling at the interface of life and material sciences, the
  team studies molecular self-assembly, allosteric regulation of
  neurotransmitter receptors, and develops numerical methods for free energy
  computation in biomolecular simulation and drug design.
