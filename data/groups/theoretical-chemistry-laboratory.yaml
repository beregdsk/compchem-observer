description: The Theoretical Chemistry Laboratory at Hokkaido University, led by
  Professor Satoshi Maeda, conducts research in computational chemistry, data
  science, and materials informatics. Key projects include developing automated
  reaction path search methods (AFIR) to predict complex chemical reactions and
  applying machine learning to discover novel catalysts and functional
  materials.
