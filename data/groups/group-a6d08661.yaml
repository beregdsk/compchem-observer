description: The Large-scale Parallel Numerical Computation Technology Research
  Team, led by Team Principal Toshiyuki Imamura, focuses on developing
  high-performance, highly parallel numerical computation libraries for
  supercomputers like Fugaku. Their research covers parallel numerical
  algorithms, numerical linear algebra, mixed-precision computing, and minimal
  precision algorithms, aiming to establish foundational numerical software
  (such as KMathLib and EigenExa) to support next-generation computational
  science.
