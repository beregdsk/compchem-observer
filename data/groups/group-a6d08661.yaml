description: The Large-scale Parallel Numerical Computation Technology Research
  Team, led by Toshiyuki Imamura at RIKEN Center for Computational Science,
  develops high-performance numerical libraries and algorithms, such as EigenExa
  and KMathLIB, to maximize supercomputer capabilities. Their work focuses on
  parallel numerical algorithms, linear algebra, and mixed-precision computing
  for large-scale scientific simulations.
