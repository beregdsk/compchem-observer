description: The Soft Matter Properties Research Team at RIKEN investigates the
  mesoscopic structural diversity and physical properties of soft matter, such
  as liquid crystals and polymers. Their research focuses on understanding
  self-organization, ferroelectricity, and optical/electronic properties to
  develop functional materials and advanced photonic devices.
