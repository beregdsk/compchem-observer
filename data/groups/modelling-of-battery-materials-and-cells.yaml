description: The research group 'Modelling of battery materials and cells' at
  Uppsala University focuses on computational simulations to study battery
  materials, electrode/electrolyte interfaces, ion transport, and cell-level
  phenomena. They employ advanced techniques such as Density Functional Theory,
  Molecular Dynamics, Finite Element Methods, and machine learning to model
  polymer electrolytes, surface reactions, and cell aging.
