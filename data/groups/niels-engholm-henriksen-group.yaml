description: The Niels Engholm Henriksen Group at DTU Chemistry investigates the
  quantum mechanical description of molecules, focusing on femtosecond dynamics
  in space and time. The group develops computational and theoretical methods to
  predict, observe, and control chemical reactions, using ultrashort laser
  pulses and high-performance computing.
