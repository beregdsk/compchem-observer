description: The Molecular Manipulation group led by Dr. Christian Wagner at the
  Peter Grünberg Institute (PGI-3) studies the manipulation and control of
  individual molecules using scanning probe microscopes (SPM). The group works
  on molecular nanofabrication, theory of molecular manipulation using density
  functional theory (DFT) and molecular mechanics, scanning quantum dot
  microscopy (SQDM), and the fabrication of atomic-scale quantum structures.
  Their research integrates experiments, simulations, machine learning, and
  control theory, funded by an ERC Starting Grant.
