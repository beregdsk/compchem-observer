description: The Quantum Functional System Research Group, led by Seigo Tarucha
  at RIKEN's Center for Emergent Matter Science, conducts research on quantum
  information processing based on the pure control of quantum states in solids.
  The group focuses on semiconductor and superconducting nanostructures to
  develop quantum computing, quantum interfaces, and quantum nanodevices, while
  exploring fundamental quantum phenomena like entanglement and decoherence.
