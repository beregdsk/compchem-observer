description: Research Group on Membrane Biophysics (MemBioPhys) studies
  self-assembly of amphipathic molecules, characterisation of membrane
  structures, and light-induced molecular switches. It focuses on pore
  formation, fusion and fission, using computational analysis, molecular
  simulations, and spectroscopic techniques.
