description: The Continuous Field Theory Research Team at RIKEN Center for
  Computational Science, led by Yasumichi Aoki, focuses on theoretical and
  computational particle physics, particularly lattice quantum chromodynamics
  (QCD). The team develops high-performance computing algorithms and codes for
  supercomputers like Fugaku to perform large-scale simulations of QCD, aiming
  to understand fundamental symmetries, phase transitions, and the standard
  model of particle physics.
