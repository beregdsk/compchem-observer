description: The Continuous Field Theory Research Team, led by Yasumichi Aoki at
  the RIKEN Center for Computational Science in Kobe, conducts theoretical and
  computational research in particle physics, focusing on lattice QCD to explore
  the standard model, chiral symmetry, and phase transitions. They perform
  large-scale numerical simulations on the Fugaku supercomputer, developing
  advanced algorithms and high-performance computing libraries to bridge
  first-principle calculations with physical phenomena and the evolution of the
  universe.
