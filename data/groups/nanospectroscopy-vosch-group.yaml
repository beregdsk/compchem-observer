description: The Nanospectroscopy - Vosch Group at the University of Copenhagen
  focuses on single-molecule fluorescence microscopy and spectroscopy,
  particularly the unique photophysical properties of small noble metal clusters
  like DNA-stabilized silver nanoclusters and zeolite-encapsulated clusters for
  applications in imaging, LEDs, and solar cells.
