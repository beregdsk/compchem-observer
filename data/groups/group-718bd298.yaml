description: The Strongly Correlated Matter Research Group, part of the Center
  for Emergent Matter Science at RIKEN and led by Group Director Yoshinori
  Tokura, studies the emergent properties of strongly correlated electronic
  systems. Focusing on electronic transport and optical properties within
  complex spin and orbital structures, the group investigates phenomena such as
  giant magnetoresistance, high-temperature superconductivity, multiferroics,
  topological insulators, and skyrmions to uncover novel quantum
  functionalities.
