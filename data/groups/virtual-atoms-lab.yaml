description: The Virtual Atoms Lab at Imperial College London, led by Dr Alex
  Ganose, uses computational materials chemistry, data-driven approaches, and
  machine learning to discover new functional materials for photovoltaics,
  thermoelectrics, and more. The group develops open-source codes, investigates
  electron-phonon interactions, and builds computational databases to predict
  material properties and accelerate materials discovery.
