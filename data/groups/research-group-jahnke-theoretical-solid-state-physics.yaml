description: The Research Group Jahnke at the University of Bremen focuses on
  theoretical solid-state physics, semiconductor quantum optics, and many-body
  theory. Their research interests include the generation of non-classical light
  states, semiconductor and nanolasers, optical properties of nanostructures,
  atomar material design, and charge carrier dynamics.
