description: The research group led by Prof. Katherine Villa at the Institut
  Català d’Investigació Química (ICIQ) focuses on light-driven systems for
  energy, health, and environmental remediation. They design nanostructured
  photocatalytic systems based on multicomponent heterojunctions to convert
  polluting compounds into high-value chemicals and solar fuels, and develop
  light-driven micro/nanorobots for water purification and photodynamic therapy.
