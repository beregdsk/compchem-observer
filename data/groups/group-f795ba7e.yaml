description: The Integrated Materials Science Research Program at RIKEN's Center
  for Emergent Matter Science promotes interdisciplinary research across
  physics, chemistry, and electronics. Led by Program Director Takahisa Arima
  and young researchers, it focuses on advanced condensed matter physics,
  including strongly correlated electron systems, giant magnetoresistance,
  high-temperature superconductors, multiferroics, and topological insulators,
  to discover new material functions.
