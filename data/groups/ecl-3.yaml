description: This research unit focuses on extreme conditions to explore
  emergent phenomena in magnetic topological materials and strongly correlated
  electron systems. By employing advanced microfabrication techniques for
  quantum single crystals, they generate ultra-high pressures, control magnetic
  dynamics, and tune carrier densities. Their work aims to discover new quantum
  phases and elucidate quantum transport properties.
