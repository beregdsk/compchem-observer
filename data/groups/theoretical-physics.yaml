description: The division of Theoretical Physics at Linköping University, hosted
  by the Department of Physics, Chemistry and Biology (IFM), focuses on
  condensed matter theory, particularly the behavior of materials under extreme
  conditions, energy materials, superconductors, and disordered systems. The
  group utilizes ab initio methods, high-performance computing, and machine
  learning for materials design and discovery, bridging fundamental physics with
  practical applications.
