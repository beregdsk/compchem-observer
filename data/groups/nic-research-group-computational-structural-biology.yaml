description: The NIC research group Computational Structural Biology at JSC, led
  by Prof. Dr. Alexander Schug, focuses on the quantitative understanding of
  structural and dynamical mechanisms of biomolecules via multi-scale molecular
  dynamics simulations on HPC systems. They study protein and RNA folding,
  stability, and function, combining simulations with genomic data and
  experimental measurements to design novel biomolecules.
