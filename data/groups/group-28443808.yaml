description: The Mathematical Quantum Information RIKEN Hakubi Research Team,
  led by Bartosz Regula, focuses on the mathematical foundations of quantum
  information theory. Their research centers on quantifying, manipulating, and
  utilizing physical resources in quantum information and communication,
  developing robust mathematical frameworks for quantum resource theories and
  quantum Shannon theory.
