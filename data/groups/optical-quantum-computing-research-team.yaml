description: The Optical Quantum Computing Research Team at RIKEN, led by
  Director Akira Furusawa, aims to realize fault-tolerant, large-scale universal
  optical quantum computers. The team focuses on deterministic quantum
  teleportation and the development of large-scale cluster states using
  time-domain multiplexing, contributing to advanced quantum information science
  and quantum optics.
