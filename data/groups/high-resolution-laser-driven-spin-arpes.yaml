description: This page details the high-resolution laser-driven spin-ARPES setup
  developed and operated within the Electronic Structure of Quantum Materials
  Group at the Peter Grünberg Institute (PGI-6), Forschungszentrum Jülich. It
  outlines the advanced capabilities of the angle-resolved photoemission
  spectroscopy system, including 3D momentum scanning, spin detection, and
  high-resolution measurements on quantum materials such as WTe2, supported by
  key publications.
