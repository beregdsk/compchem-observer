description: Research group at EPFL's LCPT led by Prof. Jiri Vanicek, focusing
  on quantum and semiclassical molecular dynamics, nonadiabatic processes, and
  ultrafast time-resolved spectroscopy using ab initio methods. Research areas
  also include on-the-fly ab initio quantum and semiclassical dynamics, and
  efficient evaluation of accuracy of molecular quantum dynamics using the
  dephasing representation.
