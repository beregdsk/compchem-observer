description: The Devereaux Group at Stanford University and SLAC National
  Accelerator Laboratory, led by Prof. Tom Devereaux, focuses on computational
  methods for materials science, specializing in time-domain spectroscopy, X-ray
  science, photoemission, and theoretical approaches to understanding complex
  materials. The group is associated with the Departments of Physics, Applied
  Physics, and Materials Science and Engineering, as well as SIMES and TIMES.
