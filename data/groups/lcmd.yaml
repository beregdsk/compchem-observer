description: The LCMD (Laboratory for Computational Molecular Design) at EPFL,
  led by Prof. Clémence Corminboeuf, is a research group specializing in quantum
  chemistry and computational molecular design. The group focuses on developing
  methodological tools, machine learning techniques, and correcting standard
  density functional approximations for non-covalent interactions. Their
  research spans computational catalysis, organic electronics, and
  semiconductors, aiming to design high-performance molecular materials and
  screen homogeneous catalytic species.
