description: The research group led by Prof. Dr. Alexander Lichtenstein at the
  I. Institute of Theoretical Physics, University of Hamburg, focuses on the
  theory of magnetism and electronic correlations. The group investigates
  quantum spin phenomena in nanomagnetic structures, magnetic adatoms, and
  complex materials. They develop and apply advanced electronic structure
  methods, specifically combining density functional theory (DFT) with dynamical
  mean-field theory (DMFT) to study local electron-electron correlations and
  magnetic properties at the nanoscale.
