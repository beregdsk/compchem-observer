description: The Institute for Molecular Science (IMS) is a Japanese
  inter-university research institute based in Okazaki, promoting leading
  research in molecular science, including theoretical and computational
  chemistry, photonic, materials, and life sciences, while providing advanced
  research facilities, joint research opportunities, and international academic
  exchange. Composed of four research areas and several centers, it aims to
  maintain its function as an international research center.
