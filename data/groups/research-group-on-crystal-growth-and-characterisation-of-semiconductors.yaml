description: The Research Group on Crystal Growth and Characterisation of
  Semiconductors (CRECYCSEM) at the Universitat de València focuses on the
  growth and structural/morphological characterisation of semiconductor
  materials, particularly oxides like ZnO, CdO, and MgO. They employ various
  crystal growth techniques such as Bridgman, MOCVD, and PVD, alongside advanced
  characterisation methods like HRXRD and HRTEM, targeting applications in
  optoelectronics, spintronics, and solar energy.
