description: The Laboratory of Natural Products Chemistry at the Faculty of
  Chemistry, University of Warsaw, led by Prof. Zbigniew Czarnocki, focuses on
  organic synthesis, particularly asymmetric synthesis of natural and
  pharmacologically active compounds. The group also conducts in silico
  research, including molecular docking and molecular dynamics simulations, to
  study the biological activity of synthesized compounds.
