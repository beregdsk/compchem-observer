description: The Quantum Matter Theory Research Group at the RIKEN Center for
  Emergent Matter Science theoretically investigates emergent quantum phenomena
  in strongly correlated electrons, molecular conductors, frustrated quantum
  magnets, and topological superconductors. The group constructs effective
  models of interacting electrons to study magnetism, transport, and topological
  properties using analytical and computational approaches.
