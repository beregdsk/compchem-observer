description: The Laser Spintronics Group, led by Dr. Roman Adam at the Peter
  Grünberg Institute, investigates charge and spin dynamics in thin films and
  metallic stacks. Using femtosecond pump-probe spectroscopy, the group explores
  ultrafast spin dynamics, spintronic THz emitters, all-optical switching, and
  high harmonic generation for spin-based electronics and quantum computing.
