description: The Topological Phenomena Theory Research Team at the RIKEN Center
  for Emergent Matter Science, led by Team Director Shuichi Murakami, conducts
  theoretical and analytical research on emergent physical phenomena of
  electrons, quasiparticles, and waves in materials and metamaterials. Focusing
  on topological structures, their research spans topological phases, chiral
  phonons, electromagnetic multipoles, non-Hermitian systems, and metamaterials,
  seeking universal laws across quantum and classical systems.
