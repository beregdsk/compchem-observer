description: The Mamedov group, based at the Department of Chemistry - Ångström
  Laboratory at Uppsala University, focuses on photosynthetic light reactions,
  particularly water oxidation and proton-coupled electron transfer in
  Photosystem II. They utilize biochemical, biophysical, and spectroscopic
  methods, with a primary focus on Electron Paramagnetic Resonance (EPR)
  spectroscopy, to study photosynthetic hydrogen production and thylakoid
  membrane dynamics.
