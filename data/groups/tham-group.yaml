description: The Tham Group at the ANU Research School of Biology investigates
  the molecular biology of chytrid fungus and how it infects frogs, with the
  goal of developing novel interventions. They combine structural biology and
  genetic modification with AI-driven computational pipelines to identify key
  fungal virulence proteins and design targeted nanobodies to block infection.
