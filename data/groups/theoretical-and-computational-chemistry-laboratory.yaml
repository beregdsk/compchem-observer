description: Official website of the Theoretical and Computational Chemistry
  Laboratory, Department of Chemistry, School of Science, Okayama University.
  The lab uses molecular simulations to study the structure and dynamics of
  complex molecular systems, such as macromolecular self-assemblies, to analyze
  molecular functions and support molecular design. It develops molecular
  simulation methodologies focused on multiscale molecular modeling, including
  the coarse-grained SPICA force field for biomolecular and soft matter systems
  and polarization force fields for ion dynamics in battery electrolytes.
