description: LIAF (Laboratory for Isotopes at the Atomic Frontier) is an
  independent research group at the Max Planck Institute for Nuclear Physics,
  led by Dr. Liss Vázquez Rodríguez. The group specializes in high-resolution
  collinear laser spectroscopy of short-lived radioactive isotopes at CERN's
  ISOLDE facility, focusing on studying nuclear structure, charge radii, and
  electromagnetic moments of exotic nuclei.
