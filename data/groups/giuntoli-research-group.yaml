description: The Giuntoli research group focuses on polymer and soft matter
  physics to study structure-property relationships in soft materials. They
  develop multiscale computational models to understand and design complex
  supramolecular and (bio)materials from nanoscale building blocks, aiming to
  design materials for a sustainable future and biomedical relevance.
