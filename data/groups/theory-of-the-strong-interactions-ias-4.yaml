description: Theory of the Strong Interactions (IAS-4) is a research division of
  the Institute for Advanced Simulation at Forschungszentrum Jülich, led by
  Prof. Ulf-G. Meißner. It focuses on non-perturbative strong interactions,
  hadron and nuclear structure, and exotic hadrons using lattice quantum
  chromodynamics, nuclear lattice effective field theory, and stochastic
  methods. It also investigates strongly correlated electrons in low-dimensional
  systems like graphene, leveraging high-performance computing.
