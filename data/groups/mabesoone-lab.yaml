description: The Mabesoone Lab, or Laboratory for Data-Driven Biomaterials at
  Radboud University Nijmegen, is a research group specializing in the
  data-driven design of soft, biobased, and biodegradable materials. By
  combining high-throughput experimentation with machine learning, the lab
  engineers advanced biomaterials for biomedical applications like tissue
  regeneration, antifouling, and drug delivery.
