description: The Category Theory Physics RIKEN ECL Research Unit, led by Kantaro
  Ohmori, is a theoretical research group under the Center for Mathematical
  Sciences (iTHEMS) at RIKEN, based in Wako, Japan. The unit focuses on applying
  category theory and higher algebra to quantum field theory, spanning particle
  physics, condensed matter, and quantum information. They work on translating
  macroscopic properties of matter into microscopic quantum models, utilizing
  tensor networks and lattice models to develop algebraic computational methods
  for quantum simulation and system design.
