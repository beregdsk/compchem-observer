description: The Discrete Event Simulation Research Team, led by Team Principal
  Nobuyasu Ito at the RIKEN Center for Computational Science (R-CCS) in Kobe,
  Japan. The team focuses on computational and statistical physics, complex
  systems, and non-equilibrium/nonlinear phenomena. They develop discrete
  simulation models and high-performance computing software, such as OACIS, to
  study material behaviors like boiling and fracture, as well as social systems
  like traffic, epidemics, and economics using supercomputers.
