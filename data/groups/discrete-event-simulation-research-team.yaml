description: The Discrete Event Simulation Research Team, led by Nobuyasu Ito at
  the RIKEN Center for Computational Science (R-CCS) in Kobe, focuses on
  simulating complex discrete events in both natural and social systems—such as
  traffic, epidemics, economics, and power grids—using supercomputers like
  Fugaku and K. They develop high-performance computing software, notably OACIS,
  to facilitate large-scale simulation execution and analysis, and study
  statistical and non-equilibrium physics.
