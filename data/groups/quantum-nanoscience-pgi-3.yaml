description: Quantum Nanoscience (PGI-3) is a division of the Peter Grünberg
  Institute at Forschungszentrum Jülich, Germany. Focused on quantum nanoscience
  and quantum technologies, it hosts multiple research groups specializing in
  scanning probe microscopy, molecular manipulation, spin systems, and quantum
  sensing. Led by Prof. Dr. F. Stefan Tautz, the institute investigates
  quantum-coherent functionality in nanostructures, topological materials, and
  2D magnets through experimental and theoretical approaches.
