description: The Next-Generation HPC Infrastructure System Development Unit at
  the RIKEN Center for Computational Science, led by Unit Leader Kentaro Sano,
  focuses on the research and development of the FugakuNEXT supercomputer. The
  unit specializes in hardware system design, including CPU and accelerator
  microarchitectures, compute node architecture, interconnection networks, and
  co-design with applications to advance high-performance computing.
