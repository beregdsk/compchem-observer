description: The Eli Nathan Weinstein Group at DTU Chemistry focuses on
  developing machine learning methods for molecular science. Their research
  involves creating probabilistic approaches to predict molecular properties and
  guide the design of new molecules. They work on co-designing experiments and
  inference algorithms to optimize chemical synthesis and screening, and they
  also explore learning from natural experiments to extract patterns from
  complex datasets.
