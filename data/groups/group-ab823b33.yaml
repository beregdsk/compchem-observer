description: The Floating Electron Quantum Information RIKEN Hakushi Research
  Team is a PI-led research group at RIKEN's Quantum Computing Research Center,
  led by Erika Kawakami. The team conducts research on quantum information
  processing using electrons floating on helium surfaces, aiming to develop
  highly coherent qubits for quantum computing. Their work includes the
  detection of Rydberg states of surface electrons, cryogenic amplification, and
  technologies for qubit integration.
