description: The Pittkowski Group, led by Rebecca K. Pittkowski at the
  University of Copenhagen's Department of Chemistry, investigates the
  relationship between nanoparticle structure and catalytic properties. The
  group synthesizes metal alloy and oxide nanoparticles, studying their
  electrocatalytic behavior for energy conversion reactions like water
  electrolysis and fuel cells. They employ synchrotron X-ray techniques,
  including XAS, to understand catalyst structure and stability under reaction
  conditions.
