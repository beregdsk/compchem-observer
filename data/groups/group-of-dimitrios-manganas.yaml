description: The Manganas group focuses on the development and application of
  advanced experimental and theoretical spectroscopic methodologies for the
  study of heterogeneous catalytic reactions, as well as identifying
  catalytically active structures and intermediates in homogeneous and
  heterogeneous catalysis. Research topics include accurate ground and excited
  state energetics for solid systems, theoretical spectroscopic protocols for
  catalysis, theoretical X-ray spectroscopy, and advanced experimental and
  theoretical spectroscopy, often in collaboration with other groups at the MPI
  KoFo and MPI-CEC.
