description: The Jensen Group, part of the Physical Chemistry division at the
  University of Copenhagen, is led by Professor Jan Halborg Jensen. The group
  focuses on the development of new computational methods and their application
  to key chemical challenges, bridging machine learning and quantum chemistry.
  Their research highlights include genetic algorithm-based molecule discovery,
  high-throughput screening for antibiotics, solar energy storage molecules, and
  catalysis discovery.
