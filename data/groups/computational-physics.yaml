description: This page outlines the research in Computational Physics at Uppsala
  University's Department of Physics and Astronomy. It covers projects on
  electronic structures of metal hydrides and amorphous materials, functional
  magnetic materials, superconductivity, oxide heterostructures, theoretical
  spectroscopy, molecular spintronics, magnetism, and nanobiotechnology.
  Researchers utilize density functional theory (DFT), molecular dynamics, and
  dynamical mean field theory to model complex materials and molecular systems
  for applications in energy, spintronics, and bio-sensing.
