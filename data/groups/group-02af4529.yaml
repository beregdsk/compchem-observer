description: The Emergent Phenomena Measurement Research Team at RIKEN's Center
  for Emergent Phenomenal Science, directed by Tetsuro Hanaguri, investigates
  the electronic states underlying emergent phenomena in solid-state systems,
  such as high-temperature superconductivity and topological quantum phenomena.
  Using scanning tunneling microscopy under extreme conditions, the team maps
  electronic states at the atomic level to understand the relationship between
  material properties and electronic states, while developing novel measurement
  techniques.
