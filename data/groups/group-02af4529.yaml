description: The Emergent Matter Property Measurement Research Team at RIKEN's
  Center for Emergent Matter Science investigates the electronic states
  underlying emergent phenomena in solids, such as high-temperature
  superconductivity and topological quantum states, using scanning tunneling
  microscopy under extreme conditions. By mapping electronic states at the
  atomic scale with high energy resolution, the team aims to clarify the
  relationship between material properties and electronic states, while
  developing advanced measurement techniques to discover novel emergent
  phenomena.
