description: The Semiconductor Quantum Information Device Research Team at
  RIKEN's Quantum Computing Research Center develops semiconductor quantum dot
  spin qubits for quantum computing. The team focuses on spin control, quantum
  logic operations, and device integration compatible with semiconductor
  fabrication, aiming for scalable quantum processors operating at temperatures
  above 1 Kelvin. Research includes single-shot spin readout, active reset, and
  noise characterization in silicon-based qubits.
