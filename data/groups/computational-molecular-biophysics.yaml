description: Computational Molecular Biophysics is a young research group at the
  Faculty of Chemistry, Gdańsk University of Technology, led by Jacek Czub. The
  group performs classical and quantum chemical molecular dynamics simulations,
  free energy calculations, and data analysis to study protein conformational
  changes, biomolecular interactions, lipid bilayer environments, and drug
  design.
