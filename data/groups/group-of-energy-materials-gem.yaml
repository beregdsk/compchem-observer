description: The Group of Energy Materials (GEM) at EPFL, led by Dr. Jan Van
  herle, conducts R&D on fuel cells and electrolysis, focusing on solid oxide
  technology for cogeneration and power-to-gas applications. Based in Sion,
  Switzerland, the group works on sustainable energy conversion and develops
  tools for electrochemical impedance analysis.
