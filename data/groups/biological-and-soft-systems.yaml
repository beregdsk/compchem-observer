description: The Biological and Soft Systems Sector of the Cavendish Laboratory
  at the University of Cambridge brings together researchers from polymer
  science, soft and hard condensed matter, and statistical physics. It focuses
  on research themes such as cells and biological processes, soft and biological
  matter, and physics in medicine, using facilities for microscopy, single
  molecule manipulation, and soft material characterisation.
