description: The Heinke Group at Freie Universität Berlin is a research group
  focused on novel functional materials, particularly thin films of nanoporous
  metal-organic frameworks (MOFs). They investigate their physicochemical
  properties using advanced spectroscopic techniques, focusing on molecular
  diffusion, adsorption, ion conductivity, and optoelectronic properties for
  applications like molecular separation and sensing. They also develop smart
  materials with light-controllable properties.
