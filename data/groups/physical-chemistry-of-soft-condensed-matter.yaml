description: The Physical Chemistry of Soft Condensed Matter group at Aarhus
  University, led by Professor Jan Skov Pedersen, conducts fundamental research
  on soft condensed matter systems such as lipids, proteins, surfactants,
  polymers, block copolymers, and colloids. They utilize small-angle X-ray
  scattering to characterize structures and properties relevant to biology,
  pharmaceuticals, and dairy science.
