description: The research group Diffraction Methods and Electron Microscopy, led
  by Prof. Dr. Christian Kumpf, is part of the Quantum Nanoscience department at
  the Peter Grünberg Institute (PGI-3), Forschungszentrum Jülich. The group
  employs advanced electron and X-ray diffraction techniques, such as
  aberration-corrected spectromicroscopy and X-ray standing waves, to
  investigate the structural and electronic properties of molecular interfaces
  and epitaxial 2D materials.
