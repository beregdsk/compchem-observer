description: The Strongly Correlated Theory Research Group at the Center for
  Emergent Matter Science, RIKEN, conducts theoretical and computational
  research on strongly correlated electron systems in solids. Focusing on
  topological properties, the group aims to explore novel electronic functions
  such as non-dissipative currents. By combining first-principles calculations,
  field theory, and numerical modeling, they predict and design magnetic,
  optical, transport, and thermal properties of complex materials.
