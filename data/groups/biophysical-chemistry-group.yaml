description: The Biophysical Chemistry Group at the Faculty of Chemistry,
  University of Warsaw, led by Prof. Wojciech Dzwolak, conducts research at the
  interface of chemistry, biology, and physics. Key areas include protein
  aggregation and amyloidogenesis, non-Anfinsenian protein folding, prebiotic
  chemistry, optical spectroscopy of biomacromolecules, and biological soft
  matter for bionanomaterials.
