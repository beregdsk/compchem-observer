description: The Computational Electrochemistry Laboratory (CEL) @ Guelph is a
  research group led by Prof. Leanne D. Chen at the University of Guelph. The
  group uses ab initio computational methods, including density functional
  theory and molecular dynamics, to model reactions at the electrode-electrolyte
  interface. Their research focuses on electrocatalysis for sustainable energy
  applications, such as fuel cells, batteries, and CO2 reduction.
