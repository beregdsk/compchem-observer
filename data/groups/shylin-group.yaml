description: The Shylin group at Uppsala University's Department of Chemistry -
  Ångström Laboratory focuses on photocatalytic and electrocatalytic energy and
  chemical conversion. They develop photo- and electrochemical approaches for
  small molecule activation, combining synthetic inorganic chemistry with
  advanced spectroscopic, electrochemical, and crystallographic techniques to
  investigate catalytic mechanisms and high-valent transition metal species.
