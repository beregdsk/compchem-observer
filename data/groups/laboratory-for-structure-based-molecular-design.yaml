description: The Laboratory for Structure-Based Molecular Design at RIKEN Center
  for Integrative Medical Sciences, led by Teruki Honma, develops computational
  methods for designing small molecules, nucleic acids, and proteins to
  accelerate drug discovery. Its research focuses on in silico screening,
  constructing fragment-based drug discovery (FBDD) platforms, and
  simulation/design technologies for biological molecules.
