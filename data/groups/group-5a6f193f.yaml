description: The official homepage of the Organic Reaction Chemistry Laboratory
  (有機反応論研究室) at Hokkaido University, led by Professor Aiichiro Nagaki. The lab
  specializes in flash chemistry and micro-synthesis, utilizing flow
  microreactors to control fast organic reactions within seconds. They focus on
  the high-speed creation of functional and biological molecules, integrating
  data science and machine learning to pioneer new synthetic methodologies.
