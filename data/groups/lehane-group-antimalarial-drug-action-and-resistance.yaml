description: The Lehane Group, based at the Australian National University's
  Research School of Biology, studies membrane transport processes in Plasmodium
  parasites to understand antimalarial drug action and resistance. Their
  research focuses on identifying and characterizing parasite transport proteins
  as drug targets, developing screening assays to discover chemical inhibitors,
  and understanding the mechanisms of drug resistance.
