description: The Khusniyarov Group, led by PD Dr. Marat Khusniyarov, is a
  research group based at the Department of Chemistry and Pharmacy of the
  Friedrich-Alexander-Universität Erlangen-Nürnberg in Erlangen, Germany. The
  group's research focuses on molecular switches, such as spin-crossover and
  valence tautomeric systems, and metallosupramolecular magnetic networks,
  utilizing spectroscopic and theoretical methods to study metal complexes.
