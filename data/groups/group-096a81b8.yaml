description: The Data Assimilation Research Team at the RIKEN Center for
  Computational Science (R-CCS), led by Team Principal Takemasa Miyoshi, focuses
  on fusing simulations with observational data. The team develops advanced data
  assimilation algorithms and leverages supercomputing resources like Fugaku to
  achieve high-resolution, rapid-update forecasting for severe weather and
  natural disasters.
