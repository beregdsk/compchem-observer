description: The Drug Discovery Chemistry Platform Unit at RIKEN focuses on the
  discovery and optimization of small molecule drug candidates for preclinical
  safety studies and clinical trials. Leveraging X-ray crystallography,
  in-silico modeling, and high-throughput screening, the unit conducts rational
  drug design and SAR development for rare genetic diseases and
  difficult-to-treat cancers.
