description: The First-Principles Materials Science Research Team at RIKEN
  Center for Emergent Matter Science, led by Director Ryotaro Arita, conducts
  research on the electronic properties of correlated and topological materials
  using first-principles calculations. The team aims to predict novel phenomena
  arising from many-body correlations, design functional materials, and develop
  advanced electronic structure calculation methods.
