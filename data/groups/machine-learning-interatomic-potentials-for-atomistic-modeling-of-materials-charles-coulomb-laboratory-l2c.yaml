description: This page presents the research group on machine learning
  interatomic potentials at the Charles Coulomb Laboratory (L2C), coordinated by
  Simona Ispas and Thibault Sohier. The group focuses on developing
  machine-learned interatomic potentials from quantum-mechanical data to perform
  large-scale atomistic simulations of complex materials, such as amorphous
  systems and 2D van der Waals heterostructures, bridging the gap between
  accuracy and computational cost.
