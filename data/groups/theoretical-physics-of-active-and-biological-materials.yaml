description: This page presents a research group within the Charles Coulomb
  Laboratory (L2C) focused on the theoretical physics of active and biological
  materials. The team investigates the physical principles that organize living
  matter, including large‑scale intracellular organization, the 3D architecture
  of the genome, active segregation of bacterial genomes, and the dynamics of
  bioenergetic complexes in membranes. They also model immune systems as complex
  cell‑population systems. The group combines theoretical modeling, stochastic
  and differential equations, Monte Carlo and molecular/Brownian…
