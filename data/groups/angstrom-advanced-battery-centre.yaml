description: The Ångström Advanced Battery Centre (ÅABC) is the largest battery
  research group in the Nordic region, hosted at the Department of Chemistry -
  Ångström Laboratory, Uppsala University. Led by five professors and comprising
  over 100 researchers, their research covers the entire value chain of battery
  technologies, focusing on active materials, electrolytes, and separators for
  electric vehicles and energy storage. They work on lithium-ion, sodium-ion,
  lithium metal, organic, and lithium-sulfur batteries, combining experimental
  and computational methods.
