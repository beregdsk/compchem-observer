description: 'The Theoretical Quantum Dynamics and Quantum Electrodynamics
  division at the Max Planck Institute for Nuclear Physics conducts theoretical
  research across three main fields: precision studies with ions and nuclei,
  X-ray quantum dynamics with atoms, ions and nuclei, and extremely intense
  laser interactions with fundamental quantum systems. Research groups cover
  ionic quantum dynamics and high-precision theory, exotic quantum systems,
  correlated and X-ray quantum dynamics, relativic and ultrashort quantum
  dynamics, extreme field quantum plasma dynamics, and high-energy quantum
  electrodynamics.'
