description: The Research Group on Quantum Chemistry of Conjugated Systems
  (SISCON) focuses on the theoretical and computational study of conjugated
  organic oligomers and polymers for optoelectronic applications. Utilizing a
  range of quantum-chemical methods, including semi-empirical, DFT, and ab
  initio approaches, the group investigates structure-property relationships,
  molecular and electronic structures, optical properties, and excited-state
  phenomena to guide the rational design of advanced organic materials for
  devices like LEDs, lasers, and photovoltaic cells.
