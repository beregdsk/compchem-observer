description: The Functional Organic Synthesis Group (FunOS) at RMIT University
  focuses on designing and synthesising functional organic molecules for
  therapeutic applications and sustainable energy technologies. Their research
  integrates synthetic organic chemistry, molecular design, and materials
  innovation to develop next-generation therapeutics for neurodegenerative
  diseases and cancer, alongside redox-active materials for flow batteries.
