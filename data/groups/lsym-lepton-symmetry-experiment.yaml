description: The LSym (Lepton Symmetry Experiment) is an independent research
  group at the Max Planck Institute for Nuclear Physics in Heidelberg, led by PD
  Dr. Sven Sturm. The group conducts high-precision fundamental physics
  experiments comparing electrons and positrons in a Penning trap to test
  matter-antimatter symmetry and search for new physics beyond the Standard
  Model.
