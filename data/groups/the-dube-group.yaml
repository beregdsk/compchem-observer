description: The Dube Group is a research group led by Henry Dube, based at the
  Department of Chemistry and Pharmacy of the Friedrich-Alexander-Universität
  Erlangen-Nürnberg in Erlangen, Germany. The group works on nanotechnology made
  from chemistry and light, focusing on molecular machines, photoswitches,
  photopharmacology, supramolecular chemistry, programmable materials, and
  photochemistry.
