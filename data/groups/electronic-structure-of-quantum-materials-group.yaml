description: The Electronic Structure of Quantum Materials Group, led by Lukasz
  Plucinski, focuses on the electronic and magnetic properties of quantum
  materials. Using high-resolution spin-resolved angle-resolved photoemission
  spectroscopy (ARPES) and circular dichroic photoemission, the group
  reconstructs quantum mechanical wave functions to study quantum geometric
  tensors, magnetic topological materials, and few-atom-thick layers. Their work
  combines advanced experimental techniques with multiple-scattering theory.
