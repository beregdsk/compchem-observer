description: The XSoLaS research group at Stockholm University, Department of
  Physics, specializes in X-ray scattering, spectroscopy, and photoelectron
  spectroscopy. Their research investigates surface chemical bonding, ultrafast
  science, heterogeneous and electrocatalysis, photocatalysis, and the structure
  and dynamics of water and aqueous solutions.
