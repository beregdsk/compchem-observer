description: The Quantum Computing and Simulation Centre (QCS) is a research
  centre at the University of West Bohemia focused on the development and
  implementation of quantum algorithms and simulations for science, research,
  and industry. It bridges theoretical and experimental research in quantum
  materials with quantum computing, applying these methods to optimization,
  machine learning, and finance, while also promoting education and outreach in
  quantum technologies.
