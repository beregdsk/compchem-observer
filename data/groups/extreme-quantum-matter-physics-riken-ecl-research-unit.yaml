description: The Extreme Quantum Matter Physics RIKEN ECL Research Unit, led by
  Unit Leader Yukako Fujishiro, is a research group within the RIKEN Center for
  Emergent Matter Science. The unit investigates emergent phenomena in magnetic
  topological materials and strongly correlated electron systems under extreme
  conditions, employing microfabrication techniques on single crystalline
  quantum materials to study ultra-high pressure responses, magnetization
  dynamics, and ion intercalation.
