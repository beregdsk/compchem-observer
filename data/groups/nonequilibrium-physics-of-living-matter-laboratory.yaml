description: The Nonequilibrium Physics of Living Matter Laboratory is a
  biophysics research group at RIKEN led by Chief Scientist Kyogo Kawaguchi. The
  lab explores phase transitions, morphogenesis, evolution, and chromatin
  physics using experimental and theoretical approaches, integrating physics,
  machine learning, and techniques from cell-based assays to single-molecule
  observation.
