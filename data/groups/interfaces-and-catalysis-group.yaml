description: The Interfaces and Catalysis Group at Aarhus University, headed by
  Professor Jeppe V. Lauritsen, investigates the fundamental physics and
  chemistry of surfaces. The group focuses on surface reactivity, catalysis, and
  electrocatalysis for energy applications, using advanced characterization
  tools to understand the catalytic properties of nanoparticles and
  nanostructures at the atomic scale.
