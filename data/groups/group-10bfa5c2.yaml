description: The RIKEN Hakubi Research Team led by Dr. Ryusuke Hamazaki
  investigates non-equilibrium quantum statistical mechanics, focusing on
  macroscopic non-equilibrium phenomena from microscopic quantum mechanics. They
  study thermalization in isolated quantum systems, open quantum systems,
  quantum dynamics, and information theory to understand and control
  non-equilibrium states, contributing to physics, biology, and information
  science.
