description: The Quantum Materials and Extreme Conditions group is a materials
  chemistry research unit at Aarhus University's Department of Chemistry. The
  group focuses on the discovery of novel functional materials through
  high-pressure solid-state chemistry, operating advanced equipment like
  multi-anvil presses and diamond anvil cells to synthesize materials under
  extreme conditions. Their research investigates structure-property
  relationships in perovskites, pyrochlores, and topological insulators, with
  support from major Danish research foundations and affiliation with the Center
