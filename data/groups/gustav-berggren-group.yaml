description: The Gustav Berggren group, based at the Department of Chemistry -
  Ångström Laboratory at Uppsala University, is a bioinorganic chemistry
  research team led by Gustav Berggren. They study metalloenzymes, particularly
  [FeFe]-hydrogenases, to understand biological electron and proton transfer,
  aiming to develop biohybrid and bioinspired systems for semi-artificial
  photosynthesis and sustainable solar fuel production.
