description: The Drug Discovery Computational Chemistry Platform Unit at the
  RIKEN Center for Integrative Medical Sciences, led by Teruki Honma, is a
  research group focusing on computational drug discovery. They use in silico
  screening, structure-based drug design, machine learning, and quantum chemical
  methods like the fragment molecular orbital method to optimize compound
  design, activity, and ADMET properties.
