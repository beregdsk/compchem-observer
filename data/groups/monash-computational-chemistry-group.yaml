description: The Monash Computational Chemistry Group, led by Professor
  Ekaterina (Katya) Pas, assesses and develops cost-effective quantum chemical
  methods (ab initio and DFT) for studying condensed-phase systems such as
  molecular crystals and ionic liquids, and pursues accurate ab initio molecular
  dynamics simulations to predict properties and reaction mechanisms (including
  proton and electron transfer), with applications in energy devices, gas
  capture, and pharmaceuticals, and using machine learning to predict molecular
  properties.
