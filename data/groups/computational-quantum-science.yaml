description: The Research Group Computational Quantum Science, led by Prof. Dr.
  Sabine Andergassen at the Vienna University of Technology, focuses on quantum
  many-body physics. The group investigates strongly correlated electron
  systems, materials, and nanostructures using advanced numerical methods like
  the functional renormalization group and cellular dynamical mean-field theory,
  combined with machine learning techniques to analyze complex quantum
  correlations and electronic properties.
