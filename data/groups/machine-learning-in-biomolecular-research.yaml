description: This research group, led by Dominik Gront at the Faculty of
  Chemistry, University of Warsaw, focuses on the application of machine
  learning to biomolecular modeling. Their research includes coarse-grained
  biopolymer simulation, classification of P450 enzymes via the P450 Atlas,
  protein structure prediction, and developing generative AI for polypeptide
  conformations.
