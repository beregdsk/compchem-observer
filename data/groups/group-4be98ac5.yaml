description: The Topological Electronics Research Team, led by Team Director
  Minoru Kawamura at the Center for Emergent Matter Science, RIKEN, conducts
  experimental research on quantum transport phenomena in solid-state electronic
  systems. Focusing on thin films and heterostructures with strong spin-orbit
  coupling, the team investigates topological insulators, topological
  superconductors, and the anomalous Hall effect to discover new quantum
  phenomena and develop advanced electronics and spintronics applications.
