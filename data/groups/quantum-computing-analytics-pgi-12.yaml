description: Quantum Computing Analytics (PGI-12) is an institute at
  Forschungszentrum Jülich in Jülich, Germany, dedicated to theoretical and
  numerical research in quantum computing, quantum algorithms, quantum
  information, relativistic quantum information, and quantum technologies.
  Founded in 2020, it hosts several groups working on quantum simulation,
  algorithms, and device theory.
