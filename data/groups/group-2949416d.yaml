description: The Low-dimensional Quantum Phase Research Unit, led by Takuro
  Sato, investigates low-dimensional quantum systems such as organic molecular
  conductors and two-dimensional materials. The unit focuses on breaking spatial
  and temporal symmetries to design novel devices, exploring emergent quantum
  phases, topological spin textures like skyrmions, and strongly correlated
  electronic states.
