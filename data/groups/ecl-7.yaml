description: This unit, led by Rina Tazai at RIKEN, conducts theoretical and
  computational research on strongly correlated electron systems in solid
  materials like superconductors and magnets. By analyzing microscopic
  electronic models, the group seeks to discover new electronic states, quantum
  phase transitions, and transport phenomena, facilitating collaboration between
  theory and experiment.
