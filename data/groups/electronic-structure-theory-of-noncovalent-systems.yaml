description: The research group 'Electronic structure theory of noncovalent
  systems' at the Faculty of Chemistry, University of Warsaw, led by Prof.
  Grzegorz Chałasiński, focuses on developing novel electronic structure methods
  for ground- and excited-state molecular systems bound by noncovalent
  interactions. They work on wave function approaches, density functional
  theory, symmetry-adapted perturbation theory (SAPT), and coupled-cluster
  methods for molecular crystals.
