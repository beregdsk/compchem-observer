description: The Kristoffer Almdal Group at DTU Chemistry focuses on the design
  and synthesis of polymer molecules to address challenges in materials science.
  The group specializes in artificial self-organization, studying self-assembly
  in soft matter using block copolymers, and employs advanced 3D printing
  techniques to create structured materials for biomedical and soft robotic
  applications.
