description: The Theoretical Ultrafast X-ray Science (TUXS) group at DESY
  studies fundamental interactions of ultrashort high-intensity x-ray
  free-electron laser pulses with matter, developing novel nonlinear x-ray
  spectroscopic and imaging techniques to probe electronic and nuclear degrees
  of freedom. The group investigates stimulated x-ray emission processes, x-ray
  amplification on inner-shell electronic transitions for sub-femtosecond pulses
  and ultrabright x-ray lasers, and parametric nonlinear optical x-ray processes
  in crystals.
