description: The research group 'Medicinal Chemistry - Natural products’
  inspired molecules' focuses on the design and synthesis of bioactive small
  molecules as potential drug candidates, based on oxa- and azaheterocyclic
  scaffolds related to natural compounds like flavonoids and coumarins. Research
  targets include neurodegenerative disorders, tumor progression, and tropical
  parasitic diseases.
