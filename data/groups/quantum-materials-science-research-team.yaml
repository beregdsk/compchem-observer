description: The Quantum Materials Science Research Team at RIKEN focuses on
  thin films and stacked interfaces of quantum materials. The team works on
  establishing thin-film fabrication technologies for topological electronic
  states, exploring novel quantum materials, and clarifying the origins of their
  unique properties to develop low-power-consumption devices. Their research
  spans superconductivity, quantum transport, and magnetic devices.
