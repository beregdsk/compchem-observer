description: The research group 'Low Temperature Scanning Probe Microscopy', led
  by Prof. Dr. Ruslan Temirov, focuses on advancing scanning probe microscopy
  (SPM) as a versatile tool for manipulating nanoscale quantum bits on surfaces.
  Their key research areas include millikelvin STM with magnetic cooling,
  fabrication of atomic-scale quantum structures, scanning quantum dot
  microscopy (SQDM), and high-resolution SPM with functionalised tips.
