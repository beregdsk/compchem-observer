description: The Research Group on Coordination Chemistry (GCC) is a PI-led team
  based at the Institute of Molecular Science (ICMol) of the University of
  Valencia. The group specializes in the programmed synthesis, design, and
  characterization of mono- and polynuclear coordination compounds with
  predefined crystal structures and spin topologies. Their research focuses on
  multifunctional molecular-based materials, including molecular magnets,
  photomagnetic switches, and multiferroics, utilizing DFT and Monte Carlo
  theoretical calculations to model magnetic properties. They also design
