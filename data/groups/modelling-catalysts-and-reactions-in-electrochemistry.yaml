description: This group at the Max-Planck-Institut für Kohlenforschung focuses
  on the computational modeling of electrochemical reactions, such as the oxygen
  reduction and oxygen evolution reactions. Using electronic structure methods,
  the team investigates platinum nanoparticles on carbon supports to support
  experimental efforts in designing more efficient and durable catalysts for
  energy conversion.
