description: The Quantum Computing Systems Integration and Analysis Group at
  PGI-12 supports the integration of quantum computing components from partners
  using system engineering methods from the aerospace industry. The group works
  on technology development, quantum computing use cases for manufacturing,
  quantum cryptanalysis, benchmarking, quantum error correction, and NISQ
  computation, while contributing to standards and outreach.
