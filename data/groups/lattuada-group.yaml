description: The Lattuada Group, led by Prof. Marco Lattuada, designs and
  synthesizes nano- and microparticles with complex patterns to create advanced
  materials via self-assembly. Key research areas include Janus and patchy
  particles for Pickering emulsions and nanomotors, superparamagnetic
  nanoparticles for magnetic control of composites, and stimuli-responsive
  particles mimicking structural coloration. Particle simulations, including
  Monte-Carlo and Brownian Dynamics, guide experimental work.
