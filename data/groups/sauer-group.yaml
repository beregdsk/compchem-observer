description: The Sauer Group at the University of Copenhagen develops quantum
  chemical methods and software for HPC and NISQ quantum computers, focusing on
  calculating molecular spectra (UV/Vis, NMR, ESR, etc.) and electromagnetic
  properties. They benchmark DFT and wavefunction methods, assist
  experimentalists, and study solvent effects and radiation damage.
