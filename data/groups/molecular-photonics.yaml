description: The Molecular Photonics group at the Van 't Hoff Institute for
  Molecular Sciences (HIMS) at the University of Amsterdam is led by professors
  Wybren Jan Buma and Fred Brouwer. The group focuses on advancing the
  understanding of excited-state dynamics in molecules and nano-sized objects,
  combining molecular synthesis, spectroscopy, and theoretical approaches to
  explore light-induced chemical processes and design novel functional
  molecules.
