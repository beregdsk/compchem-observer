description: The Quantum Simulation Algorithms group, led by Dr. Dmitry Bagrets
  at the Peter Grünberg Institute (PGI-12) in Jülich, focuses on the
  intersection of many-body physics and quantum information science. The group
  explores digital quantum circuits to simulate strongly correlated states of
  light and matter, with research interests in the 2D Hubbard model, quantum
  chemistry, light-matter interaction, topological states, and quantum-classical
  optimization.
