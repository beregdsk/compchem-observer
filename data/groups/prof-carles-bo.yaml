description: The research group led by Prof. Carles Bo at ICIQ develops and
  applies computational methods, including density functional theory (DFT) and
  molecular dynamics simulations, to study chemical reactivity and catalysis.
  Work covers reaction mechanisms of transition-metal catalyzed processes,
  organo-catalytic reactions, CO2 fixation strategies, and polyoxometalate
  chemistry, providing new understanding of reaction mechanisms and predicting
  properties of complex systems in solution.
