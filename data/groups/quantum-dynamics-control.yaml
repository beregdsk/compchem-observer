description: The Quantum Dynamics & Control division, led by Prof. Dr. Thomas
  Pfeifer at the Max Planck Institute for Nuclear Physics in Heidelberg,
  investigates the ultrafast dynamical quantum world. Their research focuses on
  using intense, bright light and multi-dimensional measurement techniques to
  explore the fastest motions, the transition from quantum to classical motion,
  and the control of atomic and molecular dynamics in strong fields.
