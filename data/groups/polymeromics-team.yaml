description: The Polymeromics Team at RIKEN's TRIP Headquarters, led by Director
  Ryo Yoshida, develops foundation models for polymer material systems by
  integrating large-scale experimental and computational databases. They
  automate molecular dynamics simulations and first-principles calculations to
  build massive polymer databases, applying Sim2Real machine learning and
  AI-driven robotics for autonomous polymer material discovery.
