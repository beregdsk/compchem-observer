description: The Sonia Coriani Group, based at the Department of Chemistry of
  the Technical University of Denmark (DTU) in Kongens Lyngby, Denmark, is a
  research group focused on the development and application of advanced
  electronic-structure methods. The group's work spans computational
  spectroscopy, photochemistry, quantum dynamics, and the exploration of quantum
  computing for quantum chemistry. They pioneer methods like coupled cluster
  theory for X-ray spectroscopy and damped response theory for various
  spectroscopic effects, aiming to bridge theoretical chemistry and experimental
  research.
