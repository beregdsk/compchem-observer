description: The Computational Biomolecular Dynamics group at the Max Planck
  Institute for Multidisciplinary Sciences, led by Bert de Groot, focuses on
  using advanced computer simulations to study biomolecular processes at the
  atomic level. Their research investigates cellular regulation mechanisms,
  molecular recognition in signal transduction, and protein aggregation
  diseases. Key areas include permeation in membrane channels like aquaporin and
  gramicidin, collective enzyme motions, and development of novel simulation
  methods to access longer timescales. The group's work bridges computational
  chemistry…
