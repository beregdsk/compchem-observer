description: The Switchable Molecular Materials (SMolMat) research group, based
  at the Universitat de València, focuses on the synthesis, characterisation,
  and processing of molecular compounds that switch between electronic states.
  Their work aims to develop new functional materials for molecular switches,
  sensors, memories, and opto-electronic devices. Key research lines include
  bistable porous coordination polymers, spin crossover in liquid crystals,
  bistable luminescent materials, and multi-stable spin crossover complexes.
