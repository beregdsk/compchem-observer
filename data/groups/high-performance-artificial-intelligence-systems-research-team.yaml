description: The High Performance Artificial Intelligence Systems Research Team
  at RIKEN Center for Computational Science (R-CCS) focuses on the convergence
  of high-performance computing (HPC) and artificial intelligence (AI). Led by
  Team Principal Mohamed Wahib, the team conducts research on extreme
  scalability of deep learning, performance analysis and modeling of AI systems,
  acceleration of modern AI algorithms, and intelligent programming systems to
  adapt to advanced hardware architectures.
