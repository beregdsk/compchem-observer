description: The research group 'Photoemission Tomography and Quantum Dynamics',
  led by Prof. Dr. Frank Stefan Tautz at the Peter Grünberg Institute (PGI-3),
  investigates the electronic structure and quantum dynamics of molecules at
  surfaces. Using momentum microscopy and time-resolved photoemission orbital
  tomography, they image molecular orbitals, reconstruct wave functions
  including their quantum phase, and trace ultrafast electron transfer
  processes.
