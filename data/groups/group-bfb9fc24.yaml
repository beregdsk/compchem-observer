description: This page introduces the Superconducting Quantum Electronics
  Collaborative Research Unit at RIKEN's Quantum Computing Research Center, led
  by Eisuke Abe. The unit conducts research on quantum technologies using
  superconducting devices, focusing on the development of multi-qubit
  superconducting quantum computers. They implement functions for coherent
  control and non-destructive measurement of quantum states using microwaves on
  superconducting quantum circuits, aiming to bring quantum computers closer to
  practical realization.
