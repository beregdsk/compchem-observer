description: Theoretical chemistry group at UNSW Canberra in the School of
  Science, led by Terry Frankcombe and Clifford Woodward. Research spans
  accurate quantum dynamics methodology, gas-surface chemistry and heterogeneous
  catalysis, DFT modelling of condensed-phase systems, soft condensed matter,
  ionic liquids and biological membranes, materials defect engineering for
  colossal-permittivity dielectrics, energetic materials and propellants, and
  fundamental electronic structure. The work is large-scale and primarily
  computational.
