description: The Data Assimilation Research Team at RIKEN Center for
  Computational Science (R-CCS), led by Team Principal Takemasa Miyoshi, focuses
  on the theoretical and algorithmic development of advanced data assimilation
  methods. The team utilizes world-leading supercomputers like Fugaku and the K
  computer to integrate massive real-world observational data with large-scale
  simulations, aiming to improve predictions of severe weather events, natural
  disasters, and other complex environmental phenomena.
