description: The Raymond and Beverly Sackler Center for Computational Molecular
  and Materials Science at Tel Aviv University is an interdisciplinary research
  center bringing together multiple research groups in theoretical and
  computational chemistry and physics. Hosted at Tel Aviv University, the center
  includes the group of Prof. Michael Urbakh and focuses on the theoretical
  study of nanoscale systems, molecular friction, quantum dynamics, soft matter,
  and electrochemical interfaces using first-principles methods, molecular
  dynamics, and advanced sampling techniques.
