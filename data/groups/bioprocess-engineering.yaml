description: The Bioprocess Engineering group, headed by Prof. em. Dr.-Ing. Udo
  Reichl, is located at the Max Planck Institute for Dynamics of Complex
  Technical Systems in Magdeburg. The group focuses on utilizing microorganisms
  and cell culture technologies to produce biological products, such as proteins
  and vaccines. Their research covers upstream and downstream processing,
  synthetic biotechnology, and bioanalytics, with a strong emphasis on
  mathematical modeling of metabolic pathways, regulatory networks, and cellular
  behavior to optimize bioprocesses.
