description: The Stamou Lab, part of the Nano Chemistry division at the
  University of Copenhagen, develops disruptive nanoscale technologies to study
  membranes and membrane proteins using single-molecule fluorescence microscopy.
  The lab investigates membrane curvature, G protein coupled receptors, and
  transporters, bridging the gap between biology, physics, and nanotechnology.
