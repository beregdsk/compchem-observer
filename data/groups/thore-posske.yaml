description: The research group led by Dr. Thore Posske at the I. Institute of
  Theoretical Physics, University of Hamburg, focuses on topological properties
  in condensed matter physics. Their research targets spin systems, anyons, and
  Majorana fermions to advance quantum technologies and quantum computing,
  alongside work on the Kondo effect and hybrid topological systems.
