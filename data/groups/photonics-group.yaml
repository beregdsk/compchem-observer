description: The Photonics Group at the Institute of Physics, Lodz University of
  Technology, specializes in computer simulation and modeling of physical
  phenomena in photonic structures, particularly semiconductor lasers and LEDs.
  Their research encompasses optical, electrical, thermal, gain, and mechanical
  aspects, with applications in edge-emitting and surface-emitting devices,
  laser arrays, and optimization of performance and reliability.
