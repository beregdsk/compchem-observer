description: The Chair of Numerical Modelling and Simulation (MNS) at EPFL, led
  by Prof. Annalisa Buffa, focuses on the design and analysis of numerical
  algorithms for partial differential equations. The group aims to preserve
  mathematical structures at the discrete level to achieve numerical accuracy
  and stability, bridging numerical simulations with geometric modelling and
  processing. Research applications span from elasticity to electromagnetic
  problems.
