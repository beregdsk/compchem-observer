description: The Chiba Metabolic Environmental Enzyme RIKEN ECL Research Unit,
  led by Yoko Chiba, aims to clarify the design principles of metabolism through
  comparative analysis of metabolic pathways and enzymes in diverse organisms,
  including non-model microbes. By studying enzyme kinetics and thermodynamic
  principles, the unit seeks to understand how metabolic mechanisms have
  sustained life for billions of years and how this knowledge can support
  sustainable human societies.
