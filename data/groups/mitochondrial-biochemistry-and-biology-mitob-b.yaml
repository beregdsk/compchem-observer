description: The Mitochondrial Biochemistry and Biology (MitoB&B) research
  group, coordinated by Anna Maria Porcelli at the Department of Pharmacy and
  Biotechnology of the University of Bologna, focuses on understanding the
  biochemical mechanisms and molecular signals associated with mitochondrial
  alterations in human diseases, particularly cancer and neuroscience. Their
  research aims to define the role of mitochondrial metabolism in modulating
  tumorigenesis, study the structural and functional organization of respiratory
