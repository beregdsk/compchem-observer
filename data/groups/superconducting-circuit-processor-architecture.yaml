description: The research group Superconducting Circuit Processor Architecture,
  part of the Quantum Control division at the Peter Grünberg Institute (PGI) of
  Forschungszentrum Jülich, focuses on strategies for implementing, controlling,
  and optimizing quantum operations on noisy intermediate-scale quantum devices
  based on circuit quantum electrodynamics. They work on characterising errors,
  developing correction strategies, and utilizing automated circuit discovery,
  machine learning, and advanced numerical methods to improve quantum gates and
  compilation.
