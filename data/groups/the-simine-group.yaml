description: The Simine group at McGill University focuses on the theory of
  strongly disordered molecular systems. They combine traditional simulation
  techniques with machine learning to model nano- to meso-scale systems, aiming
  to discover new properties and applications in nano- and bio-tech for
  disordered materials ranging from amorphous graphene to synthetic biological
  sequences.
