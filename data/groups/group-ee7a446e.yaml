description: The Quantum Computing System Design Research Team, led by Director
  Yasunari Suzuki at RIKEN's Quantum Computer Research Center, focuses on the
  system design, software development, and architecture of practical, scalable
  quantum computers. The team explores quantum error mitigation, fault-tolerant
  computing architectures, and high-performance quantum circuit simulators to
  accelerate the realization of advanced quantum computing systems.
