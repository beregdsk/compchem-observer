description: The Computational Materials Science Research Team at RIKEN develops
  state-of-the-art numerical methods such as quantum Monte Carlo and tensor
  network methods, including the density matrix renormalization method, to
  simulate ground states and quantum dynamics of strongly correlated quantum
  systems. The team also develops quantum algorithms for quantum many-body
  systems and runs quantum computing simulations on classical supercomputers
  such as Fugaku.
