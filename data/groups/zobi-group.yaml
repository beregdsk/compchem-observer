description: The Zobi Group at the University of Fribourg, led by Prof. Fabio
  Zobi, works at the interface of inorganic chemistry, organometallic chemistry,
  medicinal chemistry, chemical biology, and biology. The group's research
  covers medicinal inorganic and organometallic chemistry, focusing on the
  preparation, characterization, and application of metal-based complexes and
  the surface functionalization of bio-inspired materials. They also develop new
  imaging techniques and identify clinically useful compounds to ameliorate
  human pathologies.
