description: The Research Group on Modulatable Multifunctional Molecular
  Materials (M4) at the University of Valencia designs, synthesizes, and
  characterizes novel molecular materials with combined electrical, magnetic,
  and optical properties. Focusing on coordination chemistry, the group develops
  modulable conductors, superconductors, single-molecule magnets, spin-crossover
  systems, and porous materials for chemical sensing, aiming to create advanced
  multifunctional devices.
