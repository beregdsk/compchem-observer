description: The Thapper group, led by Anders Thapper at the Department of
  Chemistry - Ångström Laboratory, Uppsala University, focuses on artificial
  photosynthesis and bioinorganic chemistry. Their research involves
  synthesizing transition metal complexes as catalysts for water oxidation,
  developing photocatalytic systems for solar fuel production, and creating
  iron-manganese complexes as biomimetic models for dimetal-carboxylate
  proteins.
