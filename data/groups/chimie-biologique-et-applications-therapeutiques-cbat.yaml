description: The CBAT team is a research group at the Institut de Chimie de
  Strasbourg, University of Strasbourg, specializing in proteins with
  therapeutic potential, particularly antibacterial agents. Combining bioorganic
  chemistry, enzymology, and microbiology, the group investigates metalloenzyme
  mechanisms, inhibitor development, and spectroscopic characterization. Their
  research includes structure-based and fragment-based drug design, virtual
  screening, and target identification to combat antibiotic resistance.
