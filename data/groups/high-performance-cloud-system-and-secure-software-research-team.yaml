description: The High-Performance Cloud System and Secure Software Research
  Team, led by Atsuko Takefusa, focuses on developing cloud and HPC integrated
  computing infrastructure and secure software for high-performance computing.
  Their research includes adapting cloud-native technologies like virtualization
  and containers to HPC, integrating cloud services with scientific computing,
  and implementing trusted execution environments (TEE) to enhance security in
  HPC systems.
