description: The Gulliver laboratory is a research group at ESPCI Paris working
  at the interface of physics, chemistry, biology, and computer science. The lab
  combines theoretical and experimental approaches to study soft matter, active
  matter, and molecular systems, focusing on topology, self-assembly,
  interfaces, and collective behavior.
