description: 'The Condensed Matter and Materials Physics research group at the
  University of York creates and studies advanced materials and nanostructures
  using experimental, theoretical, and computational techniques. The scope of
  their work is broad, ranging from materials design and theoretical modelling
  to materials synthesis and device fabrication, with a special focus on
  nanoscale characterisation and methods development. Their expertise is applied
  to three key areas: electronic structure and microscopy, photonics, and
  spintronics and magnetism.'
