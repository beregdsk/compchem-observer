description: The Chimie et Systémique Organo-Métalliques (LCSOM) is a research
  group at the Institut de Chimie de Strasbourg (UMR 7177, CNRS/University of
  Strasbourg), founded in 2014. Led by Jean-Pierre Djukic, the group focuses on
  experimental and theoretical organometallic chemistry of transition metals,
  particularly metallacycles, catalysis (including multicomponent and tandem
  catalysis), DFT modeling, green chemistry, and bio-organometallic chemistry
  for cancer therapy.
