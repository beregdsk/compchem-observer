description: The Structural Biology Group at the Faculty of Chemistry,
  University of Warsaw, led by Maria Górna, studies protein structures and
  functions using cryo-EM and crystallography. Their work focuses on RNA
  metabolism, antiviral mechanisms, targeted protein degradation, and drug
  development against infectious and inflammatory diseases.
