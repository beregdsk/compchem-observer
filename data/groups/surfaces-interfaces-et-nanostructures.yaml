description: The SIN (Surfaces, Interfaces et Nanostructures) team at Institut
  Néel investigates the structural, magnetic, and electronic properties of
  low-dimensional systems like thin films, nanostructures, surfaces, and
  interfaces. Their research covers nanosystems for magnetism, magnetic
  heterostructures, skyrmions, and (electro)-catalysis. They also develop ab
  initio theoretical methods and software, notably the FDMNES code for X-ray
  spectroscopies, utilizing advanced synchrotron and laboratory techniques such
  as STM, MBE, and LEED.
