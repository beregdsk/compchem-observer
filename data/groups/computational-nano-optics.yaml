description: The Computational Nano Optics research group at Zuse Institute
  Berlin focuses on the investigation and application of numerical methods for
  simulating light-matter interactions on the nanoscale, with an emphasis on
  adaptive finite-element methods for solving Maxwell's equations. Their work
  includes applications in metamaterials, plasmonics, photovoltaics, optical
  nano-metrology, and nano-lasers, bridging mathematics, physics, and
  engineering.
