description: The Ball Group at the School of Chemistry, UNSW Sydney, focuses on
  the innovative use of NMR spectroscopy to investigate chemical problems in
  inorganic and organometallic chemistry. Their research utilizes in situ
  photochemistry coupled with NMR to generate and characterize reactive
  intermediates, and increasingly employs computational methods like DFT, ab
  initio, and molecular mechanics to support experimental findings and guide new
  directions.
