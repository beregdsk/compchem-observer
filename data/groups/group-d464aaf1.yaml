description: This team at RIKEN's Center for Emergent Matter Science, led by
  Director Yoshinori Tokura, investigates quantum transport phenomena in thin
  films, heterointerfaces, and bulk materials. Their research focuses on
  spin-orbit interactions in systems with broken inversion symmetry, electron
  conduction in non-trivial spin structures, and unconventional superconductors
  under high pressure and terahertz response. They study strongly correlated
  electron systems, giant magnetoresistance, high-temperature superconductors,
  multiferroics, and topological insulators.
