description: The Quantum Molecular Science Research Team (量子系分子科学研究チーム) is a
  research group within the RIKEN Center for Computational Science (R-CCS),
  based in Kobe, Japan. Led by Team Principal Takahito Nakajima, the team
  focuses on theoretical and computational molecular science, aiming to clarify
  and predict the properties and functions of complex molecular systems, such as
  energy materials and biomolecules, using supercomputers like Fugaku. Their
  work includes the development of the highly parallel quantum chemistry
