description: The Hammarström group, led by Leif Hammarström at Uppsala
  University, focuses on fundamental mechanistic studies related to artificial
  photosynthesis and photoredox catalysis. They use laser-spectroscopy,
  photochemical, and electrochemical methods to study photoinduced and
  proton-coupled electron transfer, catalytic pathways for solar fuel
  production, and dye-sensitized solar cells.
