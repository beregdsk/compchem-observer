description: The Max Planck Institute for the Physics of Complex Systems in
  Dresden researches complex systems — condensed matter, quantum materials, and
  biological physics — using theoretical and computational methods to understand
  quantum phenomena, pattern formation, and emergent behavior. Physicists
  develop theories for these phenomena in solids and in individual atoms,
  molecules, and small atom groups interacting with light, and seek the physical
  principles of cell division and transport in biological cells, as these
  diverse systems share common principles.
