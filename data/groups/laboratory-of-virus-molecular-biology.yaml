description: The Laboratory of Virus Molecular Biology is a research group based
  at the Intercollegiate Faculty of Biotechnology UG&MUG in Gdańsk, Poland,
  headed by Prof. Krystyna Bieńkowska-Szewczyk. The group's research focuses on
  the structure and function of herpesvirus and Hepatitis C virus proteins,
  mechanisms of viral cell-to-cell spread, viral immune evasion, and the
  construction of viral vectors for research and vaccine applications. Their
  research activities incorporate computational and theoretical approaches, such
