description: The Quantum Computational Science Research Team at RIKEN's Quantum
  Computer Research Center, directed by Seiji Yunoki, aims to realize quantum
  simulations of quantum many-body systems using quantum computers. The team
  focuses on developing quantum-classical hybrid algorithms, simulating quantum
  computing on classical supercomputers like Fugaku, and analyzing quantum
  information and dynamics in quantum circuits.
