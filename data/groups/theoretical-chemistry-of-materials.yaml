description: The Harrowell Group, led by Professor Peter Harrowell at the
  University of Sydney, focuses on the theoretical chemistry of materials. Their
  research centers on using computer modelling to understand order and dynamics
  in liquids and solids, with projects on vapour deposition of amorphous
  mixtures, jammed solids, and entropic control of crystal growth.
