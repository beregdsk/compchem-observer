description: The European Chemical Society (EuChemS) is a European non-profit
  organisation promoting collaboration between scientific and technical
  societies in chemistry. Based in Brussels, it represents over 160,000 chemists
  across Europe, provides scientific policy advice, and organises various
  divisions and working parties, including computational chemistry.
