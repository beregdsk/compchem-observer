description: The webpage is the official homepage of the Large-scale Parallel
  Numerical Computing Technology Research Team at the RIKEN Center for
  Computational Science (R-CCS). Led by Team Principal Toshiyuki Imamura, the
  team focuses on the research and development of highly parallel,
  high-performance numerical software libraries, such as KMathLIB and EigenExa,
  for supercomputers like Fugaku. Their work concentrates on parallel
  algorithms, numerical linear algebra, and mixed-precision computing.
