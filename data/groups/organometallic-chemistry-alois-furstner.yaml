description: The research group led by Alois Fürstner at the Max Planck
  Institute for Coal Research focuses on organometallic chemistry and
  homogeneous catalysis. Their work centers on developing novel catalytic
  methods for C-C bond formation, such as alkyne and alkene metathesis, pi-acid
  catalysis, and iron catalysis, and applying these methods to the total
  synthesis of structurally complex natural products and pharmaceutically active
  compounds.
