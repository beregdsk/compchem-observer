description: The page presents the Laboratory of Bioinorganic Chemistry at the
  Department of Pharmacy and Biotechnology (FABIT) of the University of Bologna,
  coordinated by Stefano Ciurli. The group focuses on the structural and
  functional characterization of metalloenzymes like urease, viral proteases,
  and nickel-binding proteins. Their research integrates experimental and
  computational approaches for drug design, inhibitor development, and
  biomolecular simulation to address challenges in human health and
  environmental biotechnology.
