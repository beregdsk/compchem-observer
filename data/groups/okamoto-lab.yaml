description: The Okamoto lab is a research group at the Department of Cell and
  Molecular Biology, Uppsala University, led by PI Kenta Okamoto. The lab
  focuses on structural virology and molecular biophysics, utilizing
  cryo-electron microscopy, X-ray scattering, and computational modeling to
  investigate the structural evolution, assembly, and function of pathogenic and
  giant viruses.
