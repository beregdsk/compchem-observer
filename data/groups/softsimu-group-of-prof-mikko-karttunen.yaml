description: This is the official homepage of the SoftSimu group, led by Prof.
  Mikko Karttunen, focusing on the interface of condensed matter physics,
  biology, and biomedical sciences. The group performs large-scale computer
  simulations, multiscale modeling of biological systems, lipid membranes, and
  proteins, while developing AI/ML and GPU-based computational methods. They are
  based at the University of Eastern Finland, with additional ties to the ELLIS
  Institute Finland at Aalto University.
