description: The Analytical Chemistry & Chemometrics research group (AC&C) at
  Radboud University focuses on chemometrics, extracting relevant information
  from chemical data. Their research spans methodological chemometrics, such as
  multivariate statistics and global optimisation, and application-oriented
  projects using spectroscopic analysis, image processing, and data science for
  industrial and medical fields, alongside teaching and internship programs.
