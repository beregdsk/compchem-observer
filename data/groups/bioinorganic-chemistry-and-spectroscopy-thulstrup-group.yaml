description: The Thulstrup Group at the University of Copenhagen aims to
  understand molecular structure, function and dynamics through optical
  spectroscopy. It characterizes peptides, proteins and nucleic acids using
  absorbance, fluorescence, circular dichroism and mass spectrometry, aided by
  theoretical modelling. Research spans synthesis of siderophore-antibiotic
  conjugates, fluorescent silver nanoclusters, metal‑ion effects on protein
  folding, and molecular orientation in polymers, lipids and liquid crystals.
