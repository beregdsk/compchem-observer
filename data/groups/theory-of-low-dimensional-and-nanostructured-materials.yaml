description: The Nanostructured Materials Group at the Institute of Theoretical
  Physics of the University of Kassel, led by Prof. Dr. G. M. Pastor, focuses on
  the theoretical and computational study of clusters, nanoparticles,
  low-dimensional systems, and nanostructures. Their research interests include
  density functional theory, computational quantum theory of magnetic materials,
  strong electron-correlation phenomena, quantum non-adiabatic dynamics, and
  stochastic dynamics in complex energy landscapes.
