description: The Kamerlin Group is a computational biochemistry research lab at
  the Department of Chemistry for Life Sciences, Uppsala University. Led by Lynn
  Kamerlin, the group develops and applies state-of-the-art computational tools,
  including quantum mechanical, classical mechanical, and hybrid methods, to
  explore enzyme catalysis, catalytic promiscuity, and the evolution of protein
  function at the chemistry-biology interface.
