description: The Institute for Materials Data Science and Informatics (IAS-9)
  develops advanced machine learning and artificial intelligence methods
  tailored to challenges in the physical sciences and engineering. The
  multidisciplinary team bridges data-driven approaches with domain knowledge to
  accelerate simulations, extract insights from complex imaging data, and
  promote FAIR data principles in computational materials science.
