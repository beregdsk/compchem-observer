description: MolSim 2027 is a two-week school focusing on basic and advanced
  molecular simulation methods for PhD candidates and postdocs in physics,
  chemistry, and biology. The program combines lectures and hands-on exercises,
  covering statistical mechanics, Monte Carlo, molecular dynamics, free energy
  calculations, rare events, machine learning, and spectroscopic properties of
  condensed-phase systems. Organized by the Computational Chemistry group at the
  University of Amsterdam, part of the Amsterdam Center for Multiscale
  Modelling, it is an activity of the Dutch node of CECAM (CECAM-NL).
