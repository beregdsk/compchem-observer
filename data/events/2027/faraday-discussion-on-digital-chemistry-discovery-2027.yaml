description: The Faraday Discussion on Digital Chemistry Discovery is an
  international meeting addressing challenges and opportunities in digital
  chemical discovery, spanning computation and experimentation. Topics include
  machine learning, chemical automation and robotics, simulation acceleration,
  generative AI, and accelerated optimisation. Organised by the Royal Society of
  Chemistry, the event features keynote speakers and thematic sessions.
  Abstracts are due by 14 December 2026.
