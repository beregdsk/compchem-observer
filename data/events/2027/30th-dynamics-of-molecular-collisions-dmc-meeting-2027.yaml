description: The 30th Dynamics of Molecular Collisions (DMC) meeting will be
  held July 11-16, 2027, at Asilomar in Pacific Grove, California. The meeting
  brings together experimentalists and theorists in chemical dynamics, featuring
  sessions on bimolecular and interfacial collisions, photodissociation and
  nonadiabatic chemistry, condensed-phase dynamics, quantum control, and cold
  chemistry. Held every other year since 1965, the DMC meeting awards two
  Herschbach Prizes for experiment and theory since 2007. Registration details
  to be announced.
