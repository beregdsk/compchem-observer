description: A week-long residential winter school on open quantum systems and
  quantum information in the chemical sciences, held near Austin, Texas. The
  2027 special topic is quantum optics and cavities, with lectures on quantum
  information, polaritons, tensor network methods, and AI in science. Includes
  hands-on sessions, poster sessions, lodging, and meals on site.
