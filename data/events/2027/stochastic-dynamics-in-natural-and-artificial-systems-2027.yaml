description: CECAM Flagship Workshop on Stochastic Dynamics in Natural and
  Artificial Systems. The workshop will explore recent advances in stochastic
  dynamics, including anomalous diffusion and transport, stochastic processes in
  biology, non-equilibrium statistical mechanics, stochastic resetting, and
  cutting-edge experimental techniques. It aims to bring together researchers to
  discuss open challenges and future directions in this interdisciplinary field.
