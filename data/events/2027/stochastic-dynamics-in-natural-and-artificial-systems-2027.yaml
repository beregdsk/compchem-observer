description: The CECAM Flagship Workshop on Stochastic Dynamics in Natural and
  Artificial Systems, held in Israel from January 11 to 14, 2027. This
  multidisciplinary workshop integrates insights from physics, chemistry,
  biology, and engineering to study stochastic processes, anomalous diffusion,
  non-equilibrium statistical mechanics, and stochastic resetting in biological
  and artificial systems. It aims to bring together researchers to discuss
  theoretical, computational, and experimental advances in these areas.
