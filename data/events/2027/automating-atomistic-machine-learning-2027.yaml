description: This workshop focuses on automating machine-learned interatomic
  potentials (MLIPs) to make them a routine, accessible tool in computational
  materials modelling. It covers integrating MLIPs into automation frameworks,
  tackling challenges like active learning, GPU training, and data provenance.
  Topics include automating data selection, descriptors, and regression. Key
  discussions address which parts of MLIP development should be automated,
  interfacing with DFT infrastructure, the role of pre-trained foundation models
  and AI agents, and future applications.
