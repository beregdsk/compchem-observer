description: The QMMAT27 workshop, held at the CECAM node in Bremen, focuses on
  quantum materials in and out of equilibrium, covering computational and
  experimental advances. Key themes include ultrafast and light-driven
  phenomena, cavity and polaritonic quantum materials, quantum optics, topology,
  strong correlations, and microscopic many-body dynamics.
