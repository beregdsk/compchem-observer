description: >-
  Mini-Symposium: "Electron-Phonon, Exciton-Phonon, and Phonon-Phonon
  Interactions" at the 2027 APS Global Physics Summit


  Dear Colleagues,


  We invite you to submit abstracts for contributed oral presentations to the
  2027 APS Global Physics Summit (April 11-16, 2027, in Atlanta, Georgia)
  mini-symposium “15.01.01 Electron-Phonon, Exciton-Phonon, and Phonon-Phonon
  Interactions” organized by Jenny Coulter, Ivana Savic, and Zhenglu Li.


  If you would like to present your work in this focus session, please submit an
  abstract at https://summit.aps.org/attend/abstracts/, choosing Sorting
  category 15 (DCOMP) and Subcategory 15.01.01.


  The abstract submission deadline is this Thursday, October 22th, 2027.


  We look forward to your contributions and to seeing you in Atlanta,

  Jenny, Ivana, and Zhenglu


  Sponsor: DCOMP


  Sorting Category: 15 General Theory, Computational Physics

  Sub-Category: 15.01.01 Electron-Phonon, Exciton-Phonon, and Phonon-Phonon
  Interactions


  Electron-phonon, exciton-phonon, and phonon-phonon interactions govern a wide
  range of material properties with significant technological relevance. These
  include electrical and thermal transport, ultrafast dynamics of electrons and
  phonons, phonon-mediated superconductivity, temperature-dependent band
  structures, formation of polarons, direct and indirect optical absorption, and
  excitonic effects. This focus session covers both fundamental and applied
  research, encompassing novel physical insights, state-of-the-art
  first-principles methods, algorithmic and software advancements, as well as
  data-driven and machine learning techniques. Contributions are encouraged
  across a broad range of materials systems, including bulk, two-dimensional,
  quantum, and topological materials, with particular emphasis on the interplay
  between electronic, vibrational, and excitonic degrees of freedom.


