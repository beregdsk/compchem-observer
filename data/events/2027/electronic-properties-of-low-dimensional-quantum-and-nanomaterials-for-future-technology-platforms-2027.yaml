description: Serbian-German WE-Heraus seminar on the electronic properties of
  low-dimensional quantum and nanomaterials. Experts discuss Weyl and Dirac
  materials, topological insulators, layered materials, nanowires, quantum dots,
  and moiré systems, whose extreme energy quantization, helicity, chirality, and
  linear energy bands make them candidates for future semiconductor,
  information, and biotechnology platforms. The interdisciplinary workshop aims
  to identify the pathways, challenges, and solutions needed to integrate these
  materials into novel technology platforms.
