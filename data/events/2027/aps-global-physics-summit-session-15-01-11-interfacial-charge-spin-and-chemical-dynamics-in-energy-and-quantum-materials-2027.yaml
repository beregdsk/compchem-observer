description: >-
  Interfacial charge, spin in energy and quantum materials, APS Global Physics
  Summit Apr 11-16 2027, Atlanta, GA, USA


  Dear colleagues,


  I would like to invite you to submit your abstract for the session on
  "Interfacial charge, spin, and chemical dynamics in energy and quantum
  materials" (session 15.01.11) at the 2027 APS Global Physics Summit, to be
  held April 11-16 2027 in Atlanta Georgia, USA. A brief description of the
  Focus Session is below.


  I look forward to seeing you in Atlanta,


  Oliver Monti

  University of Arizona


  A deep understanding of spin, charge and energy transfer across materials
  interfaces is crucial for developing next-generation energy storage and
  conversion systems as well as novel electronic, spintronic and opto-electronic
  devices. These interfaces are the drivers of spin injection, charge
  separation, and charge transfer, which are essential for the functionality of
  the systems and devices. They are inherently complex and evolve under device
  operation, often constituting bottlenecks for device performance and sometimes
  leading to materials degradation and failure. The dynamic evolution of the
  atomic structure at the materials interface coupled with electron dynamics
  governs energy, spin, and charge transport through the interface. Developing
  an understanding of these interfacial dynamics is challenging both for imaging
  and spectroscopy in experiments and for computational simulations due to the
  multiple temporal and spatial scales as well as the types of interactions
  involved.


  This session highlights recent progress in theory and simulation methods and
  their application to modeling dynamics at solid-solid interfaces, including 2D
  materials, topological materials, chirality-induced spin selectivity, and
  solid-gas phase interfaces of relevance to energy and quantum materials, as
  well as experimental studies to be interpreted through or integrated with such
  computational approaches.


  We expect this session to bring together contributions from research on method
  development and its application to the simulations of charge, spin, and
  chemical dynamics and energy, charge, and spin transport through materials
  interfaces, including those of organic and hybrid organic/inorganic structures
  and devices. This session will include theory and method development for
  electron-phonon coupling, spin-orbit interactions, and excited state dynamics
  for solid surfaces and interfaces, and for machine-learning models for
  accelerated prediction of complex interfacial dynamics including non-adiabatic
  processes and quantum coherent phenomena. It will also include experimental
  studies that elucidate the spin and charge dynamics and transport at the
  interfaces.


