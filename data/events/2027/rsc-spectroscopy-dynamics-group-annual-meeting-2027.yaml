description: 'RSC Spectroscopy & Dynamics Group Annual Meeting (SDGM 2027), 6-8
  January 2027, Central Laser Facility, STFC Rutherford Appleton Laboratory,
  Harwell Campus, UK. Three-day conference celebrating 25 years of the
  Spectroscopy and Dynamics interest group and the start of the 50th anniversary
  of the CLF. Focuses on early-career researchers presenting contributed talks
  and posters. Invited speakers: Ruth Signorell, Petr Slavíček, Alice Green,
  Markus Gühr. Includes facility tours and annual quiz. Registration deadline 20
  November 2026.'
