description: Renowned biennial workshop on recent progress in electronic
  structure methods and their applications, bridging the large-scale Psi-k
  conference and smaller single-method workshops. Held at ICTP, Trieste since
  1987 (the series began in 1984), it covers DFT, TDDFT, GW-BSE, DMFT, quantum
  Monte Carlo, DMRG, high-throughput workflows, and machine learning, with a
  focus on challenging applications to complex materials, interfaces, liquids,
  and low-dimensional systems in condensed matter physics, chemistry, and
  materials science.
