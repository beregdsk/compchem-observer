description: 'Workshop on current topics in theoretical chemistry, prioritizing
  areas that enhance fundamental understanding and contribute to academic
  communities in Taiwan and the broader Asian region. It highlights two critical
  fields: density functional theories, addressing fractional charge and spin
  errors; and dynamics simulations for revealing catalysis, solvation, and
  complex processes, including machine-learning-enabled simulations and
  nonadiabatic nuclear-electronic dynamics for coupled electronic-nuclear
  motions. It aims to share advanced research.'
