description: 'The 5th Quantum Frontiers in Molecular Science meeting will take
  place at the Universidad Nacional Autónoma de México (UNAM) in Mexico City.
  This workshop aims to promote interactions and catalyze collaborations between
  theorists and experimentalists seeking to advance frontiers of molecular
  science where novel quantum mechanical effects play an important role. The
  theme is Quantum Molecular Design: leveraging molecular structure to give rise
  to novel quantum functionality, including applications in quantum sensing,
  quantum information processing, or enhanced quantum materials capabilities.'
