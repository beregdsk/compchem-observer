description: The 27th International Conference on Horizons in Hydrogen Bond
  Research (HBOND 2027) will be held at the Indian Institute of Science
  Education and Research (IISER) Pune, India, from September 20–24, 2027.
  Celebrating the Golden Jubilee (50th anniversary) of the HBOND conference
  series, this event will feature keynote and invited lectures, contributed
  talks, poster sessions, and an Early-Career Researchers’ Workshop, bringing
  together researchers working across diverse areas of hydrogen bond research.
