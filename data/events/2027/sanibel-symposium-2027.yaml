description: The sixty-sixth Sanibel Symposium, a theory meeting running since
  1961 on the quantum theory of atoms, molecules and materials. 2027 themes span
  machine learning and quantum computing, density functional theory, quantum
  dynamics, sampling of complex energy landscapes, electronic resonances, a
  retrospective on conventional computers in molecular quantum mechanics,
  magnetic molecules and materials, and electronic structure in gas-phase,
  condensed matter, and biochemical contexts.
