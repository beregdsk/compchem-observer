description: The 6th European Conference on Physical Chemistry (ECPC27),
  organised under the EuChemS Division of Physical Chemistry, brings together
  researchers to discuss advances in physical chemistry. The scientific
  programme covers theory, simulation and machine learning; molecular
  spectroscopy, photochemistry and ultrafast processes; surfaces, interfaces and
  nanomaterials; colloids, soft matter, biophysical chemistry; electrochemistry;
  energy; green chemistry; photocatalysis, catalysis; and emerging
  interdisciplinary areas.
