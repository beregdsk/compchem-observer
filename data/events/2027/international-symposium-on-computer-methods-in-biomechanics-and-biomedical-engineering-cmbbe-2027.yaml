description: "The International Symposium on Computer Methods in Biomechanics
  and Biomedical Engineering (CMBBE) will be held in Ghent, Belgium, from 6 to 9
  April 2027. A special session on 'The mechanics of biomolecular systems:
  computational insights into biological function' focuses on molecular-scale
  computational methods and biomechanics. It covers biomolecular simulations,
  enhanced sampling, multiscale approaches, and molecular mechanics underlying
  drug delivery, aiming to advance understanding of biological mechanisms at the
  atomic/molecular scale."
