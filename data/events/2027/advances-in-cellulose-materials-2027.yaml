description: The Advances in Cellulose Materials GRC is a premier international
  scientific conference focused on advancing the frontiers of science through
  presentation of cutting‑edge and unpublished research on cellulose and
  biomass‑derived materials. Topics include biosynthesis, molecular structure,
  self‑assembly, chemical modification, characterization, in‑silico modeling,
  nanocellulose gelation, circular design, functional materials, and large‑scale
  production. The conference fosters interdisciplinary collaboration and
  informal networking.
