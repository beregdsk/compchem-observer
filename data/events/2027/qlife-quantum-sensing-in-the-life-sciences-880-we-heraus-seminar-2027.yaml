description: The seminar brings together leading scientists and early-career
  researchers at the intersection of quantum sensing and the life sciences,
  representing a wide range of disciplines. The aim is to discuss recent
  experimental and theoretical advances and explore novel routes to deploy
  quantum technologies in the life sciences, use biomolecules as quantum
  sensors, and address key problems in medicine. These questions will be
  addressed through perspective talks, research presentations, hot-topic talks,
  and extended joint discussion sessions.
