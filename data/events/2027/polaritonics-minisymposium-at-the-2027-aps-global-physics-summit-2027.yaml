description: The Polaritonics Minisymposium, organized by the APS Division of
  Chemical Physics at the 2027 APS Global Physics Summit, brings together recent
  advances in molecular polaritons across molecular physics, chemical physics,
  photonics, and spectroscopy. It welcomes contributions on exciton-polaritons,
  polariton transport, vibrational polaritons, polariton chemistry, nanophotonic
  and plasmonic platforms, chiral light-matter interactions, and theoretical
  approaches to collective light-matter coupling.
