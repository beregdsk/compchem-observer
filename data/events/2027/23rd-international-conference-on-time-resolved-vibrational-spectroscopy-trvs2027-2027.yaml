description: The 23rd International Conference on Time-Resolved Vibrational
  Spectroscopy (TRVS2027) brings together researchers in vibrational
  spectroscopy, ultrafast science, and chemical physics. Topics include
  ultrafast vibrational dynamics, multidimensional spectroscopy, THz science,
  vibrational imaging, near-field optics, vibronic dynamics, and vibrational
  strong coupling. The event will be held in La Jolla, CA, USA, from July 26 to
  30, 2027.
