description: DigiChem'27, the first RACI conference on robotics, automation and
  machine learning in chemistry, will be held at Monash University Melbourne CBD
  on 22–23 February 2027. It brings together academic and industry researchers
  to discuss advances in robotic synthesis, automated analysis, experimental
  planning and machine learning, with plenary and invited talks, posters, a
  vendor exhibition and networking.
