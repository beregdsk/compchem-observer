description: The 8th European Inorganic Chemistry Conference (EICC8) is the
  European Chemical Society (EuChemS) flagship meeting of its Inorganic
  Chemistry Division. It showcases recent and exciting advances across inorganic
  chemistry in Europe, with sessions on organometallics, catalysis,
  magnetochemistry, photophysics, MOFs, solid-state materials, theoretical,
  green, and bioinorganic chemistry.
