description: The 8th European Inorganic Chemistry Conference (EICC8) is the
  flagship meeting of the EuChemS Inorganic Chemistry Division, showcasing
  recent advances across the broad field of inorganic chemistry. The sessions
  cover eight thematic areas, including organometallics and catalysis,
  magnetochemistry, photophysics, MOFs, solid-state materials, theoretical
  inorganic chemistry, green chemistry, and bioinorganic chemistry.
