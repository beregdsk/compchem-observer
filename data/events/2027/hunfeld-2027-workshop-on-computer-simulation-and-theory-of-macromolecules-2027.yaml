description: The Hünfeld 2027 workshop focuses on computer simulation and theory
  of macromolecules, bringing together researchers in biomolecular simulation.
  The meeting will take place on March 19–20, 2027, in a hybrid format with
  on‑site attendance at the Hünfeld Monastery and a virtual option. It features
  invited talks, contributed presentations, and a poster session, with an
  emphasis on fostering exchange within the German and international
  biomolecular theory and simulation communities. Online participation is free,
  and affordable accommodation is available for on‑site attendees.
