description: The Hünfeld 2027 workshop focuses on computer simulation and theory
  of macromolecules, promoting exchange among the biomolecular theory and
  simulation communities. Held in a hybrid format at the Hünfeld Monastery and
  online, it features talks, poster sessions, and aims to be inclusive and
  affordable for students and postdocs.
