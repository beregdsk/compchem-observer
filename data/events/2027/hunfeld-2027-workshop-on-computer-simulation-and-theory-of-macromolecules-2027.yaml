description: The Hünfeld 2027 workshop on Computer Simulation and Theory of
  Macromolecules will take place on March 19-20, 2027, in Hünfeld, Germany, with
  hybrid participation. The event brings together researchers to discuss recent
  advances in theory and applications of biomolecular simulations, featuring
  keynote speaker Prof. Dr. Reinhard Lipowsky, poster sessions, and affordable
  accommodations for students. Online participation is free.
