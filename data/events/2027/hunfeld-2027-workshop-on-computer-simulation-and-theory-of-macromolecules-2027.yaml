description: The Hünfeld 2027 workshop on Computer Simulation and Theory of
  Macromolecules will take place on March 19-20, 2027, at the Hünfeld Monastery
  in Germany. Organized by Volkhard Helms and Helmut Grubmüller, the event
  focuses on recent advances in theory and application of biomolecular
  simulations. It features keynote speaker Prof. Dr. Reinhard Lipowsky, poster
  sessions, and offers both on-site and hybrid online participation options to
  facilitate inclusive discussions.
