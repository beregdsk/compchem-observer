description: The Hünfeld 2027 workshop focuses on computer simulation and theory
  of macromolecules, covering recent advances in biomolecular simulations. It
  will be held on March 19-20, 2027, at the Hünfeld Monastery in Germany, with
  hybrid participation. Keynote speaker is Prof. Dr. Reinhard Lipowsky. The
  program includes oral sessions, poster presentations, and affordable
  accommodations.
