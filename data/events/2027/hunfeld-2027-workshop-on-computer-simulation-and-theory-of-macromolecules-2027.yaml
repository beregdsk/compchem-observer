description: Hünfeld 2027 is a workshop on the computer simulation and theory of
  macromolecules, focusing on recent advances in biomolecular theory and
  simulation. Scheduled for March 19-20, 2027, at the Hünfeld Monastery in
  Germany, the event will be held in a hybrid format. It features keynote
  speaker Prof. Dr. Reinhard Lipowsky, oral presentations, and poster sessions,
  with affordable on-site options and free online participation to ensure
  inclusivity.
