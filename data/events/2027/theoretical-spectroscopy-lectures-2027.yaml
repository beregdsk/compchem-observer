description: This school covers ab initio methods for predicting spectroscopy
  beyond ground-state DFT, focusing on Time-Dependent Density-Functional Theory
  (TDDFT) and Many-Body Perturbation Theory (MBPT), including Green's function
  methods. It also introduces modern topics like machine learning for valence
  and core-level spectroscopy, X-ray spectroscopies (including RIXS), and
  automated workflows for ab initio simulations. The school combines theoretical
  lectures with hands-on computational sessions using state-of-the-art codes.
