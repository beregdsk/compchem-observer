description: The 6th European Conference on Physical Chemistry (ECPC27) is an
  international scientific conference organized under the EuChemS Division of
  Physical Chemistry. It brings together researchers from academia, research
  institutes, and industry to discuss advances in physical chemistry, including
  theory, simulation, machine learning, spectroscopy, photochemistry, surfaces,
  soft matter, biophysical chemistry, electrochemistry, and catalysis.
