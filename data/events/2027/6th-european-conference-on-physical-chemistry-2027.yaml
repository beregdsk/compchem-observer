description: The 6th European Conference on Physical Chemistry (ECPC27) is an
  international scientific conference organised under the EuChemS Division of
  Physical Chemistry. It aims to bring together researchers from academia,
  research institutes and industry to present and discuss current advances
  across physical chemistry, promote interdisciplinary exchange, and establish
  new European and international collaborations. The scientific programme covers
  Theory, Simulation and Machine Learning, spectroscopy, photochemistry,
  surfaces, soft matter, electrochemistry, energy, catalysis, and more.
