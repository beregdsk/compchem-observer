description: The 6th European Conference on Physical Chemistry (ECPC27),
  organized by the EuChemS Division of Physical Chemistry, brings together
  researchers from academia, research institutes, and industry to discuss
  advances in physical chemistry. The scientific programme covers theory,
  simulation, machine learning, spectroscopy, photochemistry, surfaces,
  interfaces, nanomaterials, colloids, soft matter, biophysical chemistry,
  electrochemistry, energy, green chemistry, catalysis, and emerging
  interdisciplinary areas.
