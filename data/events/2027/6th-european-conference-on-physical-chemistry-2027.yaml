description: The 6th European Conference on Physical Chemistry (ECPC27) is an
  international conference organised under the EuChemS Division of Physical
  Chemistry. It brings together researchers to discuss advances in physical
  chemistry, promote interdisciplinary exchange, and establish collaborations.
  The programme covers theory, simulation, machine learning, spectroscopy,
  photochemistry, surfaces, interfaces, nanomaterials, soft matter, biophysical
  chemistry, electrochemistry, energy, green chemistry, and catalysis.
