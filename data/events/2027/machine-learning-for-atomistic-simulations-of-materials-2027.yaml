description: This summer school focuses on the theoretical foundations and
  practical implementation of machine learning for atomistic simulations of
  materials. Lectures cover the construction of ML interatomic potentials,
  representations of atomic environments, learning algorithms, validation
  strategies, and applications to diverse materials classes, emphasizing the
  integration of ML with established atomistic simulation methods.
