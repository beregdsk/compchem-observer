description: This workshop covers quantum materials, particularly f-electron
  systems, exhibiting exotic behaviors like superconductivity, topological
  states, and strong correlations. It brings together international scientists
  from the US, Canada, Germany, and Austria to bridge the transatlantic divide,
  foster cross-disciplinary collaboration between chemistry and physics, and
  address key open questions in fundamental and functional quantum materials.
