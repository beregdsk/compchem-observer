description: The workshop offers hands-on training on the FLEUR code, an
  all-electron full-potential linearized augmented-plane-wave (FLAPW)
  implementation. Density functional theory (DFT) is the standard for predicting
  electronic, magnetic, and structural properties of materials, and FLAPW is a
  robust, precise method for DFT calculations on crystals, surfaces, and thin
  films. The training is designed to help users master these techniques and
  interact directly with the developers of the code.
