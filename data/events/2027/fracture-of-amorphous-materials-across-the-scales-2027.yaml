description: Workshop on reducing carbon emissions in scientific computing by
  applying the 4R strategy (Refuse, Reuse, Reduce, Repair) to the multiscale
  simulation of fracture in amorphous materials. It addresses challenges in
  interdisciplinary communication, collaborative multiscale modeling, and
  standardized FAIR data sharing through plenary talks, brainstorming, and
  hands-on tutorials.
