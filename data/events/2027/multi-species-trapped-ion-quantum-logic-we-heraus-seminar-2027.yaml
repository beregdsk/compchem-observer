description: This seminar brings together experts to explore synergies in
  multi-species trapped-ion quantum systems. Topics include single-ion optical
  clocks, quantum logic spectroscopy of highly charged and molecular ions,
  quantum computing with multiple species to mitigate crosstalk and enable
  sympathetic cooling, and quantum logic detection of chemical reactions. By
  addressing challenges like mixed-species crystal dynamics, we aim to foster
  collaboration and identify synergies in quantum control of internal and
  external degrees of freedom.
