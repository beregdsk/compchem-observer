description: The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will be held in Alcalá de Henares, Spain, from June 27 to July 2, 2027.
  Following successful meetings in Lisbon, Strasbourg, and Belgrade, the
  conference highlights the role of noncovalent interactions in synthesis,
  catalysis, crystal engineering, molecular recognition, medicinal chemistry,
  biology, and materials science, including theoretical approaches. Abstract
  submission deadline is March 16, 2027.
