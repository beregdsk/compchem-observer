description: '4th International Conference on Noncovalent Interactions (ICNI IV)
  in Alcalá de Henares, Spain, June 27-July 2, 2027. Focuses on role of
  noncovalent interactions in synthesis, catalysis, crystal engineering,
  molecular recognition, medicinal chemistry, biology, materials science, and
  theoretical approaches. Welcomes all perspectives, with emphasis on emerging
  interactions and interdisciplinary work. Abstract deadline: March 16, 2027.'
