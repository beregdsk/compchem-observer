description: 'The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will take place in Alcalá de Henares, Spain, from June 27 to July 2, 2027.
  The conference highlights the role of noncovalent interactions in synthesis,
  catalysis, crystal engineering, molecular recognition, medicinal chemistry,
  biology, materials science, and related areas, including theoretical
  approaches. All perspectives are welcome, with special attention to emerging
  types of noncovalent interactions and interdisciplinary work. Abstract
  submission deadline: March 16, 2027.'
