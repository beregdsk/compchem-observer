description: The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will be held in Alcalá de Henares, Spain, from June 27 to July 2, 2027.
  The conference highlights the role of noncovalent interactions across
  synthesis, catalysis, crystal engineering, molecular recognition, medicinal
  chemistry, biology, and materials science, including theoretical approaches.
  It welcomes all perspectives from fundamental to applied research, with
  special attention to emerging types of noncovalent interactions and
  interdisciplinary work. Abstract submission deadline is March 16, 2027.
