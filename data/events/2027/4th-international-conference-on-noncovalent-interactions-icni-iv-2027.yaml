description: 'The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will take place from June 27 to July 2, 2027, in Alcalá de Henares, Spain.
  The conference highlights the role of noncovalent interactions in synthesis,
  catalysis, crystal engineering, molecular recognition, medicinal chemistry,
  biology, and materials science, including theoretical approaches. It welcomes
  fundamental and applied research, with special attention to emerging
  noncovalent interactions and interdisciplinary work. Abstract submission
  deadline: March 16, 2027.'
