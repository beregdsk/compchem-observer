description: 'The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will take place in Alcalá de Henares, Spain, from 27 June to 2 July 2027.
  It highlights the role of noncovalent interactions in synthesis, catalysis,
  crystal engineering, molecular recognition, medicinal chemistry, biology, and
  materials science, including theoretical approaches. Abstract deadline: 16
  March 2027.'
