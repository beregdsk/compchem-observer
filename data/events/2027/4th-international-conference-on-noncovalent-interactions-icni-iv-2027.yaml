description: The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will be held from June 27 to July 2, 2027, at the Universidad de Alcalá de
  Henares in Spain. The conference highlights the role of noncovalent
  interactions in synthesis, catalysis, crystal engineering, molecular
  recognition, medicinal chemistry, biology, and materials science, including
  theoretical approaches. The deadline for submitting abstracts is March 16,
  2027.
