description: 'The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will be held in Alcalá de Henares, Spain, from 27 June to 2 July 2027. It
  highlights the role of noncovalent interactions in synthesis, catalysis,
  crystal engineering, molecular recognition, medicinal chemistry, biology, and
  materials science, including theoretical approaches. The conference welcomes
  fundamental and applied research, with special attention to emerging
  noncovalent interactions and interdisciplinary work. Abstract deadline: 16
  March 2027.'
