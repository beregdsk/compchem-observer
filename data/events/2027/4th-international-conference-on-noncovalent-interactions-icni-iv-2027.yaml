description: The 4th International Conference on Noncovalent Interactions (ICNI
  IV) will take place from June 27 to July 2, 2027, in Alcalá de Henares, Spain.
  Following successful meetings in Lisbon, Strasbourg, and Belgrade, this
  conference highlights the role of noncovalent interactions across synthesis,
  catalysis, crystal engineering, molecular recognition, medicinal chemistry,
  biology, and materials science. It welcomes fundamental and applied research,
  with special attention to emerging noncovalent interactions, theoretical
