description: 4th International Conference on Noncovalent Interactions (ICNI IV)
  in Alcalá de Henares, Spain, 27 Jun – 2 Jul 2027. The meeting highlights
  noncovalent interactions in synthesis, catalysis, crystal engineering,
  molecular recognition, medicinal chemistry, biology, and materials science,
  including theoretical approaches. All perspectives are welcome, with special
  attention to emerging interactions and interdisciplinary work.
