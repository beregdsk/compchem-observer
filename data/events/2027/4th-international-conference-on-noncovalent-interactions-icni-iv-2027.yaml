description: The 4th International Conference on Noncovalent Interactions (ICNI
  IV) seeks to highlight the role of noncovalent interactions in synthesis,
  catalysis, crystal engineering, molecular recognition, medicinal chemistry,
  biology, and materials science, including theoretical approaches. All
  perspectives, from fundamental studies to applied research, are welcome, with
  special attention to emerging types of noncovalent interactions and
  interdisciplinary work.
