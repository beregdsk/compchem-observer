description: VTCC 2026 is an international virtual conference for researchers in
  theoretical and computational chemistry, covering quantum chemistry, molecular
  modeling, computational biochemistry, molecular dynamics, spectroscopy,
  materials modeling, machine learning in chemistry, and QM/MM. Invited speakers
  include Prof. Dr. Stefan Grimme and Prof. Dr. Artem R. Oganov. Participants
  can submit abstracts for oral presentations or publication in the proceedings.
  The submission deadline is December 7, 2026, 23:59 CET. Submission is via
  Telegram or web form. Participation is free.
