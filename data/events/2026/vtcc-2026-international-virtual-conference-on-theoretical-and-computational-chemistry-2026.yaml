description: 'VTCC 2026 is an international virtual conference on theoretical
  and computational chemistry, covering quantum chemistry, molecular modeling,
  computational biochemistry, molecular dynamics, spectroscopy, materials
  modeling, machine learning, and QM/MM. Invited speakers include Prof. Dr.
  Stefan Grimme and Prof. Dr. Artem R. Oganov. Abstracts are invited for oral
  presentations or publication. Deadline: December 7, 2026, 23:59 CET.
  Submission via Telegram is preferred, with an alternative web form.
  Participation is free.'
