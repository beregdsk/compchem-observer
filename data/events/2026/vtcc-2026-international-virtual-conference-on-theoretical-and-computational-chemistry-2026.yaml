description: 'VTCC 2026 is an international virtual conference for researchers
  in theoretical and computational chemistry, including quantum chemistry,
  molecular modeling, computational biochemistry, molecular dynamics,
  spectroscopy, materials modeling, machine learning in chemistry, and QM/MM.
  Held on December 21, 2026. Confirmed invited speakers: Prof. Dr. Stefan Grimme
  (University of Bonn, Germany) and Prof. Dr. Artem R. Oganov (Skoltech,
  Russia). Submit abstracts for oral presentation or publication. Deadline:
  December 7, 2026. Via Telegram or web form. Free participation.'
