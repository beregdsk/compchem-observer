description: VTCC 2026 is a new international virtual conference for researchers
  in theoretical and computational chemistry, covering quantum chemistry,
  molecular modeling, computational biochemistry, molecular dynamics,
  spectroscopy, materials modeling, machine learning in chemistry, and QM/MM.
  Confirmed speakers include Prof. Dr. Stefan Grimme and Prof. Dr. Artem R.
  Oganov. Abstracts can be submitted for oral presentations or publication in
  the proceedings. The submission deadline is December 7, 2026, and
  participation is free.
