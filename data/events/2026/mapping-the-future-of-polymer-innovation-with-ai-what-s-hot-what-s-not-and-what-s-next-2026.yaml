description: A free webinar organized by the American Chemical Society (ACS)
  dedicated to the use of artificial intelligence for analyzing scientific and
  technological trends in polymer materials. Representatives of CAS and the
  Shanghai Institute of Advanced Materials of PetroChina (SAMRI) will explain
  how AI and natural language processing methods can analyze nearly a million
  scientific publications and patents to identify promising research areas and
  assess their commercial potential.
