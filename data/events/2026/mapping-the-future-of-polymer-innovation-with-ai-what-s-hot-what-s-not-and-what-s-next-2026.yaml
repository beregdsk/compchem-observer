description: An ACS Webinar co-produced with CAS, a division of the American
  Chemical Society, and the PetroChina Shanghai Advanced Materials Research
  Institute (SAMRI). Experts will illustrate how artificial intelligence and
  natural language processing, applied to nearly 1 million polymer publications
  and patents, reveal emerging topics in energy storage, sustainable polymers,
  flexible electronics, membranes, and frontier materials classes.
