description: Online hands-on course providing practical training in analysing
  mass spectrometry-based subcellular spatial proteomics data using
  R/Bioconductor. Participants will learn key steps in data processing, quality
  control, visualization, protein annotation, and machine learning-based
  localization prediction. Aimed at proteomics researchers and
  bioinformaticians; basic R knowledge recommended.
