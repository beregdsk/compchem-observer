description: The Young Modellers' Forum (YMF) is the annual flagship event of
  the MGMS, marking its 30th edition in 2026. It will be held on 20 November at
  Lady Margaret Hall, University of Oxford. The forum is a free-to-attend event
  for PhD students working in computational chemistry and biology, featuring 12
  oral presentations, 12 poster presentations with lightning talks, and prizes
  for the best presentations. Abstract submission deadline is 16 October 2026.
