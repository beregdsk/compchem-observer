description: >-
  Cavendish Lecture by Prof. Nicola Marzari, Wed 14 October, 4.15pm (London
  time)


  Dear Psi-k’ers,


  Nicola Marzari will be giving his lecture as the new Cavendish Professor of
  Physics at the University of Cambridge on Wed Oct 14, at 4.15pm (London time).
  For those of you local, you’d be very welcome to attend in person (all info
  below). There will also be a webinar streamed at
  https://cam-ac-uk.zoom.us/j/84694774461?pwd=6qbC8FCSBIRIOwIChC4FvDaVdxtsmP.1.
  Again, all are welcome, though sadly there will be no remote questions.


  With best regards,


  Christoph Schran

  on behalf of TCM, Cavendish Laboratory


  ------------------------------------------------------------------------


  Venue and Time: Wednesday 14 October 2026, 16:15, Ray Dolby Auditorium, Ray
  Dolby Centre, Cavendish Laboratory, JJ Thomson Avenue, CB3 0US.


  Speaker: Prof. Nicola Marzari, Cavendish Professor of Physics, University of
  Cambridge


  Title: Materials from First Principles: From Pseudogaps to Autonomous
  Discovery


  Abstract: Materials underpin many of the technologies that drive our economy
  and sustain our society, and never cease to present us with new scientific
  challenges. Providing reliable, predictive descriptions of their behaviour
  from first principles remains a defining goal for condensed matter physics and
  materials science. This goal is made increasingly compelling by the
  convergence of digital and quantum computing, machine learning, and artificial
  intelligence, which are transforming the scale and scope of theoretical and
  computational research aimed at understanding, predicting, and designing
  materials properties.


  I will discuss progress along three directions. First, I will address
  predictive accuracy, focusing on the development of dynamical functional
  theories for electronic excitations and correlations. Second, I will consider
  realistic complexity, introducing mesoscopic theories that bridge microscopic
  equations and macroscopic transport. Third, I will explore materials
  informatics, examining how automation, agency, and autonomy will enable
  campaigns of materials discovery.


  Together, these directions draw on remarkable advances in theory, algorithms,
  and computing paradigms to harness the predictive power of quantum mechanics
  to address the complexity of the real world.


