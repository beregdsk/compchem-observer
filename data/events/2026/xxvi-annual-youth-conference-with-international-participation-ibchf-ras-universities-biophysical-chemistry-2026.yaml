description: The XXVI Annual Youth Conference with International Participation
  'IBChF RAS-universities 'Biophysical Chemistry'' will take place in Moscow
  from November 24 to 26, 2026. It covers sections on physical and quantum
  chemistry, AI in materials science, biochemistry, biophysics, biology, polymer
  chemistry, and food chemistry. Open to young scientists up to 35 (PhD) and 39
  (DSc) years old. Abstract submission deadline is November 1, 2026. No
  registration fee.
