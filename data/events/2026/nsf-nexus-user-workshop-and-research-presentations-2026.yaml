description: NSF NeXUS User Workshop held October 15-16, 2026 on The Ohio State
  University campus, with a special focus on quantum applications of ultrafast
  science and AI-enabled ultrafast science. Plenary presentations by Lin X. Chen
  (Northwestern University / Argonne National Laboratory) and Michael
  Wasielewski (Northwestern University), with invited speakers Aditi
  Bhattacherjee, Michael Chini, Joseph Perry Corbett, and Alice Kunin, and
  breakout sessions led by Saw-Wai Hla, Kenneth Knappenberger, and Bryan
  Kudisch; James McCusker moderates the plenary. Sessions are live-streamed
  (hybrid).
