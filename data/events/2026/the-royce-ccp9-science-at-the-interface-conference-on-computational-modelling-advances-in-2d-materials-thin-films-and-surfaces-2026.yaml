description: The Royce/CCP9 Science at the Interface Conference on Computational
  Modelling Advances in 2D Materials, Thin Films and Surfaces is a one-day
  conference at the National Graphene Institute on 13 November 2026. It brings
  together the computational materials community to explore modelling of flat
  interfaces across 2D materials, thin films and metal surfaces. Key themes
  include lattice mismatch, scalable machine-learning interatomic potentials,
  and electronic-structure methods, with invited talks, flash presentations, and
  a panel discussion.
