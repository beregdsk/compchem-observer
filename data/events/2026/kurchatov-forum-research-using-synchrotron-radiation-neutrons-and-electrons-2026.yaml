description: The IV International Forum of Biomimetic Technologies — Kurchatov
  Forum 'Research using synchrotron radiation, neutrons and electrons' will be
  held in Moscow from November 11 to 13, 2026. The event focuses on megascience
  infrastructure, synchrotron and neutron methods in materials science, biology,
  and cultural heritage, as well as computational methods and AI. It includes
  roundtables, poster sessions, and a school for young scientists. Attendance is
  free.
