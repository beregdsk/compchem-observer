description: The IV International Forum of Nature-Like Technologies — Kurchatov
  Forum 'Research Using Synchrotron Radiation, Neutrons and Electrons' will be
  held in Moscow, Russia, from November 11-13, 2026. The forum focuses on
  synchrotron and neutron methods in materials science, structural biology,
  cultural heritage, and computational methods including AI. It includes
  roundtables, poster sessions, a school for young scientists, and symposia.
  Registration and abstract submission deadline is October 21, 2026.
  Participation is free and in-person only. Working language is Russian.
