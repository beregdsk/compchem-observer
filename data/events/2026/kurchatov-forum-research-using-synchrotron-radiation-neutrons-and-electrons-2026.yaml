description: The Kurchatov Forum 'Research using Synchrotron Radiation, Neutrons
  and Electrons' will be held in Moscow from November 11 to 13, 2026. Focusing
  on megascience infrastructure, synchrotron and neutron methods in materials
  science, biology, and cultural heritage, the forum also highlights
  computational methods, AI, and digital infrastructure. It features
  roundtables, poster sessions, and a school for young scientists. Attendance is
  free, and the working language is Russian.
