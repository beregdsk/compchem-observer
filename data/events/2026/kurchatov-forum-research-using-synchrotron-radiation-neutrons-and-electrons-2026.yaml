description: The IV International Forum of Biomimetic Technologies — Kurchatov
  Forum 'Research using synchrotron radiation, neutrons and electrons' will take
  place in Moscow from November 11 to 13, 2026. The event focuses on synchrotron
  and neutron methods in materials science, structural biology, microscopy,
  time-resolved techniques, and computational/AI methods in megascience. The
  program includes round tables, poster sessions, and a school for young
  scientists. Registration is free, with abstract submission deadline on October
  21, 2026. The working language is Russian.
