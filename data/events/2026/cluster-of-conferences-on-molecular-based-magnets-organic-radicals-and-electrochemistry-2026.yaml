description: A cluster of conferences including the XI International Conference
  on High-Spin Molecules and Molecular Magnets (MolMag-2026) and the VI
  All-Russian Conference on Organic Radicals and Organic Electrochemistry
  (OR-2026). The event covers topics such as organic radicals, molecular
  magnets, electrochemistry, spintronics, molecular electronics, quantum
  technologies, and energy storage devices. It will be held as part of Kazan
  Science Week 2026.
